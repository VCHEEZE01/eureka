<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUREKA - 타겟 설정</title>
  <!-- Google Fonts: IBM Plex Sans KR & Iceland -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      font-family: 'IBM Plex Sans KR', sans-serif;
      background: linear-gradient(180deg, #EBF4FC 0%, #F6F5FD 100%);
      color: #333;
      overflow-x: hidden;
      overflow-y: auto;
      /* 화면 확대/축소 시 하단 내용을 볼 수 있도록 자동 세로 스크롤 생성 */
    }

    /* 100% 풀 위드 섹션 & 중앙 1440px 인너 래퍼 */
    .section-full {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .inner-content {
      width: 1440px;
      min-height: 1024px;
      position: relative;
      flex-shrink: 0;
    }

    /* 상단 고정 헤더 GNB 바 */
    .fixed-gnb {
      width: 100%;
      height: 75px;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      background: rgba(246, 245, 253, 0.60);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000001;
      border: none !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .fixed-gnb-inner {
      width: 1312px;
      max-width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    @media (max-width: 1440px) {
      .fixed-gnb-inner {
        width: 100%;
        padding: 0 64px;
      }
    }

    /* 상단 헤더 메뉴 호버 효과 */
    .nav-item {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .nav-item:hover {
      opacity: 0.7;
    }

    /* 칩 버튼 스타일 (기본 & 활성화 보라색 state) */
    .chip-btn {
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-family: 'IBM Plex Sans KR', sans-serif;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 미선택 상태 (기본 회색) */
    .chip-btn:not(.active) {
      background: #EDEDED;
      color: #727272;
    }

    .chip-btn:not(.active):hover {
      background: #E2E2E2;
      color: #333;
    }

    /* 선택 상태 (활성화 보라색 #6B42FF) */
    .chip-btn.active {
      background: #6B42FF !important;
      color: #FFFFFF !important;
      box-shadow: 0px 4px 10px rgba(107, 66, 255, 0.25);
    }

    .group-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }

    .group-help {
      color: #888;
      font-size: 14px;
      font-weight: 400;
    }

    .selection-status {
      min-height: 22px;
      margin-top: 18px;
      color: #6B42FF;
      font-size: 13px;
      font-weight: 500;
    }

    .selection-error {
      min-height: 20px;
      margin-top: 12px;
      color: #E5484D;
      font-size: 13px;
      font-weight: 500;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .target-field {
      min-width: 0;
    }

    .field-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    .field-label {
      color: #111;
      font-size: 18px;
      font-weight: 600;
    }

    .field-hint {
      color: #8A8F9A;
      font-size: 12px;
      font-weight: 400;
    }

    .target-select,
    .token-input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #DBDFE7;
      border-radius: 10px;
      background: #FAFBFD;
      color: #333;
      font-family: 'IBM Plex Sans KR', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .target-select {
      padding: 0 15px;
      cursor: pointer;
    }

    .target-select:focus,
    .token-input-shell:focus-within {
      border-color: #6B42FF;
      box-shadow: 0 0 0 3px rgba(107, 66, 255, 0.1);
    }

    .target-select.invalid,
    .token-input-shell.invalid {
      border-color: #E5484D;
    }

    .token-input-shell {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      min-height: 52px;
      padding: 7px 10px;
      border: 1px solid #DBDFE7;
      border-radius: 10px;
      background: #FAFBFD;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .token-input {
      flex: 1;
      width: auto;
      min-width: 190px;
      min-height: 34px;
      padding: 0 5px;
      border: 0;
      background: transparent;
      box-shadow: none !important;
    }

    .token-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px 7px 13px;
      border-radius: 30px;
      background: #F2EEFF;
      color: #5B35DF;
      font-size: 13px;
      font-weight: 600;
    }

    .token-remove {
      border: 0;
      background: transparent;
      color: #7B64D7;
      font: inherit;
      line-height: 1;
      cursor: pointer;
    }

    .target-divider {
      width: 100%;
      height: 1px;
      margin: 28px 0;
      background: rgba(235, 235, 235, 0.9);
    }

    .target-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
    }

    .progress-dot {
      width: 26px;
      height: 6px;
      border-radius: 8px;
      background: #E3E5EA;
    }

    .progress-dot.filled {
      background: #6B42FF;
    }

    [data-속성-1].disabled {
      background: #C8CBD3 !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
      transform: none !important;
    }

    /* 버튼 호버 효과 */
    [data-속성-1] {
      transition: all 0.25s ease;
      cursor: pointer;
    }

    [data-속성-1]:hover {
      transform: translateY(-2px);
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.15) !important;
    }

    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */
    @media (max-width: 800px) {
      .fixed-gnb-inner { width: 100%; padding: 0 20px; }
      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }
      .fixed-gnb .nav-item { display: none; white-space: nowrap; }
    }
  </style>
</head>

<body>

  <!-- 상단 화면 전체(100%) 고정 네비게이션 바 -->
  <div class="fixed-gnb">
    <div class="fixed-gnb-inner">
      <div style="justify-content: flex-start; align-items: center; gap: 50px; display: flex">
        <div onclick="goHome()" title="홈으로 이동"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; word-wrap: break-word; cursor: pointer;">
          EUREKA</div>
        <div class="nav-item"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word">
          커뮤니티</div>
        <div class="nav-item"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word">
          요금제</div>
      </div>
      <div style="justify-content: flex-start; align-items: center; gap: 48px; display: flex">
        <div class="nav-item"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word">
          로그인</div>
        <div class="nav-item"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word">
          마이페이지</div>
      </div>
    </div>
  </div>

  <!-- 메인 2번 타겟 설정 온보딩 섹션 -->
  <div class="section-full">
    <div class="inner-content">

      <!-- 서브타이틀 -->
      <div
        style="width: 100%; left: 0; top: 180px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #4262FF; font-size: 16px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 30px;">
        타겟 설정
      </div>

      <!-- 메인 타이틀 -->
      <div
        style="width: 100%; left: 0; top: 225px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 40px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; line-height: 30px;">
        누구의 문제를 찾고 있나요?
      </div>

      <div id="target-help"
        style="width: 100%; left: 0; top: 278px; position: absolute; text-align: center; color: #666; font-size: 15px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400;">
        입력한 조건과 관련된 업무·생활 속 불편을 찾아요. 최소 2개를 입력해 주세요.<br>수집한 글에서 같은 경험자의 조건을 확인합니다.
      </div>

      <!-- 중앙 1004px x 621px 흰색 카드 박스 -->
      <div
        style="width: 1004px; height: 621px; left: 218px; top: 335px; position: absolute; background: white; box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04); border-radius: 20px; padding: 48px 58px; box-sizing: border-box;">

        <div class="target-grid">
          <div class="target-field">
            <div class="field-heading">
              <label class="field-label" for="age-input">나이대</label>
              <span class="field-hint">선택</span>
            </div>
            <select class="target-select" id="age-input" onchange="handleSelectChange()">
              <option value="">미선택</option>
              <option value="10대">10대</option>
              <option value="20대">20대</option>
              <option value="30대">30대</option>
              <option value="40대">40대</option>
              <option value="50대 이상">50대 이상</option>
            </select>
          </div>

          <div class="target-field">
            <div class="field-heading">
              <label class="field-label" for="gender-input">성별</label>
              <span class="field-hint">선택</span>
            </div>
            <select class="target-select" id="gender-input" onchange="handleSelectChange()">
              <option value="">미선택</option>
              <option value="여성">여성</option>
              <option value="남성">남성</option>
            </select>
          </div>
        </div>

        <div class="target-divider"></div>

        <div class="target-field" style="margin-bottom: 24px;">
          <div class="field-heading">
            <label class="field-label" for="jobs-input">직업</label>
            <span class="field-hint">입력 후 Enter · 최대 5개</span>
          </div>
          <div class="token-input-shell" id="jobs-shell">
            <div id="jobs-tokens" style="display: contents;"></div>
            <input class="token-input" id="jobs-input" type="text"
              placeholder="예: 간호사, 프리랜서 디자이너"
              onkeydown="handleTokenKeydown(event, 'jobs')" oninput="clearAttemptState()" />
          </div>
        </div>

        <div class="target-field">
          <div class="field-heading">
            <label class="field-label" for="places-input">장소</label>
            <span class="field-hint">입력 후 Enter · 최대 5개</span>
          </div>
          <div class="token-input-shell" id="places-shell">
            <div id="places-tokens" style="display: contents;"></div>
            <input class="token-input" id="places-input" type="text"
              placeholder="예: 사무실, 병원, 학교, 원룸"
              onkeydown="handleTokenKeydown(event, 'places')" oninput="clearAttemptState()" />
          </div>
        </div>

        <div class="target-progress">
          <div>
            <div class="selection-status" id="selection-status" style="margin-top: 0;">0 / 4 항목 입력</div>
            <div class="selection-error" id="selection-error" role="alert" style="margin-top: 2px;"></div>
          </div>
          <div class="progress-dots" id="progress-dots" aria-label="입력 항목 수">
            <span class="progress-dot"></span><span class="progress-dot"></span>
            <span class="progress-dot"></span><span class="progress-dot"></span>
          </div>
        </div>
      </div>

      <!-- 우측 하단 "문제 탐색" 보라색 버튼 -->
      <div data-속성-1="베리언트2" id="start-search-btn" class="disabled" onclick="startSearch()" aria-disabled="true"
        style="width: 190px; height: 56px; padding: 13px 20px; left: 958px; top: 850px; position: absolute; background: #6B42FF; border-radius: 10px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; cursor: pointer;">
        <div
          style="text-align: center; color: white; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; letter-spacing: 1px;">
          문제 정의 탐색
        </div>
      </div>

    </div>
  </div>

  <script>
    // EUREKA 클릭 시 1번 홈 화면으로 이동
    function goHome() {
      parent.__navigate('index.html');
    }

    if (parent.__dataMode !== 'live') document.getElementById('target-help').textContent = '오프라인 검토 파일입니다. 조건을 입력해도 새로 수집하지 않으며, 파일에 포함된 결과만 확인합니다.';
    const TARGET_MIN_FILLED = 2;
    const TARGET_TOKEN_MAX = 5;
    const targetState = { age: '', gender: '', jobs: [], places: [] };
    let attempted = false;

    function filledCount() {
      return Number(Boolean(targetState.age))
        + Number(Boolean(targetState.gender))
        + Number(targetState.jobs.length > 0)
        + Number(targetState.places.length > 0);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderTokens(field) {
      const container = document.getElementById(`${field}-tokens`);
      container.innerHTML = targetState[field].map((token, index) => `
        <span class="token-chip">
          ${escapeHtml(token)}
          <button type="button" class="token-remove" data-field="${field}" data-index="${index}"
            aria-label="${escapeHtml(token)} 삭제">×</button>
        </span>
      `).join('');
      container.querySelectorAll('.token-remove').forEach(button => {
        button.addEventListener('click', () => removeToken(button.dataset.field, Number(button.dataset.index)));
      });
    }

    function removeToken(field, index) {
      targetState[field].splice(index, 1);
      attempted = false;
      renderTokens(field);
      updateFormState();
      document.getElementById(`${field}-input`).focus();
    }

    function addToken(field, rawValue) {
      const value = rawValue.trim().replace(/\s+/g, ' ');
      if (!value) return '';
      if (value.length > 30) { updateFormState('키워드는 30자 이내로 입력해 주세요.'); return rawValue; }
      if (targetState[field].includes(value)) {
        updateFormState('이미 등록된 키워드예요.');
        return '';
      }
      if (targetState[field].length >= TARGET_TOKEN_MAX) {
        updateFormState(`키워드는 각 항목에 최대 ${TARGET_TOKEN_MAX}개까지 등록할 수 있어요.`);
        return rawValue;
      }
      targetState[field].push(value);
      attempted = false;
      renderTokens(field);
      updateFormState();
      return '';
    }

    function handleTokenKeydown(event, field) {
      // 한글 IME 조합 중 Enter는 마지막 글자를 확정하는 용도다.
      // 이 시점에 토큰으로 저장하면 마지막 글자가 다음 토큰으로 남을 수 있다.
      if (event.isComposing || event.keyCode === 229) return;

      if (event.key === 'Enter') {
        event.preventDefault();
        event.currentTarget.value = addToken(field, event.currentTarget.value);
      } else if (event.key === 'Backspace' && !event.currentTarget.value && targetState[field].length) {
        targetState[field].pop();
        attempted = false;
        renderTokens(field);
        updateFormState();
      }
    }

    function handleSelectChange() {
      targetState.age = document.getElementById('age-input').value;
      targetState.gender = document.getElementById('gender-input').value;
      attempted = false;
      updateFormState();
    }

    function clearAttemptState() {
      if (!attempted) return;
      attempted = false;
      updateFormState();
    }

    function updateFormState(message = '') {
      const filled = filledCount();
      const isReady = filled >= TARGET_MIN_FILLED;
      const button = document.getElementById('start-search-btn');
      button.classList.toggle('disabled', !isReady);
      button.setAttribute('aria-disabled', String(!isReady));
      document.getElementById('selection-status').textContent = isReady
        ? `${filled} / 4 항목 입력 · 문제 정의를 탐색할 수 있어요.`
        : `${filled} / 4 항목 입력 · 최소 ${TARGET_MIN_FILLED}개가 필요해요.`;
      document.getElementById('selection-error').textContent = message;
      document.querySelectorAll('#progress-dots .progress-dot').forEach((dot, index) => {
        dot.classList.toggle('filled', index < filled);
      });

      const invalid = attempted && !isReady;
      document.getElementById('age-input').classList.toggle('invalid', invalid && !targetState.age);
      document.getElementById('gender-input').classList.toggle('invalid', invalid && !targetState.gender);
      document.getElementById('jobs-shell').classList.toggle('invalid', invalid && targetState.jobs.length === 0);
      document.getElementById('places-shell').classList.toggle('invalid', invalid && targetState.places.length === 0);
    }

    function startSearch() {
      if (filledCount() < TARGET_MIN_FILLED) {
        attempted = true;
        updateFormState('최소 2개 항목을 입력해야 문제 정의 탐색을 시작할 수 있어요.');
        const firstEmpty = [
          ['age-input', !targetState.age],
          ['gender-input', !targetState.gender],
          ['jobs-input', targetState.jobs.length === 0],
          ['places-input', targetState.places.length === 0]
        ].find(([, empty]) => empty);
        if (firstEmpty) document.getElementById(firstEmpty[0]).focus();
        return;
      }

      localStorage.setItem('eureka_target_profile', JSON.stringify({
        age: targetState.age || null,
        gender: targetState.gender || null,
        jobs: targetState.jobs,
        places: targetState.places
      }));
      localStorage.removeItem('eureka_categories');
      localStorage.removeItem('eureka_platforms');
      if (parent.__dataMode === 'live') parent.__collections.start({age:targetState.age || null, gender:targetState.gender || null, jobs:[...targetState.jobs], places:[...targetState.places]});
      parent.__navigate('loading.html');
    }

    function restoreTarget() {
      try {
        const saved = JSON.parse(localStorage.getItem('eureka_target_profile') || 'null');
        if (saved && typeof saved === 'object') {
          targetState.age = typeof saved.age === 'string' ? saved.age : '';
          targetState.gender = typeof saved.gender === 'string' ? saved.gender : '';
          targetState.jobs = Array.isArray(saved.jobs) ? saved.jobs.slice(0, TARGET_TOKEN_MAX) : [];
          targetState.places = Array.isArray(saved.places) ? saved.places.slice(0, TARGET_TOKEN_MAX) : [];
          document.getElementById('age-input').value = targetState.age;
          document.getElementById('gender-input').value = targetState.gender;
        }
      } catch (error) {
        console.error(error);
      }
      renderTokens('jobs');
      renderTokens('places');
      updateFormState();
    }

    restoreTarget();
  </script>
</body>

</html>
