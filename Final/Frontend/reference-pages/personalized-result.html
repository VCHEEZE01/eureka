<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUREKA - 맞춤 아이디어 결과</title>
  <!-- Google Fonts: IBM Plex Sans KR, Noto Sans KR, Inter & Iceland -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;
      background: #F2EEFF;
      color: #333;
      overflow-x: hidden;
    }

    /* 상단 고정 헤더 GNB 바 (기존 페이지들과 100% 동일한 디자인) */
    .fixed-gnb {
      width: 100%;
      height: 75px;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      background: rgba(246, 245, 253, 0.60);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000001;
      border: none !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .fixed-gnb-inner {
      width: 1312px;
      max-width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }

    @media (max-width: 1440px) {
      .fixed-gnb-inner {
        width: 100%;
        padding: 0 64px;
      }
    }

    .nav-item {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .nav-item:hover {
      opacity: 0.7;
    }

    /* 메인 1440px 레이아웃 래퍼 */
    .page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 75px;
      padding-bottom: 120px;
    }

    .canvas-container {
      width: 1440px;
      min-height: 1400px;
      position: relative;
      background: #F2EEFF;
    }

    /* 상단 타이틀 블록 (제목, 설명글, 조건 칩 세로 스택) */
    .title-block {
      position: absolute;
      left: 65px;
      top: 50px;
      width: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .main-title-text {
      font-size: 36px;
      font-weight: 500;
      font-family: 'Noto Sans KR', sans-serif;
      color: #000000;
      line-height: 50px;
      margin: 0;
    }

    .sub-title-text {
      font-size: 20px;
      font-weight: 400;
      font-family: 'Inter', sans-serif;
      color: #4E4E4E;
      line-height: 32px;
      word-break: keep-all;
    }

    /* 상단 선택된 조건 칩 목록 (흰색 알약) */
    .top-condition-chips {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-chip-item {
      padding: 4px 14px;
      background: #FFFFFF;
      border-radius: 50px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: #000000;
      font-size: 13px;
      font-weight: 500;
      font-family: 'IBM Plex Sans KR', sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    /* 메인 보라색 텍스트 문제 띠 (1350px 흰색 박스) */
    .purple-problem-banner {
      width: 1350px;
      height: 173px;
      position: absolute;
      left: 45px;
      top: 228px;
      background: #FFFFFF;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.10);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 50px;
      box-sizing: border-box;
    }

    .purple-problem-text {
      color: #6B42FF;
      font-size: 28px;
      font-weight: 600;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      line-height: 42px;
      text-align: center;
      word-break: keep-all;
    }

    /* 좌측 3개 아이디어 카드 세로 스택 */
    .left-cards-stack {
      position: absolute;
      left: 65px;
      top: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .idea-select-card {
      width: 509px;
      height: 156px;
      border-radius: 30px;
      padding: 26px 36px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-sizing: border-box;
      box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04);
    }

    /* 비활성 카드 (흰색 배경) */
    .idea-select-card.inactive {
      background: #FFFFFF;
      color: #000000;
    }

    .idea-select-card.inactive:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(107, 66, 255, 0.1);
    }

    .idea-select-card.inactive .card-title {
      color: #000000;
    }

    .idea-select-card.inactive .card-desc {
      color: #333333;
    }

    .idea-select-card.inactive .card-num {
      color: rgba(141, 141, 141, 0.20);
    }

    /* 활성화 카드 (보라색 #7C3AED 배경) */
    .idea-select-card.active {
      background: #7C3AED;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0px 10px 30px rgba(124, 58, 237, 0.3);
    }

    .idea-select-card.active .card-title {
      color: #FFFFFF;
    }

    .idea-select-card.active .card-desc {
      color: #FFFFFF;
    }

    .idea-select-card.active .card-num {
      color: rgba(255, 255, 255, 0.20);
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif;
      margin-bottom: 8px;
      line-height: 34px;
    }

    .card-desc {
      font-size: 15px;
      font-weight: 350;
      font-family: 'Noto Sans KR', sans-serif;
      line-height: 24px;
      max-width: 380px;
      word-break: keep-all;
    }

    .card-num {
      position: absolute;
      right: 32px;
      bottom: 12px;
      font-size: 64px;
      font-weight: 900;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
    }

    /* 우측 인터랙티브 상세 카드 (766px x 629px) */
    .right-detail-card {
      width: 766px;
      height: 629px;
      position: absolute;
      left: 608px;
      top: 440px;
      background: #FFFFFF;
      box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04);
      border-radius: 30px;
      box-sizing: border-box;
    }

    /* 상단 알약 세그먼티드 토글 스위처 */
    .tab-segmented-container {
      width: 392px;
      height: 57px;
      position: absolute;
      left: 58px;
      top: 30px;
      background: #FFFFFF;
      box-shadow: 0px 5px 10px 2px rgba(0, 0, 0, 0.05);
      border-radius: 50px;
      display: flex;
      align-items: center;
      padding: 3px;
      box-sizing: border-box;
    }

    .segmented-btn {
      flex: 1;
      height: 51px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 500;
      font-family: 'IBM Plex Sans KR', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .segmented-btn.active {
      background: #7C3AED;
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.25);
    }

    .segmented-btn.inactive {
      background: transparent;
      color: #464646;
    }

    /* 우측 상단 저 장 버튼 (101px x 47px) */
    .btn-save-idea-top {
      position: absolute;
      left: 631px;
      top: 35px;
      width: 105px;
      height: 47px;
      background: #FFFFFF;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.10);
      border-radius: 15px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      color: #464646;
      font-size: 15px;
      font-family: 'IBM Plex Sans KR', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-save-idea-top:hover {
      background: #F9FAFB;
      color: #6B42FF;
    }

    .star-icon {
      margin-left: 3px;
      font-size: 16px;
      color: #9CA3AF;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .btn-save-idea-top.active .star-icon {
      color: #FFC107; /* 노란색 불 들어옴 */
      transform: scale(1.2);
    }

    /* 상세 내용 본문 영역 */
    .detail-body-container {
      position: absolute;
      left: 45px;
      top: 118px;
      width: 677px;
      height: 484px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .detail-section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-section-title {
      font-size: 20px;
      font-weight: 500;
      color: #000000;
      font-family: 'IBM Plex Sans KR', sans-serif;
      line-height: 23px;
    }

    .detail-section-desc {
      font-size: 13px;
      font-weight: 300;
      color: #000000;
      font-family: 'Noto Sans KR', sans-serif;
      line-height: 22px;
      word-break: keep-all;
    }

    /* 핵심 기능 캡슐 태그 목록 */
    .feature-capsules-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }

    .feature-capsule-item {
      padding: 10px 20px;
      background: #F2EEFF;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.10);
      border-radius: 15px;
      color: #6B42FF;
      font-size: 14px;
      font-weight: 500;
      font-family: 'IBM Plex Sans KR', sans-serif;
      line-height: 18px;
    }

    /* 내 조건 반영 태그 칩 */
    .condition-chips-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .condition-chip-badge {
      padding: 5px 14px;
      background: #F2EEFF;
      border-radius: 50px;
      color: #6B42FF;
      font-size: 13px;
      font-weight: 500;
      font-family: 'IBM Plex Sans KR', sans-serif;
    }

    /* 하단 액션 버튼 그룹 */
    .bottom-buttons-wrapper {
      position: absolute;
      left: 0;
      width: 100%;
      top: 1115px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn-reset-conditions {
      padding: 18px 32px;
      background: #6B42FF;
      box-shadow: 0px 4px 14px rgba(107, 66, 255, 0.3);
      border-radius: 15px;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 500;
      font-family: 'IBM Plex Sans KR', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-reset-conditions:hover {
      background: #5630E5;
      transform: translateY(-2px);
    }
    .canvas-container { width: min(1440px, 100%); min-height: 0; padding: 50px 45px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 32px; align-items: start; }
    .title-block, .purple-problem-banner, .left-cards-stack, .right-detail-card, .bottom-buttons-wrapper { position: static; width: auto; }
    .title-block, .purple-problem-banner, .bottom-buttons-wrapper { grid-column: 1 / -1; }
    .title-block { min-width: 0; }
    .top-condition-chips { flex-wrap: wrap; }
    .top-chip-item, .condition-chip-badge { max-width: 100%; overflow-wrap: anywhere; box-sizing: border-box; }
    .purple-problem-banner { height: auto; min-height: 140px; }
    .idea-select-card { width: 100%; height: auto; min-height: 156px; padding-right: 75px; }
    .card-desc { max-width: 100%; }
    .card-num { right: 16px; width: 52px; font-size: 40px; text-align: right; }
    .right-detail-card { position: relative; left: auto; top: auto; min-width: 0; height: 680px; }
    .tab-segmented-container { left: 24px; width: calc(100% - 160px); }
    .btn-save-idea-top { left: auto; right: 20px; }
    .detail-body-container { left: 24px; width: calc(100% - 48px); height: 535px; box-sizing: border-box; }
    .detail-section-desc { overflow-wrap: anywhere; }
    @media (max-width: 800px) {
      .canvas-container { grid-template-columns: minmax(0, 1fr); padding: 28px 16px; gap: 24px; }
      .main-title-text { font-size: 28px; }
      .sub-title-text { font-size: 17px; }
      .purple-problem-banner { padding: 24px; }
      .purple-problem-text { font-size: 22px; line-height: 32px; }
      .segmented-btn { font-size: 14px; }
      .tab-segmented-container { left: 12px; width: calc(100% - 112px); }
      .btn-save-idea-top { right: 12px; width: 76px; }
      .fixed-gnb-inner { padding: 0 16px; }
      .fixed-gnb .nav-item { display: none; }
    }

    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */
    @media (max-width: 800px) {
      .fixed-gnb-inner { width: 100%; padding: 0 20px; }
      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }
      .fixed-gnb .nav-item { display: none; white-space: nowrap; }
    }
  </style>
</head>

<body>

  <!-- 상단 고정 헤더 GNB 바 -->
  <div class="fixed-gnb">
    <div class="fixed-gnb-inner">
      <div style="justify-content: flex-start; align-items: center; gap: 50px; display: flex">
        <div onclick="goHome()" title="홈 화면으로 이동"
          style="justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; cursor: pointer;">
          EUREKA
        </div>
        <div class="nav-item" style="color: black; font-size: 20px;">커뮤니티</div>
        <div class="nav-item" style="color: black; font-size: 20px;">요금제</div>
      </div>
      <div style="justify-content: flex-start; align-items: center; gap: 48px; display: flex">
        <div class="nav-item" style="color: black; font-size: 20px;">로그인</div>
        <div class="nav-item" style="color: black; font-size: 20px;">마이페이지</div>
      </div>
    </div>
  </div>

  <!-- 메인 레이아웃 래퍼 -->
  <div class="page-wrapper">
    <div class="canvas-container">

      <!-- 상단 타이틀 및 조건 태그 블록 (각 10px 간격) -->
      <div class="title-block">
        <h1 class="main-title-text">맞춤 아이디어 결과</h1>
        <div class="sub-title-text">
          선택한 문제를 기준으로 서비스 형태, 타깃, 운영 규모를 반영해<br />
          실행 가능한 방향으로 아이디어를 다시 구성했어요.
        </div>
        <div class="top-condition-chips" id="top-chips-wrapper">
          <div class="top-chip-item">앱 서비스</div>
          <div class="top-chip-item">개인 고객</div>
          <div class="top-chip-item">1인</div>
          <div class="top-chip-item">비수익형</div>
          <div class="top-chip-item">생산성·업무</div>
        </div>
      </div>

      <!-- 문제 한 줄 보라색 텍스트 띠 카드 -->
      <div class="purple-problem-banner">
        <div class="purple-problem-text">
          시작한 프로젝트를 끝까지 이어가기 어렵다.<br />
          초기 의욕은 높지만 진행 상황을 점검하고 지속하도록 돕는 구조가 부족하다.
        </div>
      </div>

      <!-- 좌측 3개 아이디어 카드 스택 -->
      <div class="left-cards-stack" id="left-cards-wrapper">
        <!-- JS 동적 생성 -->
      </div>

      <!-- 우측 상세 내용 카드 -->
      <div class="right-detail-card">

        <!-- 상단 알약 세그먼티드 토글 스위처 -->
        <div class="tab-segmented-container">
          <div class="segmented-btn active" id="tab-btn-design" onclick="switchRightTab('design')">아이디어 설계</div>
          <div class="segmented-btn inactive" id="tab-btn-condition" onclick="switchRightTab('condition')">내 조건 반영</div>
        </div>

        <!-- 우측 상단 저 장 버튼 -->
        <div class="btn-save-idea-top" id="btn-save-idea-top" onclick="toggleSaveIdeaAlert()">
          저 장<span class="star-icon" id="star-icon-top">★</span>
        </div>

        <!-- 본문 내용 컨테이너 (JS 동적 변경) -->
        <div class="detail-body-container" id="detail-body-content">
          <!-- JS 동적 생성 -->
        </div>

      </div>

      <!-- 하단 액션 버튼 그룹 -->
      <div class="bottom-buttons-wrapper">
        <button class="btn-reset-conditions" onclick="goPersonalizePage()">조건 다시 설정</button>
      </div>

    </div>
  </div>

  <script>
(function () {
  const options = {
    q1: ['앱 서비스', '웹 서비스'], q2: ['개인 고객', '기업 / 조직'],
    q3: ['1인', '5인 이하', '10인 이상', '20인 이상'],
    q4: ['비수익형', '광고 기반', '유료 구독·결제', '아직 정하지 않았어요'],
    q5: ['생산성·업무', '커리어·교육', '라이프스타일', '금융', '헬스케어']
  };
  const key = 'eureka_personalization';
  function normalize(value) {
    const data = value && typeof value === 'object' ? value : {};
    const result = {};
    for (const [name, values] of Object.entries(options)) {
      result[name] = values.includes(data[name]) ? data[name] : null;
    }
    result.keywords = Array.isArray(data.keywords) ? [...new Set(data.keywords.filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean))] : [];
    result.problemId = /^[1-5]$/.test(String(data.problemId)) ? String(data.problemId) : null;
    return result;
  }
  function read() {
    const params = new URLSearchParams(parent.__search);
    let value = {};
    try { value = JSON.parse(params.has('profile') ? params.get('profile') : localStorage.getItem(key) || '{}'); } catch {}
    const result = normalize(value);
    if (params.has('id')) result.problemId = normalize({problemId:params.get('id')}).problemId;
    return result;
  }
  function query(profile) { return '?profile=' + encodeURIComponent(JSON.stringify(normalize(profile))); }
  function save(profile) { try { localStorage.setItem(key, JSON.stringify(normalize(profile))); } catch {} }
  function escape(value) {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function chips(p) { return Object.keys(options).map(k => p[k]).filter(Boolean).concat(p.keywords); }
  const domains = {
    '생산성·업무': ['반복 업무의 진행 상황을 놓치는 문제', '업무', ['업무 체크리스트', '진행 요약', '업무 알림'], ['할 일 등록', '완료 기록', '주간 요약']],
    '커리어·교육': ['학습 계획을 꾸준히 실천하기 어려운 문제', '학습', ['학습 체크인', '학습 회고', '복습 알림'], ['학습 목표 등록', '학습 기록', '주간 회고']],
    '라이프스타일': ['일상에서 해야 할 일을 잊거나 미루는 문제', '생활', ['생활 루틴 체크', '생활 기록 노트', '생활 일정 알림'], ['루틴 등록', '완료 체크', '주간 기록']],
    '금융': ['개인 지출 기록을 꾸준히 정리하기 어려운 문제', '지출', ['지출 기록장', '소비 회고 노트', '예산 점검 알림'], ['지출 직접 입력', '분류별 집계', '예산 확인']],
    '헬스케어': ['일상적인 건강 습관을 꾸준히 기록하기 어려운 문제', '건강 습관', ['건강 습관 체크', '활동 기록 노트', '생활 습관 알림'], ['습관 목표 등록', '활동 직접 기록', '주간 기록 확인']]
  };
  const problems = {
    '1': ['스터디를 꾸준히 참여하기 어려운 문제', '스터디', ['스터디 체크인', '스터디 회고', '스터디 일정 알림'], ['참여 일정 등록', '참여 체크', '주간 회고']],
    '2': ['남는 식재료와 음식물 쓰레기 문제', '식재료', ['냉장고 재료 체크', '식재료 소비 노트', '소비 기한 알림'], ['재료 등록', '소비 체크', '남은 재료 확인']],
    '3': ['팀 프로젝트의 업무 분담과 진행 파악이 어려운 문제', '팀 업무', ['팀 업무 체크', '팀 진행 노트', '담당 업무 알림'], ['담당자 지정', '진행 기록', '업무 현황 확인']],
    '4': ['개인 지출 분류가 번거로운 문제', '지출', ['지출 분류 노트', '소비 패턴 회고', '미분류 지출 알림'], ['지출 직접 입력', '분류 수정', '월별 집계']],
    '5': ['운동 일지를 꾸준히 작성하기 어려운 문제', '운동', ['운동 체크인', '운동 기록 노트', '운동 일정 알림'], ['운동 등록', '완료 체크', '주간 기록']]
  };
  function context(p) { return problems[p.problemId] || domains[p.q5] || ['해결할 문제를 구체화하기', '문제 탐색', ['불편 기록장', '사용자 의견 노트', '문제 검증 체크'], ['불편 등록', '의견 기록', '우선순위 확인']]; }
  function generate(p) {
    if (!p.q1 || !p.q2 || !p.q3 || !p.q4 || !p.q5) return [];
    const [problem, subject, titles, features] = context(p);
    const smallWords = p.keywords.filter(k => /작은범위|작게|소규모|간단|최소기능|mvp|작은\s*범위/i.test(k));
    const otherWords = p.keywords.filter(k => !smallWords.includes(k));
    const small = smallWords.length > 0 || p.q3 === '1인';
    const platform = p.q1 === '앱 서비스' ? '모바일 앱의 짧은 입력 화면과 알림 설정을 중심으로 구성합니다.' : '설치 없이 브라우저에서 접속하고 링크로 공유할 수 있도록 구성합니다.';
    const audience = p.q2 === '개인 고객' ? '개인 고객이 자신의 기록을 직접 관리하도록 설계합니다.' : '기업 / 조직의 구성원이 담당자를 지정하고 관리자와 현황을 공유하도록 설계합니다.';
    const scale = {
      '1인': '1인이 운영할 수 있도록 외부 자동 연동 없이 직접 입력과 조회부터 시작합니다.',
      '5인 이하': '5인 이하 팀이 입력 화면, 기록 관리, 운영을 나누어 구현할 수 있는 범위로 구성합니다.',
      '10인 이상': '10인 이상 팀이 화면, 데이터, 운영 기능을 분담하고 역할별 권한을 관리합니다.',
      '20인 이상': '20인 이상 팀을 고려해 담당 조직별 권한과 운영 이력 관리를 추가합니다.'
    }[p.q3];
    const revenue = {
      '비수익형': '광고와 유료 결제를 넣지 않고 핵심 기능을 무료로 제공합니다.',
      '광고 기반': '핵심 기능은 무료로 제공하고 기록 확인 화면에 광고 한 곳을 배치합니다. 입력 흐름에는 광고를 넣지 않습니다.',
      '유료 구독·결제': '기본 기록은 무료로 제공하고 기간별 상세 보고서를 유료 구독 기능으로 분리합니다.',
      '아직 정하지 않았어요': '초기 버전에는 광고와 결제를 넣지 않고 이용 반응을 확인한 뒤 운영 방식을 결정합니다.'
    }[p.q4];
    const scope = small ? '첫 버전은 핵심 기능 2개로 제한하고 자동 연동과 커뮤니티는 제외합니다.' : '첫 버전은 핵심 기능 3개로 구성하고 사용 반응에 따라 확장합니다.';
    const keywordNote = (smallWords.length ? '추가 조건 ' + smallWords.map(k => '“' + k + '”').join(', ') + ': ' + scope : '')
      + (otherWords.length ? ' 추가 검토 조건: ' + otherWords.map(k => '“' + k + '”').join(', ') + '. 이 조건은 요구사항으로 보관했으며, 구체적인 설계 반영 여부는 아직 확인되지 않았습니다.' : '');
    const domainNote = '문제 분야는 ' + p.q5 + '로 설정합니다.' + (p.problemId ? ' 선택한 원래 문제를 유지하며 이 분야에서의 적용 가능성을 먼저 검토합니다.' : '');
    return titles.map((title, index) => {
      const selectedFeatures = (index === 0 ? features : index === 1 ? [features[1], features[2], '기간별 비교'] : [features[0], '일정 알림 설정', features[1]]).slice(0, small ? 2 : 3);
      const solution = [
        subject + ' 항목을 등록하고 완료 여부를 체크합니다.',
        subject + ' 기록을 모아 지난 기간과 비교하고 다음 행동을 정합니다.',
        subject + ' 일정을 등록하고 사용자가 정한 시간에 알림을 받도록 합니다.'
      ][index];
      return {
        id: String(index + 1).padStart(2, '0'), title,
        desc: p.q5 + ' 분야의 ' + p.q2 + ' 대상 ' + p.q1 + '. ' + (small ? '핵심 기능 2개부터 시작합니다.' : '핵심 기능 3개로 구성합니다.'),
        design: {summaryTitle:'아이디어 한눈에 보기', summaryDesc: problem + '를 다루는 ' + p.q1 + '입니다. ' + audience + ' ' + domainNote,
          solutionTitle:'어떻게 해결하나요?', solutionDesc:[solution, platform, scale, revenue, scope, keywordNote].filter(Boolean).join(' '),
          featuresTitle:'핵심 기능', features:selectedFeatures},
        condition:{reflectTitle:'선택한 조건', chips:chips(p), reasonTitle:'조건별 설계 방향',
          reasonDesc:[p.q1 + ': ' + platform, p.q2 + ': ' + audience, p.q3 + ': ' + scale, p.q4 + ': ' + revenue, domainNote, keywordNote].filter(Boolean).join('\n')}
      };
    });
  }
  window.Personalization = {read, query, save, escape, chips, context, generate, options};
})();

</script>
  <script>
    const profile = Personalization.read();
    function goHome() {
      parent.__navigate('index.html');
    }

    function goPersonalizePage() {
      parent.__navigate('personalize.html' + Personalization.query(profile));
    }

    let isIdeaSaved = false;
    function toggleSaveIdeaAlert() {
      isIdeaSaved = !isIdeaSaved;
      const btn = document.getElementById('btn-save-idea-top');
      if (isIdeaSaved) {
        btn.classList.add('active');
        alert('아이디어가 저장되었습니다! ★');
      } else {
        btn.classList.remove('active');
        alert('아이디어 저장이 취소되었습니다.');
      }
    }

    const ideaDatasets = Personalization.generate(profile);

    let currentIdeaIndex = 0;
    let currentRightTab = 'design'; // 'design' or 'condition'

    // 1. 좌측 카드 세트 렌더링
    function renderLeftCards() {
      const wrapper = document.getElementById('left-cards-wrapper');
      wrapper.innerHTML = ideaDatasets.map((item, idx) => {
        const isActive = idx === currentIdeaIndex;
        return `
          <div class="idea-select-card ${isActive ? 'active' : 'inactive'}" onclick="selectIdea(${idx})">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-num">${item.id}</div>
          </div>
        `;
      }).join('');
    }

    // 2. 우측 상세 본문 렌더링
    function renderRightDetail() {
      const bodyContainer = document.getElementById('detail-body-content');
      const item = ideaDatasets[currentIdeaIndex];
      if (!item) {
        bodyContainer.textContent = '조건을 설정하면 맞춤 아이디어를 확인할 수 있습니다.';
        return;
      }

      if (currentRightTab === 'design') {
        // 아이디어 설계 탭
        bodyContainer.innerHTML = `
          <div class="detail-section-block">
            <div class="detail-section-title">${item.design.summaryTitle}</div>
            <div class="detail-section-desc">${item.design.summaryDesc}</div>
          </div>

          <div class="detail-section-block">
            <div class="detail-section-title">${item.design.solutionTitle}</div>
            <div class="detail-section-desc">${Personalization.escape(item.design.solutionDesc)}</div>
          </div>

          <div class="detail-section-block">
            <div class="detail-section-title">${item.design.featuresTitle}</div>
            <div class="feature-capsules-row">
              ${item.design.features.map(f => `<div class="feature-capsule-item">${f}</div>`).join('')}
            </div>
          </div>
        `;
      } else {
        // 내 조건 반영 탭
        bodyContainer.innerHTML = `
          <div class="detail-section-block">
            <div class="detail-section-title">${item.condition.reflectTitle}</div>
            <div class="condition-chips-list">
              ${item.condition.chips.map(c => `<div class="condition-chip-badge">${Personalization.escape(c)}</div>`).join('')}
            </div>
          </div>

          <div class="detail-section-block" style="margin-top: 10px;">
            <div class="detail-section-title">${item.condition.reasonTitle}</div>
            <div class="detail-section-desc" style="white-space: pre-line">${Personalization.escape(item.condition.reasonDesc)}</div>
          </div>
        `;
      }
    }

    // 카드 선택 핸들러
    function selectIdea(index) {
      currentIdeaIndex = index;
      renderLeftCards();
      renderRightDetail();
    }

    // 우측 탭 스위처 핸들러
    function switchRightTab(tabType) {
      currentRightTab = tabType;

      const designBtn = document.getElementById('tab-btn-design');
      const conditionBtn = document.getElementById('tab-btn-condition');

      if (tabType === 'design') {
        designBtn.className = 'segmented-btn active';
        conditionBtn.className = 'segmented-btn inactive';
      } else {
        designBtn.className = 'segmented-btn inactive';
        conditionBtn.className = 'segmented-btn active';
      }

      renderRightDetail();
    }

    // 초기 실행
    document.getElementById('top-chips-wrapper').replaceChildren(...Personalization.chips(profile).map(text => {
      const chip = document.createElement('div');
      chip.className = 'top-chip-item';
      chip.textContent = text;
      return chip;
    }));
    document.querySelector('.purple-problem-text').textContent = ideaDatasets.length ? Personalization.context(profile)[0] : '먼저 원하는 조건을 선택해주세요.';
    document.querySelector('.sub-title-text').textContent = '서비스 형태, 대상, 규모, 운영 방식과 분야에 맞춘 아이디어입니다.';
    renderLeftCards();
    renderRightDetail();
  </script>
</body>

</html>
