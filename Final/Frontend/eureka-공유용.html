<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{display:flex;flex-direction:column}iframe{display:block;width:100%;flex:1;min-height:0;border:0}.data-mode-label{flex-shrink:0;padding:9px 16px;background:#211a40;color:white;font:13px/1.5 sans-serif;text-align:center;word-break:keep-all}</style>

<body>
<iframe id="app" title="EUREKA"></iframe>
<div class="data-mode-label" role="status">실제 타겟 탐색 · 이번 실행의 문제와 근거를 확인합니다</div>
<script id="pages" type="application/json">{"index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>EUREKA - 유레카\u003c/title>\n  \u003c!-- Google Fonts: IBM Plex Sans KR & Iceland -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink\n    href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&display=swap\"\n    rel=\"stylesheet\">\n  \u003cstyle>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html,\n    body {\n      width: 100%;\n      overflow-x: hidden;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      background-color: #F6F5FD;\n      color: #333;\n    }\n\n    /* 100% 풀 위드 섹션 & 중앙 1440px 인너 래퍼 */\n    .section-full {\n      width: 100%;\n      display: flex;\n      justify-content: center;\n      position: relative;\n    }\n\n    .inner-content {\n      width: 1440px;\n      position: relative;\n      flex-shrink: 0;\n    }\n\n    /* 상단 고정 헤더 GNB 바 */\n    .fixed-gnb {\n      width: 100%;\n      height: 75px;\n      position: fixed;\n      top: 0;\n      left: 0;\n      display: flex;\n      justify-content: center;\n      background: rgba(246, 245, 253, 0.60);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      z-index: 1000001; /* 모달 위 최상단 고정 */\n      border: none !important;\n      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);\n    }\n\n    .fixed-gnb-inner {\n      width: 1312px;\n      max-width: 100%;\n      height: 100%;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 24px;\n    }\n\n    @media (max-width: 1440px) {\n      .fixed-gnb-inner {\n        width: 100%;\n        padding: 0 64px;\n      }\n    }\n\n    /* 버튼 호버 인터랙션 */\n    [data-속성-1] {\n      transition: all 0.25s ease;\n      cursor: pointer;\n    }\n\n    [data-속성-1]:hover {\n      transform: translateY(-2px);\n      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.15) !important;\n    }\n\n    /* 상단 헤더 메뉴 호버 효과 */\n    .nav-item {\n      cursor: pointer;\n      transition: opacity 0.2s ease;\n    }\n\n    .nav-item:hover {\n      opacity: 0.7;\n    }\n\n    /* 탭 버튼 스타일 */\n    .tab-btn {\n      width: 203px;\n      height: 51px;\n      position: absolute;\n      border-radius: 50px;\n      cursor: pointer;\n      transition: all 0.3s ease;\n      user-select: none;\n    }\n\n    .tab-btn .tab-bg {\n      width: 203px;\n      height: 51px;\n      position: absolute;\n      left: 0;\n      top: 0;\n      border-radius: 50px;\n      transition: background 0.3s ease;\n    }\n\n    .tab-btn .tab-text {\n      width: 203px;\n      position: absolute;\n      left: 0;\n      top: 14px;\n      text-align: center;\n      justify-content: center;\n      display: flex;\n      flex-direction: column;\n      font-size: 20px;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      font-weight: 500;\n      line-height: 22.75px;\n      transition: color 0.3s ease;\n    }\n\n    /* 활성화 탭 */\n    .tab-btn.active .tab-bg {\n      background: #6B42FF !important;\n    }\n\n    .tab-btn.active .tab-text {\n      color: #ffffff !important;\n    }\n\n    /* 비활성화 탭 */\n    .tab-btn:not(.active) .tab-bg {\n      background: #ffffff !important;\n    }\n\n    .tab-btn:not(.active) .tab-text {\n      color: #3F3F3F !important;\n    }\n\n    /* 탭 콘텐츠 애니메이션 */\n    .tab-content-title,\n    .tab-content-desc {\n      transition: opacity 0.25s ease;\n    }\n\n    /* Figma 원본 카드 슬라이드 스타일 */\n    .figma-card {\n      width: 583px;\n      height: 663px;\n      left: 103px;\n      position: absolute;\n      border-radius: 20px;\n      padding: 48px 40px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      transition: background 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;\n      box-sizing: border-box;\n    }\n\n    /* Figma 보라색 카드 (기본/활성화 state: top: 140px 에 다가왔을 때) */\n    .figma-card.active {\n      background: #7C3AED !important;\n      box-shadow: 0px 5px 8px 5px rgba(94.40, 94.40, 94.40, 0.27) !important;\n      border: none !important;\n      color: white !important;\n    }\n\n    .figma-card.active .card-badge {\n      background: rgba(255, 255, 255, 0.22);\n      color: white;\n    }\n\n    .figma-card.active .card-desc {\n      color: rgba(255, 255, 255, 0.92);\n    }\n\n    /* Figma 베리언트3 카드 (비활성화 state: 그라데이션 흰색) */\n    .figma-card:not(.active) {\n      background: linear-gradient(180deg, white 0%, rgba(255, 255, 255, 0) 100%) !important;\n      box-shadow: 1px 4px 8px 3px rgba(94.40, 94.40, 94.40, 0.08) !important;\n      border: 1px rgba(69.88, 69.88, 69.88, 0.09) solid !important;\n      color: #222 !important;\n    }\n\n    .figma-card:not(.active) .card-badge {\n      background: #F3F4F6;\n      color: #7C3AED;\n    }\n\n    .figma-card:not(.active) .card-desc {\n      color: #666;\n    }\n\n    /* 2번 관심분야 설정 독립 풀페이지 섹션 스타일 */\n    .config-section-wrapper {\n      width: 100%;\n      min-height: 1024px;\n      height: 1024px;\n      background: linear-gradient(180deg, #EBF4FC 0%, #F6F5FD 100%);\n      display: flex;\n      justify-content: center;\n      position: relative;\n      overflow: hidden;\n    }\n\n    /* 칩 버튼 스타일 (기본 & 활성화 보라색 state) */\n    .chip-btn {\n      padding: 8px 18px;\n      border-radius: 30px;\n      font-size: 14px;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      font-weight: 600;\n      letter-spacing: 1px;\n      cursor: pointer;\n      transition: all 0.25s ease;\n      user-select: none;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n    }\n\n    /* 미선택 상태 (기본 회색) */\n    .chip-btn:not(.active) {\n      background: #EDEDED;\n      color: #727272;\n    }\n\n    .chip-btn:not(.active):hover {\n      background: #E2E2E2;\n      color: #333;\n    }\n\n    /* 선택 상태 (활성화 보라색 #6B42FF) */\n    .chip-btn.active {\n      background: #6B42FF !important;\n      color: #FFFFFF !important;\n      box-shadow: 0px 4px 10px rgba(107, 66, 255, 0.25);\n    }\n\n    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */\n    @media (max-width: 800px) {\n      .fixed-gnb-inner { width: 100%; padding: 0 20px; }\n      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }\n      .fixed-gnb .nav-item { display: none; white-space: nowrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n  \u003c!-- 상단 화면 전체(100%) 고정 네비게이션 바 -->\n  \u003cdiv class=\"fixed-gnb\">\n    \u003cdiv class=\"fixed-gnb-inner\">\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 50px; display: flex\">\n        \u003cdiv onclick=\"goHome()\" title=\"홈으로 이동\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; word-wrap: break-word; cursor: pointer;\">\n          EUREKA\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          커뮤니티\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          요금제\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 48px; display: flex\">\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          로그인\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          마이페이지\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ================= 1 & 2 페이지 통합 풀 위드 섹션 ================= -->\n  \u003cdiv class=\"section-full\" style=\"background: linear-gradient(270deg, #F6F5FD 0%, #EBF4FC 100%);\">\n    \u003cdiv class=\"inner-content\" style=\"height: 2014px; overflow: hidden;\">\n\n      \u003c!-- 1페이지 히어로 콘텐츠 -->\n      \u003cdiv\n        style=\"width: 750px; height: auto; left: 86px; top: 341px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 48px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 1.3; white-space: nowrap;\">\n        어떤 문제부터 풀지 막막하다면?\n      \u003c/div>\n      \u003cdiv\n        style=\"width: 874px; height: auto; left: 86px; top: 488px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 36px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 300; line-height: 1.3; word-wrap: break-word\">\n        실제 사용자들의 불편과 근거에서\u003cbr />프로젝트 아이디어를 발견하세요\n      \u003c/div>\n\n      \u003c!-- 비주얼 카드들 -->\n      \u003cdiv\n        style=\"width: 375px; height: 203.26px; left: 743px; top: 202.96px; position: absolute; transform: rotate(-10deg); transform-origin: top left; background: #EDEDED; box-shadow: 5px 4px 13px 1px rgba(0, 0, 0, 0.12); border-radius: 30px\">\n      \u003c/div>\n      \u003cdiv\n        style=\"width: 375px; height: 203.26px; left: 1048.12px; top: 204px; position: absolute; transform: rotate(11deg); transform-origin: top left; background: #EDEDED; box-shadow: 5px 4px 13px 1px rgba(0, 0, 0, 0.12); border-radius: 30px\">\n      \u003c/div>\n      \u003cdiv\n        style=\"width: 484.45px; height: 262.58px; left: 811px; top: 580px; position: absolute; background: linear-gradient(114deg, #7C3AED 0%, #7321FF 100%); box-shadow: 5px 4px 13px 1px rgba(0, 0, 0, 0.12); border-radius: 30px\">\n      \u003c/div>\n\n      \u003c!-- 메인 CTA 버튼 -->\n      \u003cdiv data-속성-1=\"기본\" onclick=\"openConfigModal()\"\n        style=\"padding-left: 35px; padding-right: 35px; padding-top: 20px; padding-bottom: 20px; left: 86px; top: 702px; position: absolute; background: linear-gradient(90deg, #4262FF 0%, #457DF6 100%); box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.18); border-radius: 40px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; cursor: pointer;\">\n        \u003cdiv\n          style=\"text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 22.75px; word-wrap: break-word\">\n          문제 찾으러 가기\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2페이지 탭 배경바 -->\n      \u003cdiv\n        style=\"width: 885px; height: 71px; left: 289px; top: 1231px; position: absolute; background: white; box-shadow: 0px 5px 10px 2px rgba(0, 0, 0, 0.05); border-radius: 50px\">\n      \u003c/div>\n\n      \u003c!-- 2페이지 탭 버튼들 -->\n      \u003cdiv class=\"tab-btn active\" id=\"tab-1\" style=\"left: 304px; top: 1241px;\" onclick=\"switchTab(1)\">\n        \u003cdiv class=\"tab-bg\">\u003c/div>\n        \u003cdiv class=\"tab-text\">실제 문제\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"tab-btn\" id=\"tab-2\" style=\"left: 520px; top: 1241px;\" onclick=\"switchTab(2)\">\n        \u003cdiv class=\"tab-bg\">\u003c/div>\n        \u003cdiv class=\"tab-text\">근거 있는 선택\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"tab-btn\" id=\"tab-3\" style=\"left: 736px; top: 1241px;\" onclick=\"switchTab(3)\">\n        \u003cdiv class=\"tab-bg\">\u003c/div>\n        \u003cdiv class=\"tab-text\">다양한 가능성\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"tab-btn\" id=\"tab-4\" style=\"left: 952px; top: 1241px;\" onclick=\"switchTab(4)\">\n        \u003cdiv class=\"tab-bg\">\u003c/div>\n        \u003cdiv class=\"tab-text\">내 상황에 맞게\u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2페이지 탭 타이틀/설명 영역 (동적 콘텐츠) -->\n      \u003cdiv id=\"tab-title\" class=\"tab-content-title\"\n        style=\"width: 550px; height: 111px; left: 172px; top: 1479px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 36px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 1.25; word-wrap: break-word\">\n        아이디어보다,\u003cbr />해결할 문제부터 찾습니다.\n      \u003c/div>\n      \u003cdiv id=\"tab-desc\" class=\"tab-content-desc\"\n        style=\"width: 520px; left: 172px; top: 1626px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 200; line-height: 1.5; word-wrap: break-word\">\n        막연한 아이디어 생성이 아니라, 실제 사용자 문제와 근거에서 시작해\u003cbr />내 프로젝트에 맞는 서비스 아이디어로 발전시킵니다.\n      \u003c/div>\n\n      \u003c!-- 2페이지 오른쪽 비주얼 영역 -->\n      \u003cdiv id=\"tab-visual\"\n        style=\"width: 535px; height: 353px; left: 733px; top: 1479px; position: absolute; background: #D9D9D9; border-radius: 20px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: #666; font-size: 20px; font-weight: 500;\">\n        \u003cspan id=\"visual-label\">실제 문제 탐색 비주얼\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ================= 3. 유레카 발견 프로세스 ================= -->\n  \u003cdiv id=\"process-scroll-container\" class=\"section-full\"\n    style=\"min-height: 100vh; height: 1024px; background: white; overflow: hidden;\">\n\n    \u003c!-- 뷰포트 레이어 (100% 화면 가득 채움) -->\n    \u003cdiv\n      style=\"width: 100%; height: 100%; min-height: 1024px; position: relative; background: white; overflow: hidden; display: flex; justify-content: center;\">\n\n      \u003c!-- 비대칭 좌(흰색)/우(회색 #EDEDED) 풀배경 레이어 (1440px내 651px/789px 경계선과 100% 일치하는 calc 계산식 적용) -->\n      \u003cdiv\n        style=\"position: absolute; left: 0; top: 0; width: calc(50% - 69px); height: 100%; background: white; z-index: 1;\">\n      \u003c/div>\n      \u003cdiv\n        style=\"position: absolute; left: calc(50% - 69px); top: 0; right: 0; height: 100%; background: #EDEDED; z-index: 1;\">\n      \u003c/div>\n\n      \u003c!-- 1440px 중앙 콘텐츠 레이어 -->\n      \u003cdiv class=\"inner-content\" style=\"height: 1024px; display: flex; z-index: 2;\">\n\n        \u003c!-- 좌측 고정 타이틀 & 동적 설명 영역 (완전 정지) -->\n        \u003cdiv style=\"width: 651px; height: 1024px; position: relative; background: white;\">\n          \u003cdiv\n            style=\"width: 387px; height: 138px; left: 98px; top: 140px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 36px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 44px; word-wrap: break-word\">\n            기획의 시작이 달라지는\u003cbr />유레카만의 발견 프로세스\n          \u003c/div>\n\n          \u003c!-- 동적 스텝 제목 -->\n          \u003cdiv id=\"sticky-step-title\"\n            style=\"left: 98px; top: 370px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: #7C3AED; font-size: 32px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; line-height: 44px; transition: opacity 0.3s ease;\">\n            문제 탐색\n          \u003c/div>\n\n          \u003c!-- 동적 스텝 설명 -->\n          \u003cdiv id=\"sticky-step-desc\"\n            style=\"width: 504px; left: 98px; top: 456px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 24px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 200; line-height: 34px; transition: opacity 0.3s ease;\">\n            입력한 타겟 조건으로 자료를 수집하고\u003cbr />실제 사용자 불편을 판별합니다.\n          \u003c/div>\n\n          \u003c!-- 스텝 도트 인디케이터 -->\n          \u003cdiv style=\"left: 98px; top: 600px; position: absolute; display: flex; gap: 12px; align-items: center;\">\n            \u003cdiv class=\"step-dot active\" onclick=\"goToStep(0)\"\n              style=\"width: 32px; height: 8px; border-radius: 4px; background: #7C3AED; transition: all 0.3s ease; cursor: pointer;\">\n            \u003c/div>\n            \u003cdiv class=\"step-dot\" onclick=\"goToStep(1)\"\n              style=\"width: 12px; height: 8px; border-radius: 4px; background: #DDD; transition: all 0.3s ease; cursor: pointer;\">\n            \u003c/div>\n            \u003cdiv class=\"step-dot\" onclick=\"goToStep(2)\"\n              style=\"width: 12px; height: 8px; border-radius: 4px; background: #DDD; transition: all 0.3s ease; cursor: pointer;\">\n            \u003c/div>\n            \u003cdiv class=\"step-dot\" onclick=\"goToStep(3)\"\n              style=\"width: 12px; height: 8px; border-radius: 4px; background: #DDD; transition: all 0.3s ease; cursor: pointer;\">\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- 우측 슬라이딩 카드 트랙 영역 -->\n        \u003cdiv style=\"width: 789px; height: 1024px; position: relative; background: #EDEDED; overflow: hidden\">\n          \u003cdiv id=\"process-card-track\"\n            style=\"width: 789px; height: 3200px; position: absolute; left: 0px; top: 0px; background: #EDEDED; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);\">\n\n            \u003c!-- 카드 01 (Figma top: 140px, 기본 보라색 state) -->\n            \u003cdiv class=\"figma-card active\" style=\"top: 140px;\" data-index=\"0\">\n              \u003cdiv>\n                \u003cdiv class=\"card-badge\"\n                  style=\"display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 16px; font-weight: 600; margin-bottom: 24px;\">\n                  STEP 01\u003c/div>\n                \u003ch3 style=\"font-size: 32px; font-weight: 700; margin-bottom: 16px; line-height: 1.3;\">실제 사용자 문제 탐색\u003c/h3>\n                \u003cp class=\"card-desc\" style=\"font-size: 18px; line-height: 1.6;\">입력한 타겟 조건으로 공개 검색 자료를 수집하고, 실제 불편과 근거를 확인합니다.\u003c/p>\n              \u003c/div>\n              \u003cdiv\n                style=\"background: rgba(255,255,255,0.18); border-radius: 14px; height: 320px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500;\">\n                🔍 문제 데이터 카드 및 필터 미리보기\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- 카드 02 (Figma top: 881px, 베리언트3 그라데이션 state) -->\n            \u003cdiv class=\"figma-card\" style=\"top: 881px;\" data-index=\"1\">\n              \u003cdiv>\n                \u003cdiv class=\"card-badge\"\n                  style=\"display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 16px; font-weight: 600; margin-bottom: 24px;\">\n                  STEP 02\u003c/div>\n                \u003ch3 style=\"font-size: 32px; font-weight: 700; margin-bottom: 16px; line-height: 1.3;\">신뢰할 수 있는 근거 확인\n                \u003c/h3>\n                \u003cp class=\"card-desc\" style=\"font-size: 18px; line-height: 1.6;\">실제 사례 수, 출처 분포, 사용자 생생 원문을 확인하고 명확한 근거를\n                  바탕으로 기획에 확신을 가집니다.\u003c/p>\n              \u003c/div>\n              \u003cdiv\n                style=\"background: rgba(0,0,0,0.03); border-radius: 14px; height: 320px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500;\">\n                📊 사례 수 및 출처 분석 대시보드\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- 카드 03 (Figma top: 1622px, 베리언트3 그라데이션 state) -->\n            \u003cdiv class=\"figma-card\" style=\"top: 1622px;\" data-index=\"2\">\n              \u003cdiv>\n                \u003cdiv class=\"card-badge\"\n                  style=\"display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 16px; font-weight: 600; margin-bottom: 24px;\">\n                  STEP 03\u003c/div>\n                \u003ch3 style=\"font-size: 32px; font-weight: 700; margin-bottom: 16px; line-height: 1.3;\">다양한 기본 아이디어 발견\n                \u003c/h3>\n                \u003cp class=\"card-desc\" style=\"font-size: 18px; line-height: 1.6;\">같은 문제라도 B2C, B2B, 자동화 등 서로 다른 해결 방향을\n                  제시하는 서비스 아이디어 3~5개를 탐색합니다.\u003c/p>\n              \u003c/div>\n              \u003cdiv\n                style=\"background: rgba(0,0,0,0.03); border-radius: 14px; height: 320px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500;\">\n                💡 아이디어 방향성 제안 카드\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- 카드 04 (Figma top: 2363px, 베리언트3 그라데이션 state) -->\n            \u003cdiv class=\"figma-card\" style=\"top: 2363px;\" data-index=\"3\">\n              \u003cdiv>\n                \u003cdiv class=\"card-badge\"\n                  style=\"display: inline-block; padding: 6px 16px; border-radius: 30px; font-size: 16px; font-weight: 600; margin-bottom: 24px;\">\n                  STEP 04\u003c/div>\n                \u003ch3 style=\"font-size: 32px; font-weight: 700; margin-bottom: 16px; line-height: 1.3;\">내 상황에 맞춘 아이디어 구체화\n                \u003c/h3>\n                \u003cp class=\"card-desc\" style=\"font-size: 18px; line-height: 1.6;\">보유 기술, 개발 기간, 팀 리소스 조건을 적용해 포트폴리오로 즉시 제작\n                  가능한 맞춤형 구체화 결과를 완성합니다.\u003c/p>\n              \u003c/div>\n              \u003cdiv\n                style=\"background: rgba(0,0,0,0.03); border-radius: 14px; height: 320px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500;\">\n                ⚙️ 내 상황(웹/앱/리소스) 조건 입력 & 완성\n              \u003c/div>\n            \u003c/div>\n\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ================= 4. 하단 CTA 풀 위드 섹션 ================= -->\n  \u003cdiv class=\"section-full\" style=\"height: 512px; background: black;\">\n    \u003cdiv class=\"inner-content\"\n      style=\"height: 512px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;\">\n      \u003cdiv\n        style=\"width: 1011px; text-align: center; justify-content: center; display: flex; flex-direction: column; color: white; font-size: 36px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 44px; word-wrap: break-word\">\n        유레카와 함께 해결할 문제부터 찾아보세요\n      \u003c/div>\n      \u003cdiv data-속성-1=\"베리언트2\" onclick=\"openConfigModal()\"\n        style=\"padding-left: 35px; padding-right: 35px; padding-top: 20px; padding-bottom: 20px; background: white; box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.18); border-radius: 40px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; cursor: pointer;\">\n        \u003cdiv\n          style=\"text-align: center; justify-content: center; display: flex; flex-direction: column; color: #2C2C2C; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 22.75px; word-wrap: break-word\">\n          문제 찾으러 가기\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 스크립트: 탭 전환, 80% 배율 대응, 슬라이드 스크롤 이동 및 칩 선택 -->\n  \u003cscript>\n    // 0. 2번 탐색 설정 페이지(config.html) 이동 핸들러\n    function openConfigModal() {\n      parent.__navigate('config.html');\n    }\n\n    function closeConfigModal() {\n      parent.__navigate('index.html');\n    }\n\n    // 칩 버튼 클릭 시 클릭된 버튼을 보라색(#6B42FF)으로 전환\n    function selectChip(element) {\n      const group = element.closest('.chip-group');\n      if (group) {\n        group.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('active'));\n      }\n      element.classList.add('active');\n    }\n\n    function startSearch() {\n      alert('입력하신 타겟 조건으로 실제 사용자 문제 탐색을 시작합니다!');\n      closeConfigModal();\n    }\n    // 1. 2페이지 탭 데이터 & 전환\n    const tabData = {\n      1: {\n        title: \"아이디어보다,\u003cbr/>해결할 문제부터 찾습니다.\",\n        desc: \"막연한 아이디어 생성이 아니라, 실제 사용자 문제와 근거에서 시작해\u003cbr/>내 프로젝트에 맞는 서비스 아이디어로 발전시킵니다.\",\n        label: \"실제 문제 탐색 비주얼\",\n        bgColor: \"#D9D9D9\"\n      },\n      2: {\n        title: \"카더라가 아닌,\u003cbr/>실제 사용자 근거를 봅니다.\",\n        desc: \"실제 검색 자료에서 판별한 불편과 관련 사례 수,\u003cbr/>출처를 직접 확인하고 판단할 수 있습니다.\",\n        label: \"근거 데이터 분석 비주얼\",\n        bgColor: \"#E2E8F0\"\n      },\n      3: {\n        title: \"하나의 문제로,\u003cbr/>다양한 가능성을 만듭니다.\",\n        desc: \"같은 문제라도 B2C, B2B, 자동화 등 서로 다른 방향의\u003cbr/>아이디어 3~5개를 자유롭게 탐색할 수 있습니다.\",\n        label: \"다양한 아이디어 제안 비주얼\",\n        bgColor: \"#EDE9FE\"\n      },\n      4: {\n        title: \"내 프로젝트 조건에\u003cbr/>딱 맞게 구체화합니다.\",\n        desc: \"활용 가능한 기술, 리소스, 타깃 조건 등을 반영하여\u003cbr/>나만의 프로젝트에 적합한 구체적 아이디어를 제안합니다.\",\n        label: \"맞춤형 개인화 비주얼\",\n        bgColor: \"#DDD6FE\"\n      }\n    };\n\n    function switchTab(tabIndex) {\n      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));\n\n      const selectedTab = document.getElementById(`tab-${tabIndex}`);\n      if (selectedTab) {\n        selectedTab.classList.add('active');\n      }\n\n      const data = tabData[tabIndex];\n      if (data) {\n        const titleElem = document.getElementById('tab-title');\n        const descElem = document.getElementById('tab-desc');\n        const visualElem = document.getElementById('tab-visual');\n        const visualLabel = document.getElementById('visual-label');\n\n        titleElem.style.opacity = 0;\n        descElem.style.opacity = 0;\n\n        setTimeout(() => {\n          titleElem.innerHTML = data.title;\n          descElem.innerHTML = data.desc;\n          visualElem.style.backgroundColor = data.bgColor;\n          visualLabel.innerText = data.label;\n\n          titleElem.style.opacity = 1;\n          descElem.style.opacity = 1;\n        }, 150);\n      }\n    }\n\n    // 2. 3페이지 카드 순차 이동 제어\n    const processStepsData = [\n      {\n        title: \"문제 탐색\",\n        desc: \"입력한 타겟 조건으로 자료를 수집하고\u003cbr/>실제 사용자 불편을 판별합니다.\"\n      },\n      {\n        title: \"근거 확인\",\n        desc: \"수집된 사례 수, 원문 요약, 출처 정보를 바탕으로\u003cbr/>문제가 정말 존재하는지 신뢰할 근거를 직접 확인합니다.\"\n      },\n      {\n        title: \"기본 아이디어 탐색\",\n        desc: \"발견한 문제에서 출발하는 B2C·B2B·자동화 등\u003cbr/>서로 다른 해결 접근의 아이디어 3~5개를 확인합니다.\"\n      },\n      {\n        title: \"구체화 (개인화)\",\n        desc: \"내 서비스 형태(웹/앱), 타깃, 팀 리소스 조건을 적용해\u003cbr/>나만의 프로젝트로 완성할 수 있도록 맞춤 구체화합니다.\"\n      }\n    ];\n\n    let currentProcessStep = 0;\n    let isWheelLocked = false;\n\n    function goToStep(stepIndex) {\n      if (stepIndex \u003c 0 || stepIndex >= processStepsData.length) return;\n      currentProcessStep = stepIndex;\n      updateProcessUI(currentProcessStep);\n    }\n\n    function updateProcessUI(stepIndex) {\n      const track = document.getElementById('process-card-track');\n      const cards = document.querySelectorAll('.figma-card');\n      const titleElem = document.getElementById('sticky-step-title');\n      const descElem = document.getElementById('sticky-step-desc');\n      const dots = document.querySelectorAll('.step-dot');\n\n      if (!track) return;\n\n      // Y 이동거리: 741px * stepIndex\n      const currentTranslateY = stepIndex * 741;\n      track.style.transform = `translateY(-${currentTranslateY}px)`;\n\n      // 카드 active 보라색 state 적용\n      cards.forEach((card, idx) => {\n        if (idx === stepIndex) {\n          card.classList.add('active');\n        } else {\n          card.classList.remove('active');\n        }\n      });\n\n      // 인디케이터 도트 반영\n      dots.forEach((dot, idx) => {\n        if (idx === stepIndex) {\n          dot.style.width = '32px';\n          dot.style.background = '#7C3AED';\n        } else {\n          dot.style.width = '12px';\n          dot.style.background = '#DDD';\n        }\n      });\n\n      // 좌측 고정 타이틀 & 설명 동적 페이드 전환\n      titleElem.style.opacity = 0;\n      descElem.style.opacity = 0;\n\n      setTimeout(() => {\n        titleElem.innerHTML = processStepsData[stepIndex].title;\n        descElem.innerHTML = processStepsData[stepIndex].desc;\n        titleElem.style.opacity = 1;\n        descElem.style.opacity = 1;\n      }, 100);\n    }\n\n    // 화면 축소/확대(80%, 75%, 120% 등) 및 다양한 뷰포트 크기 변화 완벽 대응\n    const processContainer = document.getElementById('process-scroll-container');\n\n    window.addEventListener('wheel', function (e) {\n      if (!processContainer) return;\n      const rect = processContainer.getBoundingClientRect();\n      const vh = window.innerHeight;\n\n      // 3페이지 섹션이 화면 뷰포트 내에 들어왔는지 확인\n      const isVisible = (rect.top \u003c vh && rect.bottom > 0);\n      if (!isVisible) return;\n\n      // 3페이지 섹션 상단이 화면 상단(top: 0) 부근에 정확히 안착했는지 여부 (허용 오차 40px)\n      const isAligned = Math.abs(rect.top) \u003c= 40;\n\n      if (e.deltaY > 0) { // 아래로 마우스 휠\n        if (currentProcessStep \u003c processStepsData.length - 1) {\n          // 화면 상단에 도착하지 않은 상태에서 내려오는 중인 경우\n          if (!isAligned && rect.top > 0) {\n            // 3페이지 상단이 화면의 70% 이내로 들어왔을 때 3페이지 상단으로 화면을 착 안착시킴\n            if (rect.top \u003c vh * 0.7) {\n              e.preventDefault();\n              if (!isWheelLocked) {\n                isWheelLocked = true;\n                const targetY = window.pageYOffset + rect.top;\n                window.scrollTo({ top: targetY, behavior: 'smooth' });\n                setTimeout(() => { isWheelLocked = false; }, 300);\n              }\n            }\n            // 아직 화면 상단에 완전히 닿기 전에는 카드 슬라이드를 진행하지 않음\n            return;\n          }\n\n          // 화면 상단에 완전히 도착한 상태에서만 카드 슬라이드 진행!\n          e.preventDefault();\n          if (!isWheelLocked) {\n            isWheelLocked = true;\n            currentProcessStep++;\n            updateProcessUI(currentProcessStep);\n            setTimeout(() => { isWheelLocked = false; }, 280);\n          }\n        }\n        // 마지막 단계(STEP 04)에서는 preventDefault하지 않고 자연스럽게 4페이지로 이동\n      } else if (e.deltaY \u003c 0) { // 위로 마우스 휠\n        if (currentProcessStep > 0) {\n          // 화면 상단 정렬이 벗어나 있는 경우 먼저 3페이지 상단 위치로 맞춤\n          if (!isAligned && rect.top \u003c 0) {\n            if (rect.bottom > vh * 0.3) {\n              e.preventDefault();\n              if (!isWheelLocked) {\n                isWheelLocked = true;\n                const targetY = window.pageYOffset + rect.top;\n                window.scrollTo({ top: targetY, behavior: 'smooth' });\n                setTimeout(() => { isWheelLocked = false; }, 300);\n              }\n            }\n            return;\n          }\n\n          e.preventDefault();\n          if (!isWheelLocked) {\n            isWheelLocked = true;\n            currentProcessStep--;\n            updateProcessUI(currentProcessStep);\n            setTimeout(() => { isWheelLocked = false; }, 280);\n          }\n        }\n        // STEP 01에서 위로 휠 조작 시 preventDefault하지 않고 자연스럽게 2페이지로 올라감\n      }\n    }, { passive: false });\n  \u003c/script>\n\n\u003c/body>\n\n\u003c/html>\n","config.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>EUREKA - 타겟 설정\u003c/title>\n  \u003c!-- Google Fonts: IBM Plex Sans KR & Iceland -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink\n    href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&display=swap\"\n    rel=\"stylesheet\">\n  \u003cstyle>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html,\n    body {\n      width: 100%;\n      min-height: 100vh;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      background: linear-gradient(180deg, #EBF4FC 0%, #F6F5FD 100%);\n      color: #333;\n      overflow-x: hidden;\n      overflow-y: auto;\n      /* 화면 확대/축소 시 하단 내용을 볼 수 있도록 자동 세로 스크롤 생성 */\n    }\n\n    /* 100% 풀 위드 섹션 & 중앙 1440px 인너 래퍼 */\n    .section-full {\n      width: 100%;\n      min-height: 100vh;\n      display: flex;\n      justify-content: center;\n      position: relative;\n    }\n\n    .inner-content {\n      width: 1440px;\n      min-height: 1024px;\n      position: relative;\n      flex-shrink: 0;\n    }\n\n    /* 상단 고정 헤더 GNB 바 */\n    .fixed-gnb {\n      width: 100%;\n      height: 75px;\n      position: fixed;\n      top: 0;\n      left: 0;\n      display: flex;\n      justify-content: center;\n      background: rgba(246, 245, 253, 0.60);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      z-index: 1000001;\n      border: none !important;\n      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);\n    }\n\n    .fixed-gnb-inner {\n      width: 1312px;\n      max-width: 100%;\n      height: 100%;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 24px;\n    }\n\n    @media (max-width: 1440px) {\n      .fixed-gnb-inner {\n        width: 100%;\n        padding: 0 64px;\n      }\n    }\n\n    /* 상단 헤더 메뉴 호버 효과 */\n    .nav-item {\n      cursor: pointer;\n      transition: opacity 0.2s ease;\n    }\n\n    .nav-item:hover {\n      opacity: 0.7;\n    }\n\n    /* 칩 버튼 스타일 (기본 & 활성화 보라색 state) */\n    .chip-btn {\n      padding: 8px 20px;\n      border-radius: 30px;\n      font-size: 14px;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      font-weight: 600;\n      letter-spacing: 1px;\n      cursor: pointer;\n      transition: all 0.25s ease;\n      user-select: none;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n    }\n\n    /* 미선택 상태 (기본 회색) */\n    .chip-btn:not(.active) {\n      background: #EDEDED;\n      color: #727272;\n    }\n\n    .chip-btn:not(.active):hover {\n      background: #E2E2E2;\n      color: #333;\n    }\n\n    /* 선택 상태 (활성화 보라색 #6B42FF) */\n    .chip-btn.active {\n      background: #6B42FF !important;\n      color: #FFFFFF !important;\n      box-shadow: 0px 4px 10px rgba(107, 66, 255, 0.25);\n    }\n\n    .group-title-row {\n      display: flex;\n      align-items: baseline;\n      gap: 10px;\n      margin-bottom: 20px;\n    }\n\n    .group-help {\n      color: #888;\n      font-size: 14px;\n      font-weight: 400;\n    }\n\n    .selection-status {\n      min-height: 22px;\n      margin-top: 18px;\n      color: #6B42FF;\n      font-size: 13px;\n      font-weight: 500;\n    }\n\n    .selection-error {\n      min-height: 20px;\n      margin-top: 12px;\n      color: #E5484D;\n      font-size: 13px;\n      font-weight: 500;\n    }\n\n    .target-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 24px;\n    }\n\n    .target-field {\n      min-width: 0;\n    }\n\n    .field-heading {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 12px;\n      margin-bottom: 11px;\n    }\n\n    .field-label {\n      color: #111;\n      font-size: 18px;\n      font-weight: 600;\n    }\n\n    .field-hint {\n      color: #8A8F9A;\n      font-size: 12px;\n      font-weight: 400;\n    }\n\n    .target-select,\n    .token-input {\n      width: 100%;\n      min-height: 48px;\n      border: 1px solid #DBDFE7;\n      border-radius: 10px;\n      background: #FAFBFD;\n      color: #333;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      font-size: 14px;\n      outline: none;\n      transition: border-color 0.2s ease, box-shadow 0.2s ease;\n    }\n\n    .target-select {\n      padding: 0 15px;\n      cursor: pointer;\n    }\n\n    .target-select:focus,\n    .token-input-shell:focus-within {\n      border-color: #6B42FF;\n      box-shadow: 0 0 0 3px rgba(107, 66, 255, 0.1);\n    }\n\n    .target-select.invalid,\n    .token-input-shell.invalid {\n      border-color: #E5484D;\n    }\n\n    .token-input-shell {\n      display: flex;\n      flex-wrap: wrap;\n      align-items: center;\n      gap: 7px;\n      min-height: 52px;\n      padding: 7px 10px;\n      border: 1px solid #DBDFE7;\n      border-radius: 10px;\n      background: #FAFBFD;\n      transition: border-color 0.2s ease, box-shadow 0.2s ease;\n    }\n\n    .token-input {\n      flex: 1;\n      width: auto;\n      min-width: 190px;\n      min-height: 34px;\n      padding: 0 5px;\n      border: 0;\n      background: transparent;\n      box-shadow: none !important;\n    }\n\n    .token-chip {\n      display: inline-flex;\n      align-items: center;\n      gap: 7px;\n      padding: 7px 10px 7px 13px;\n      border-radius: 30px;\n      background: #F2EEFF;\n      color: #5B35DF;\n      font-size: 13px;\n      font-weight: 600;\n    }\n\n    .token-remove {\n      border: 0;\n      background: transparent;\n      color: #7B64D7;\n      font: inherit;\n      line-height: 1;\n      cursor: pointer;\n    }\n\n    .target-divider {\n      width: 100%;\n      height: 1px;\n      margin: 28px 0;\n      background: rgba(235, 235, 235, 0.9);\n    }\n\n    .target-progress {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-top: 22px;\n    }\n\n    .progress-dots {\n      display: flex;\n      gap: 6px;\n    }\n\n    .progress-dot {\n      width: 26px;\n      height: 6px;\n      border-radius: 8px;\n      background: #E3E5EA;\n    }\n\n    .progress-dot.filled {\n      background: #6B42FF;\n    }\n\n    [data-속성-1].disabled {\n      background: #C8CBD3 !important;\n      box-shadow: none !important;\n      cursor: not-allowed !important;\n      transform: none !important;\n    }\n\n    /* 버튼 호버 효과 */\n    [data-속성-1] {\n      transition: all 0.25s ease;\n      cursor: pointer;\n    }\n\n    [data-속성-1]:hover {\n      transform: translateY(-2px);\n      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.15) !important;\n    }\n\n    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */\n    @media (max-width: 800px) {\n      .fixed-gnb-inner { width: 100%; padding: 0 20px; }\n      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }\n      .fixed-gnb .nav-item { display: none; white-space: nowrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n  \u003c!-- 상단 화면 전체(100%) 고정 네비게이션 바 -->\n  \u003cdiv class=\"fixed-gnb\">\n    \u003cdiv class=\"fixed-gnb-inner\">\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 50px; display: flex\">\n        \u003cdiv onclick=\"goHome()\" title=\"홈으로 이동\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; word-wrap: break-word; cursor: pointer;\">\n          EUREKA\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          커뮤니티\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          요금제\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 48px; display: flex\">\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          로그인\u003c/div>\n        \u003cdiv class=\"nav-item\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px; word-wrap: break-word\">\n          마이페이지\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 메인 2번 타겟 설정 온보딩 섹션 -->\n  \u003cdiv class=\"section-full\">\n    \u003cdiv class=\"inner-content\">\n\n      \u003c!-- 서브타이틀 -->\n      \u003cdiv\n        style=\"width: 100%; left: 0; top: 180px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: #4262FF; font-size: 16px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 30px;\">\n        타겟 설정\n      \u003c/div>\n\n      \u003c!-- 메인 타이틀 -->\n      \u003cdiv\n        style=\"width: 100%; left: 0; top: 225px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 40px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; line-height: 30px;\">\n        누구의 문제를 찾고 있나요?\n      \u003c/div>\n\n      \u003cdiv id=\"target-help\"\n        style=\"width: 100%; left: 0; top: 278px; position: absolute; text-align: center; color: #666; font-size: 15px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400;\">\n        입력한 조건과 관련된 업무·생활 속 불편을 찾아요. 최소 2개를 입력해 주세요.\u003cbr>수집한 글에서 같은 경험자의 조건을 확인합니다.\n      \u003c/div>\n\n      \u003c!-- 중앙 1004px x 621px 흰색 카드 박스 -->\n      \u003cdiv\n        style=\"width: 1004px; height: 621px; left: 218px; top: 335px; position: absolute; background: white; box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04); border-radius: 20px; padding: 48px 58px; box-sizing: border-box;\">\n\n        \u003cdiv class=\"target-grid\">\n          \u003cdiv class=\"target-field\">\n            \u003cdiv class=\"field-heading\">\n              \u003clabel class=\"field-label\" for=\"age-input\">나이대\u003c/label>\n              \u003cspan class=\"field-hint\">선택\u003c/span>\n            \u003c/div>\n            \u003cselect class=\"target-select\" id=\"age-input\" onchange=\"handleSelectChange()\">\n              \u003coption value=\"\">미선택\u003c/option>\n              \u003coption value=\"10대\">10대\u003c/option>\n              \u003coption value=\"20대\">20대\u003c/option>\n              \u003coption value=\"30대\">30대\u003c/option>\n              \u003coption value=\"40대\">40대\u003c/option>\n              \u003coption value=\"50대 이상\">50대 이상\u003c/option>\n            \u003c/select>\n          \u003c/div>\n\n          \u003cdiv class=\"target-field\">\n            \u003cdiv class=\"field-heading\">\n              \u003clabel class=\"field-label\" for=\"gender-input\">성별\u003c/label>\n              \u003cspan class=\"field-hint\">선택\u003c/span>\n            \u003c/div>\n            \u003cselect class=\"target-select\" id=\"gender-input\" onchange=\"handleSelectChange()\">\n              \u003coption value=\"\">미선택\u003c/option>\n              \u003coption value=\"여성\">여성\u003c/option>\n              \u003coption value=\"남성\">남성\u003c/option>\n            \u003c/select>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"target-divider\">\u003c/div>\n\n        \u003cdiv class=\"target-field\" style=\"margin-bottom: 24px;\">\n          \u003cdiv class=\"field-heading\">\n            \u003clabel class=\"field-label\" for=\"jobs-input\">직업\u003c/label>\n            \u003cspan class=\"field-hint\">입력 후 Enter · 최대 5개\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"token-input-shell\" id=\"jobs-shell\">\n            \u003cdiv id=\"jobs-tokens\" style=\"display: contents;\">\u003c/div>\n            \u003cinput class=\"token-input\" id=\"jobs-input\" type=\"text\"\n              placeholder=\"예: 간호사, 프리랜서 디자이너\"\n              onkeydown=\"handleTokenKeydown(event, 'jobs')\" oninput=\"clearAttemptState()\" />\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"target-field\">\n          \u003cdiv class=\"field-heading\">\n            \u003clabel class=\"field-label\" for=\"places-input\">장소\u003c/label>\n            \u003cspan class=\"field-hint\">입력 후 Enter · 최대 5개\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"token-input-shell\" id=\"places-shell\">\n            \u003cdiv id=\"places-tokens\" style=\"display: contents;\">\u003c/div>\n            \u003cinput class=\"token-input\" id=\"places-input\" type=\"text\"\n              placeholder=\"예: 사무실, 병원, 학교, 원룸\"\n              onkeydown=\"handleTokenKeydown(event, 'places')\" oninput=\"clearAttemptState()\" />\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"target-progress\">\n          \u003cdiv>\n            \u003cdiv class=\"selection-status\" id=\"selection-status\" style=\"margin-top: 0;\">0 / 4 항목 입력\u003c/div>\n            \u003cdiv class=\"selection-error\" id=\"selection-error\" role=\"alert\" style=\"margin-top: 2px;\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"progress-dots\" id=\"progress-dots\" aria-label=\"입력 항목 수\">\n            \u003cspan class=\"progress-dot\">\u003c/span>\u003cspan class=\"progress-dot\">\u003c/span>\n            \u003cspan class=\"progress-dot\">\u003c/span>\u003cspan class=\"progress-dot\">\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 우측 하단 \"문제 탐색\" 보라색 버튼 -->\n      \u003cdiv data-속성-1=\"베리언트2\" id=\"start-search-btn\" class=\"disabled\" onclick=\"startSearch()\" aria-disabled=\"true\"\n        style=\"width: 190px; height: 56px; padding: 13px 20px; left: 958px; top: 850px; position: absolute; background: #6B42FF; border-radius: 10px; justify-content: center; align-items: center; gap: 10px; display: inline-flex; cursor: pointer;\">\n        \u003cdiv\n          style=\"text-align: center; color: white; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600; letter-spacing: 1px;\">\n          문제 정의 탐색\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    // EUREKA 클릭 시 1번 홈 화면으로 이동\n    function goHome() {\n      parent.__navigate('index.html');\n    }\n\n    if (parent.__dataMode !== 'live') document.getElementById('target-help').textContent = '오프라인 검토 파일입니다. 조건을 입력해도 새로 수집하지 않으며, 파일에 포함된 결과만 확인합니다.';\n    const TARGET_MIN_FILLED = 2;\n    const TARGET_TOKEN_MAX = 5;\n    const targetState = { age: '', gender: '', jobs: [], places: [] };\n    let attempted = false;\n\n    function filledCount() {\n      return Number(Boolean(targetState.age))\n        + Number(Boolean(targetState.gender))\n        + Number(targetState.jobs.length > 0)\n        + Number(targetState.places.length > 0);\n    }\n\n    function escapeHtml(value) {\n      return String(value)\n        .replaceAll('&', '&amp;')\n        .replaceAll('\u003c', '&lt;')\n        .replaceAll('>', '&gt;')\n        .replaceAll('\"', '&quot;')\n        .replaceAll(\"'\", '&#039;');\n    }\n\n    function renderTokens(field) {\n      const container = document.getElementById(`${field}-tokens`);\n      container.innerHTML = targetState[field].map((token, index) => `\n        \u003cspan class=\"token-chip\">\n          ${escapeHtml(token)}\n          \u003cbutton type=\"button\" class=\"token-remove\" data-field=\"${field}\" data-index=\"${index}\"\n            aria-label=\"${escapeHtml(token)} 삭제\">×\u003c/button>\n        \u003c/span>\n      `).join('');\n      container.querySelectorAll('.token-remove').forEach(button => {\n        button.addEventListener('click', () => removeToken(button.dataset.field, Number(button.dataset.index)));\n      });\n    }\n\n    function removeToken(field, index) {\n      targetState[field].splice(index, 1);\n      attempted = false;\n      renderTokens(field);\n      updateFormState();\n      document.getElementById(`${field}-input`).focus();\n    }\n\n    function addToken(field, rawValue) {\n      const value = rawValue.trim().replace(/\\s+/g, ' ');\n      if (!value) return '';\n      if (value.length > 30) { updateFormState('키워드는 30자 이내로 입력해 주세요.'); return rawValue; }\n      if (targetState[field].includes(value)) {\n        updateFormState('이미 등록된 키워드예요.');\n        return '';\n      }\n      if (targetState[field].length >= TARGET_TOKEN_MAX) {\n        updateFormState(`키워드는 각 항목에 최대 ${TARGET_TOKEN_MAX}개까지 등록할 수 있어요.`);\n        return rawValue;\n      }\n      targetState[field].push(value);\n      attempted = false;\n      renderTokens(field);\n      updateFormState();\n      return '';\n    }\n\n    function handleTokenKeydown(event, field) {\n      // 한글 IME 조합 중 Enter는 마지막 글자를 확정하는 용도다.\n      // 이 시점에 토큰으로 저장하면 마지막 글자가 다음 토큰으로 남을 수 있다.\n      if (event.isComposing || event.keyCode === 229) return;\n\n      if (event.key === 'Enter') {\n        event.preventDefault();\n        event.currentTarget.value = addToken(field, event.currentTarget.value);\n      } else if (event.key === 'Backspace' && !event.currentTarget.value && targetState[field].length) {\n        targetState[field].pop();\n        attempted = false;\n        renderTokens(field);\n        updateFormState();\n      }\n    }\n\n    function handleSelectChange() {\n      targetState.age = document.getElementById('age-input').value;\n      targetState.gender = document.getElementById('gender-input').value;\n      attempted = false;\n      updateFormState();\n    }\n\n    function clearAttemptState() {\n      if (!attempted) return;\n      attempted = false;\n      updateFormState();\n    }\n\n    function updateFormState(message = '') {\n      const filled = filledCount();\n      const isReady = filled >= TARGET_MIN_FILLED;\n      const button = document.getElementById('start-search-btn');\n      button.classList.toggle('disabled', !isReady);\n      button.setAttribute('aria-disabled', String(!isReady));\n      document.getElementById('selection-status').textContent = isReady\n        ? `${filled} / 4 항목 입력 · 문제 정의를 탐색할 수 있어요.`\n        : `${filled} / 4 항목 입력 · 최소 ${TARGET_MIN_FILLED}개가 필요해요.`;\n      document.getElementById('selection-error').textContent = message;\n      document.querySelectorAll('#progress-dots .progress-dot').forEach((dot, index) => {\n        dot.classList.toggle('filled', index \u003c filled);\n      });\n\n      const invalid = attempted && !isReady;\n      document.getElementById('age-input').classList.toggle('invalid', invalid && !targetState.age);\n      document.getElementById('gender-input').classList.toggle('invalid', invalid && !targetState.gender);\n      document.getElementById('jobs-shell').classList.toggle('invalid', invalid && targetState.jobs.length === 0);\n      document.getElementById('places-shell').classList.toggle('invalid', invalid && targetState.places.length === 0);\n    }\n\n    function startSearch() {\n      if (filledCount() \u003c TARGET_MIN_FILLED) {\n        attempted = true;\n        updateFormState('최소 2개 항목을 입력해야 문제 정의 탐색을 시작할 수 있어요.');\n        const firstEmpty = [\n          ['age-input', !targetState.age],\n          ['gender-input', !targetState.gender],\n          ['jobs-input', targetState.jobs.length === 0],\n          ['places-input', targetState.places.length === 0]\n        ].find(([, empty]) => empty);\n        if (firstEmpty) document.getElementById(firstEmpty[0]).focus();\n        return;\n      }\n\n      localStorage.setItem('eureka_target_profile', JSON.stringify({\n        age: targetState.age || null,\n        gender: targetState.gender || null,\n        jobs: targetState.jobs,\n        places: targetState.places\n      }));\n      localStorage.removeItem('eureka_categories');\n      localStorage.removeItem('eureka_platforms');\n      if (parent.__dataMode === 'live') parent.__collections.start({age:targetState.age || null, gender:targetState.gender || null, jobs:[...targetState.jobs], places:[...targetState.places]});\n      parent.__navigate('loading.html');\n    }\n\n    function restoreTarget() {\n      try {\n        const saved = JSON.parse(localStorage.getItem('eureka_target_profile') || 'null');\n        if (saved && typeof saved === 'object') {\n          targetState.age = typeof saved.age === 'string' ? saved.age : '';\n          targetState.gender = typeof saved.gender === 'string' ? saved.gender : '';\n          targetState.jobs = Array.isArray(saved.jobs) ? saved.jobs.slice(0, TARGET_TOKEN_MAX) : [];\n          targetState.places = Array.isArray(saved.places) ? saved.places.slice(0, TARGET_TOKEN_MAX) : [];\n          document.getElementById('age-input').value = targetState.age;\n          document.getElementById('gender-input').value = targetState.gender;\n        }\n      } catch (error) {\n        console.error(error);\n      }\n      renderTokens('jobs');\n      renderTokens('places');\n      updateFormState();\n    }\n\n    restoreTarget();\n  \u003c/script>\n\u003c/body>\n\n\u003c/html>\n","loading.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>EUREKA - 문제 탐색 중\u003c/title>\n  \u003c!-- Google Fonts: IBM Plex Sans KR & Iceland -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&display=swap\" rel=\"stylesheet\">\n  \u003cstyle>\n    [hidden] { display:none !important; }\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    html, body {\n      width: 100%;\n      height: 100vh;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      background: linear-gradient(180deg, #EBF4FC 0%, #F6F5FD 100%);\n      color: #333;\n      overflow-x: hidden; overflow-y: auto;\n    }\n\n    /* 100% 풀 위드 섹션 & 중앙 1440px 인너 래퍼 */\n    .section-full {\n      width: 100%;\n      height: 100vh;\n      display: flex;\n      justify-content: center;\n      position: relative;\n    }\n    .inner-content {\n      width: 1440px;\n      min-height: 1080px;\n      position: relative;\n      flex-shrink: 0;\n    }\n\n    /* 상단 고정 헤더 GNB 바 */\n    .fixed-gnb {\n      width: 100%;\n      height: 75px;\n      position: fixed;\n      top: 0;\n      left: 0;\n      display: flex;\n      justify-content: center;\n      background: rgba(246, 245, 253, 0.60);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      z-index: 1000001;\n      border: none !important;\n      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);\n    }\n    .fixed-gnb-inner {\n      width: 1312px;\n      max-width: 100%;\n      height: 100%;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 24px;\n    }\n\n    /* 상단 헤더 메뉴 호버 효과 */\n    .nav-item {\n      cursor: pointer;\n      transition: opacity 0.2s ease;\n    }\n    .nav-item:hover {\n      opacity: 0.7;\n    }\n\n    /* 0.2초 삼색 순환 애니메이션 (#F1EDFF > #B4A1FA > #6B42FF) */\n    @keyframes strokeColorWave {\n      0% { stroke: #F1EDFF; }\n      33% { stroke: #B4A1FA; }\n      66% { stroke: #6B42FF; }\n      100% { stroke: #F1EDFF; }\n    }\n\n    /* 수직 세로 아래 방향 화살표 3단 그룹 (위 ∨ / 중간 ∨ / 아래 ∨) */\n    .arrow-down-group {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      gap: 2px;\n      margin: 8px 0;\n    }\n\n    .arrow-down-group path {\n      stroke: #E2E8F0; /* 비활성 시 정적 연회색 */\n      transition: stroke 0.3s ease;\n    }\n\n    /* 활성화된 스텝 아래 3단 세로 화살표의 0.2초 삼색 Wave 애니메이션 */\n    .arrow-down-group.active .arr1 path {\n      animation: strokeColorWave 0.6s infinite linear 0s;\n    }\n    .arrow-down-group.active .arr2 path {\n      animation: strokeColorWave 0.6s infinite linear 0.2s;\n    }\n    .arrow-down-group.active .arr3 path {\n      animation: strokeColorWave 0.6s infinite linear 0.4s;\n    }\n\n    /* 각 단계 텍스트 아이템 스타일 */\n    .step-item {\n      width: 100%;\n      text-align: center;\n      font-size: 20px;\n      font-family: 'IBM Plex Sans KR', sans-serif;\n      line-height: 28px;\n      transition: all 0.3s ease;\n    }\n\n    /* 비활성/완료 단계 텍스트 */\n    .step-item.inactive {\n      color: #464646;\n      font-weight: 400;\n    }\n\n    /* 현재 진행 중인 단계 텍스트 (볼드체 + 보라색 #7C3AED) */\n    .step-item.active {\n      color: #7C3AED !important;\n      font-weight: 700 !important;\n    }\n\n    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */\n    @media (max-width: 800px) {\n      .fixed-gnb-inner { width: 100%; padding: 0 20px; }\n      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }\n      .fixed-gnb .nav-item { display: none; white-space: nowrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\n  \u003c!-- 상단 고정 네비게이션 바 -->\n  \u003cdiv class=\"fixed-gnb\">\n    \u003cdiv class=\"fixed-gnb-inner\">\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 50px; display: flex\">\n        \u003cdiv onclick=\"goHome()\" title=\"홈 화면으로 이동\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; word-wrap: break-word; cursor: pointer;\">\n          EUREKA\n        \u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px;\">커뮤니티\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px;\">요금제\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 48px; display: flex\">\n        \u003cdiv class=\"nav-item\" style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px;\">로그인\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 20px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 400; line-height: 30px;\">마이페이지\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 메인 3번 로딩 섹션 -->\n  \u003cdiv class=\"section-full\">\n    \u003cdiv class=\"inner-content\">\n      \n      \u003c!-- 메인 로딩 타이틀 -->\n      \u003cdiv id=\"loading-title\" style=\"width: 100%; left: 0; top: 167px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 40px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 500; line-height: 50px;\">\n        사람들의 불편 속에서\u003cbr/>문제의 시작점을 찾는 중이에요\n      \u003c/div>\n\n      \u003c!-- 중앙 551px x 537px 흰색 카드 박스 -->\n      \u003cdiv style=\"width: 551px; min-height: 537px; left: calc((100% - 551px) / 2); top: 323px; position: absolute; background: white; box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;\">\n        \n        \u003cdiv id=\"collection-status\" role=\"status\" style=\"width:100%;font-size:15px;line-height:1.7;margin-bottom:20px;word-break:keep-all;text-align:center;\">\u003c/div>\n        \u003cdiv id=\"collection-counts\" style=\"width:100%;font-size:13px;line-height:1.8;color:#666;margin-bottom:20px;text-align:center;\">\u003c/div>\n        \u003cdiv id=\"collection-coverage\" style=\"width:100%;font-size:13px;line-height:1.8;color:#6B42FF;margin-bottom:12px;text-align:center;\">\u003c/div>\n        \u003cdiv id=\"collection-cumulative\" style=\"width:100%;font-size:12px;line-height:1.8;color:#666;margin-bottom:12px;text-align:center;\">\u003c/div>\n        \u003cdiv id=\"collection-stop\" role=\"status\" style=\"width:100%;font-size:13px;line-height:1.8;color:#785223;margin-bottom:12px;text-align:center;\">\u003c/div>\n        \u003cdetails id=\"collection-search-details\" hidden style=\"width:100%;margin-bottom:20px;font-size:12px;line-height:1.8;\">\n          \u003csummary style=\"cursor:pointer;color:#6B42FF;\">실제 검색어·반환 건수·제외 사유\u003c/summary>\n          \u003cdiv id=\"collection-search-results\" style=\"white-space:pre-wrap;max-height:240px;overflow:auto;margin-top:10px;word-break:break-word;\">\u003c/div>\n        \u003c/details>\n        \u003c!-- 5단계 진행 상태 목록 (텍스트 ➔ 세로 3단 ∨ 화살표 ➔ 텍스트) -->\n        \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;\">\n          \n          \u003c!-- 1단계 -->\n          \u003cdiv id=\"step-0\" class=\"step-item active\">타겟과 관련된 사용자 불편 찾는 중\u003c/div>\n          \u003cdiv id=\"arrow-0\" class=\"arrow-down-group active\">\n            \u003csvg class=\"arr arr1\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr2\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr3\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n          \u003c/div>\n\n          \u003c!-- 2단계 -->\n          \u003cdiv id=\"step-1\" class=\"step-item inactive\">수집한 글 분석 · 불편 확인\u003c/div>\n          \u003cdiv id=\"arrow-1\" class=\"arrow-down-group inactive\">\n            \u003csvg class=\"arr arr1\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr2\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr3\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n          \u003c/div>\n\n          \u003c!-- 3단계 -->\n          \u003cdiv id=\"step-2\" class=\"step-item inactive\">관련 근거 연결하는 중\u003c/div>\n          \u003cdiv id=\"arrow-2\" class=\"arrow-down-group inactive\">\n            \u003csvg class=\"arr arr1\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr2\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr3\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n          \u003c/div>\n\n          \u003c!-- 4단계 -->\n          \u003cdiv id=\"step-3\" class=\"step-item inactive\">문제정의 작성 · AI 검수\u003c/div>\n          \u003cdiv id=\"arrow-3\" class=\"arrow-down-group inactive\">\n            \u003csvg class=\"arr arr1\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr2\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n            \u003csvg class=\"arr arr3\" width=\"16\" height=\"8\" viewBox=\"0 0 16 8\" fill=\"none\">\u003cpath d=\"M1.5 1.5L8 6.5L14.5 1.5\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n          \u003c/div>\n\n          \u003c!-- 5단계 -->\n          \u003cdiv id=\"step-4\" class=\"step-item inactive\">이번 탐색 결과 확인\u003c/div>\n          \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px;\">\n            \u003cbutton id=\"view-progress\" hidden onclick=\"parent.__navigate('result.html')\" style=\"padding:12px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;cursor:pointer;\">현재까지 발견한 불편 보기\u003c/button>\n            \u003cbutton id=\"continue-collection\" hidden style=\"padding:12px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;cursor:pointer;\">추가 탐색\u003c/button>\n            \u003cbutton id=\"retry-collection\" hidden style=\"padding:12px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;cursor:pointer;\">실행 상태 다시 확인\u003c/button>\n            \u003cbutton id=\"view-snapshot\" hidden onclick=\"parent.__navigate('result.html')\" style=\"padding:12px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;cursor:pointer;\">포함된 결과 보기\u003c/button>\n            \u003cbutton onclick=\"parent.__navigate('config.html')\" style=\"padding:12px 18px;border:1px solid #ddd;border-radius:10px;background:white;cursor:pointer;\">타겟 조건 수정\u003c/button>\n          \u003c/div>\n\n        \u003c/div>\n\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    // EUREKA 로고 클릭 시 홈 화면으로 복귀\n    function goHome() {\n      parent.__navigate('index.html');\n    }\n\n    const liveMode = parent.__dataMode === 'live';\n    const statusBox = document.getElementById('collection-status');\n    const countsBox = document.getElementById('collection-counts');\n    if (!liveMode) {\n      document.getElementById('loading-title').textContent = '이 파일에 포함된 결과를 확인해 보세요';\n      statusBox.textContent = '오프라인 파일은 새로 수집하지 않습니다. 입력한 조건은 포함된 표본의 수집 조건을 바꾸지 않습니다.';\n      document.getElementById('view-snapshot').hidden = false;\n      document.querySelectorAll('.step-item, .arrow-down-group').forEach(el => el.hidden = true);\n    } else {\n      let leaving = false;\n      function draw(run) {\n        const summary = parent.__describeCollection(run);\n        statusBox.textContent = summary.progress || run?.error || run?.message || '탐색 실행 상태를 확인하고 있습니다.';\n        countsBox.textContent = summary.cumulative || summary.counts;\n        document.getElementById('view-progress').hidden = !parent.__collections.canView(run);\n        document.getElementById('collection-coverage').textContent = summary.coverage;\n        document.getElementById('collection-cumulative').textContent = '수집한 자료를 먼저 분석하고, 확인된 근거로 문제를 정리합니다.';\n        document.getElementById('collection-stop').textContent = summary.stop;\n        const explanation = [summary.planNotice, summary.technical, summary.counts && '이번 처리 · ' + summary.counts, summary.queries && '실제 실행한 검색\\n' + summary.queries, summary.exclusions && '제외 사유\\n' + summary.exclusions, summary.warnings].filter(Boolean).join('\\n\\n');\n        document.getElementById('collection-search-details').hidden = !explanation;\n        document.getElementById('collection-search-results').textContent = explanation;\n        document.getElementById('continue-collection').hidden = !parent.__collections.canContinue(run);\n        const stageIndex = {searching:0, interpreting:1, evidence:2, generating:3, completed:4}[run?.stage];\n        const running = ['queued','running'].includes(run?.status);\n        for(let i=0;i\u003c5;i++) {\n          document.getElementById(`step-${i}`).classList.toggle('active', running && i === stageIndex);\n          const arrow = document.getElementById(`arrow-${i}`);\n          if(arrow) arrow.classList.toggle('active', running && i === stageIndex);\n        }\n        const retryButton = document.getElementById('retry-collection');\n        retryButton.hidden = !['failed','connection_error','legacy'].includes(run?.status) || !parent.__collections.hasTarget();\n        retryButton.textContent = ['failed','legacy'].includes(run?.status) ? '같은 조건으로 다시 탐색' : '실행 상태 다시 확인';\n        document.getElementById('loading-title').textContent = ['failed','connection_error','legacy'].includes(run?.status) ? '탐색 상태를 확인해 주세요' : '입력한 조건으로 실제 불편을 찾고 있어요';\n        if (run?.status === 'completed' && !leaving) {\n          leaving = true;\n          parent.__navigate(parent.__collectionDestination || 'result.html');\n        }\n      }\n      const unsubscribe = parent.__collections.subscribe(draw);\n      window.addEventListener('unload', unsubscribe);\n      document.getElementById('retry-collection').addEventListener('click', () => parent.__collections.retry());\n      document.getElementById('continue-collection').addEventListener('click', () => parent.__collections.continueSearch());\n      parent.__collections.resume();\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","result.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>EUREKA - 문제 탐색 결과\u003c/title>\n  \u003c!-- Google Fonts: IBM Plex Sans KR, Noto Sans KR, Inter & Iceland -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  \u003cstyle>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    html, body {\n      width: 100%;\n      min-height: 100vh;\n      font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;\n      background: #FFFFFF;\n      color: #333;\n      overflow-x: hidden;\n      overflow-y: auto;\n    }\n\n    /* 100% 풀 위드 섹션 & 중앙 1440px 인너 래퍼 */\n    .section-full {\n      width: 100%;\n      min-height: 100vh;\n      display: flex;\n      justify-content: center;\n      position: relative;\n      padding-bottom: 120px;\n    }\n    .inner-content {\n      width: 1440px;\n      min-height: 1792px;\n      position: relative;\n      flex-shrink: 0;\n    }\n\n    /* 상단 고정 헤더 GNB 바 */\n    .fixed-gnb {\n      width: 100%;\n      height: 75px;\n      position: fixed;\n      top: 0;\n      left: 0;\n      display: flex;\n      justify-content: center;\n      background: rgba(246, 245, 253, 0.60);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      z-index: 1000001;\n      border: none !important;\n      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);\n    }\n    .fixed-gnb-inner {\n      width: 1312px;\n      max-width: 100%;\n      height: 100%;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 24px;\n    }\n    @media (max-width: 1440px) {\n      .fixed-gnb-inner {\n        width: 100%;\n        padding: 0 64px;\n      }\n    }\n    .nav-item {\n      cursor: pointer;\n      transition: opacity 0.2s ease;\n    }\n    .nav-item:hover {\n      opacity: 0.7;\n    }\n\n    /* 상단 요약 박스 내 수정하기 버튼 */\n    .edit-btn {\n      padding: 6px 16px;\n      background: #FFFFFF;\n      border-radius: 30px;\n      color: #727272;\n      font-size: 14px;\n      font-weight: 600;\n      cursor: pointer;\n      transition: all 0.2s ease;\n      user-select: none;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);\n    }\n    .edit-btn:hover {\n      background: #6B42FF;\n      color: #FFFFFF;\n    }\n\n    /* 카테고리 탭 바 스타일 */\n    .tab-container {\n      position: absolute;\n      left: 127px;\n      top: 418px;\n      display: flex;\n      gap: 14px;\n      z-index: 10;\n    }\n    .tab-btn {\n      width: 186px;\n      height: 52px;\n      padding: 10px 20px;\n      border-top-left-radius: 15px;\n      border-top-right-radius: 15px;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      cursor: pointer;\n      transition: all 0.2s ease;\n      user-select: none;\n    }\n    .tab-btn.active {\n      background: #6B42FF;\n      color: #FFFFFF;\n      font-weight: 700;\n      font-size: 20px;\n      box-shadow: none;\n      transform: translateY(0);\n    }\n    .tab-btn:not(.active) {\n      background: #FFFFFF;\n      color: #969696;\n      font-weight: 400;\n      font-size: 18px;\n      box-shadow: 4px 0px 4px rgba(0, 0, 0, 0.11);\n      margin-top: 8px;\n      height: 44px;\n    }\n    .tab-btn:not(.active):hover {\n      color: #6B42FF;\n      background: #F9F8FF;\n    }\n\n    /* 정렬 헤더 버튼 호버 및 활성 스타일 (보라색 헤더에 어울리는 소프트 라벤더 포인트) */\n    .sort-header-btn {\n      cursor: pointer;\n      user-select: none;\n      transition: all 0.2s ease;\n      display: inline-flex;\n      align-items: center;\n      gap: 4px;\n      padding: 6px 12px;\n      border-radius: 8px;\n      color: rgba(255, 255, 255, 0.85);\n    }\n    .sort-header-btn:hover {\n      background: rgba(255, 255, 255, 0.18);\n      color: #FFFFFF !important;\n    }\n    .sort-header-btn.active {\n      color: #E9D5FF !important; /* 소프트 라벤더 포인트 컬러 */\n      background: rgba(255, 255, 255, 0.22);\n      font-weight: 700 !important;\n    }\n\n    /* 문제 카드 아이템 */\n    .problem-card {\n      width: 1103px;\n      height: 120px;\n      position: relative;\n      background: white;\n      box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04);\n      border-radius: 15px;\n      transition: transform 0.2s ease, box-shadow 0.2s ease;\n    }\n    .problem-card:hover {\n      transform: translateY(-2px);\n      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.12);\n    }\n\n    /* 하단 페이지네이션 바 스타일 */\n    .pagination-container {\n      width: 1186px;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      gap: 20px;\n      margin-top: 40px;\n      user-select: none;\n    }\n    .page-btn {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      width: 44px;\n      height: 44px;\n      border-radius: 50%;\n      background: rgba(255, 255, 255, 0.2);\n      color: white;\n      font-size: 22px;\n      font-weight: 600;\n      cursor: pointer;\n      transition: all 0.2s ease;\n      backdrop-filter: blur(4px);\n    }\n    .page-btn:hover {\n      background: rgba(255, 255, 255, 0.4);\n      transform: scale(1.1);\n    }\n    .page-number {\n      font-size: 26px;\n      font-weight: 700;\n      color: white;\n      padding: 0 10px;\n      letter-spacing: 1px;\n    }\n\n\n    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */\n    @media (max-width: 800px) {\n      .fixed-gnb-inner { width: 100%; padding: 0 20px; }\n      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }\n      .fixed-gnb .nav-item { display: none; white-space: nowrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n\n  \u003c!-- 상단 고정 헤더 GNB 바 -->\n  \u003cdiv class=\"fixed-gnb\">\n    \u003cdiv class=\"fixed-gnb-inner\">\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 50px; display: flex\">\n        \u003cdiv onclick=\"goHome()\" title=\"홈으로 이동\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; cursor: pointer;\">\n          EUREKA\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">커뮤니티\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">요금제\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 48px; display: flex\">\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">로그인\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">마이페이지\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 메인 탐색 결과 섹션 -->\n  \u003cdiv class=\"section-full\">\n    \u003cdiv class=\"inner-content\" id=\"main-container\">\n\n      \u003c!-- 서브 타이틀: 문제 찾기 -->\n      \u003cdiv style=\"left: 652px; top: 140px; position: absolute; text-align: center; color: black; font-size: 36px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; line-height: 50px;\">\n        문제 찾기\n      \u003c/div>\n\n      \u003c!-- 서브 설명 -->\n      \u003cdiv style=\"left: 412px; top: 201px; position: absolute; text-align: center; color: #4E4E4E; font-size: 20px; font-family: 'Inter', sans-serif; font-weight: 400;\">\n        실제 사용자들이 겪는 불편을 탐색하고 발전시키고 싶은 문제를 찾아보세요\n      \u003c/div>\n\n      \u003c!-- 타겟 조건 요약 -->\n      \u003cdiv style=\"width: 1186px; height: 147px; left: 127px; top: 245px; position: absolute; background: #F4F4F4; border-radius: 15px; padding: 20px 24px; box-sizing: border-box;\">\n        \u003cdiv style=\"color: black; font-size: 20px; font-family: 'Inter', sans-serif; font-weight: 500; margin-bottom: 14px;\">\n          \u003cspan id=\"discovered-pain-counter\" style=\"margin-right:28px;\">발견한 불편 \u003cstrong id=\"discovered-pain-count\" style=\"font-size:28px;color:#6B42FF;\">–\u003c/strong>\u003c/span>타겟 확인 문제정의 \u003cspan id=\"total-count-text\" style=\"font-size:28px;font-weight:6
