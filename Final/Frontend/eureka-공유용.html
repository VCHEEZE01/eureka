00;color:#6B42FF;\">0개\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; gap: 15px; align-items: center; margin-bottom: 8px;\">\n          \u003cspan style=\"font-size: 16px; font-weight: 600; color: black;\">나이대 · 성별\u003c/span>\n          \u003cspan id=\"summary-keywords\" style=\"font-size: 16px; font-weight: 600; color: #7C3AED;\">미입력\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; gap: 15px; align-items: center;\">\n          \u003cspan style=\"font-size: 16px; font-weight: 600; color: black;\">직업 · 장소\u003c/span>\n          \u003cspan id=\"summary-sources\" style=\"font-size: 16px; font-weight: 600; color: #7C3AED;\">미입력\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"edit-btn\" onclick=\"goConfig()\" style=\"position: absolute; right: 24px; bottom: 16px;\">\n          수정하기\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"collection-result-note\" style=\"position:absolute;left:127px;top:400px;width:1186px;color:#555;font-size:13px;line-height:1.5;\">\n        \u003cdiv id=\"collection-result-progress\" role=\"status\" style=\"font-size:15px;margin-bottom:12px;\">\u003c/div>\n        \u003cdiv id=\"collection-result-coverage\" style=\"font-weight:600;color:#6B42FF;margin-bottom:5px;\">\u003c/div>\n        \u003cdiv id=\"collection-result-counts\">\u003c/div>\n        \n        \u003cdiv id=\"collection-result-stop\" style=\"margin-top:6px;color:#785223;\">\u003c/div>\n        \u003cdiv id=\"collection-plan-notice\" style=\"margin-top:8px;color:#785223;\">\u003c/div>\n        \u003cbutton id=\"new-range-search\" hidden style=\"margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;font:inherit;cursor:pointer;\">넓어진 범위로 다시 탐색\u003c/button>\n        \u003cbutton id=\"retry-status\" hidden style=\"margin-top:10px;padding:10px 18px;border:1px solid #DDD2F5;border-radius:10px;background:white;font:inherit;cursor:pointer;\">실행 상태 다시 확인\u003c/button>\n        \u003cbutton id=\"continue-search\" hidden style=\"margin-top:10px;padding:10px 18px;border:0;border-radius:10px;background:#6B42FF;color:white;font:inherit;cursor:pointer;\">추가 탐색\u003c/button>\n        \u003cdiv id=\"collection-result-caption\" style=\"margin-top:4px;\">\u003c/div>\n        \u003cdetails id=\"collection-result-details\" hidden style=\"margin-top:8px;\">\n          \u003csummary style=\"cursor:pointer;color:#6B42FF;\">실제 검색어·반환 건수·제외 사유\u003c/summary>\n          \u003cdiv id=\"collection-result-technical\" style=\"margin-top:8px;\">\u003c/div>\n          \u003cdiv id=\"collection-result-cumulative\" style=\"margin-top:4px;\">\u003c/div>\n          \u003cdiv id=\"collection-query-results\" style=\"margin-top:8px;white-space:pre-wrap;line-height:1.8;max-height:320px;overflow:auto;word-break:break-word;\">\u003c/div>\n          \u003cdiv id=\"collection-exclusion-reasons\" style=\"margin-top:8px;white-space:pre-line;line-height:1.8;\">\u003c/div>\n          \u003cdiv id=\"collection-result-warnings\" style=\"margin-top:8px;white-space:pre-line;line-height:1.8;\">\u003c/div>\n        \u003c/details>\n        \u003csection id=\"collection-target-review\" hidden aria-labelledby=\"collection-target-review-title\" style=\"margin-top:24px;padding:22px;background:#FAF9FD;border:1px solid #E5DFF7;border-radius:15px;\">\n          \u003ch2 id=\"collection-target-review-title\" style=\"font-size:19px;font-weight:600;margin:0;color:#4B357A;\">발견한 불편 · 타겟 확인 필요\u003c/h2>\n          \u003cp style=\"margin:8px 0;color:#666;\">실제 글에서 발견한 불편입니다. 입력한 타겟의 경험인지 아직 확인되지 않았거나 조건이 다르므로, 타겟이 확인된 문제정의와 구분해 살펴보세요. 불편 요약이 있는 자료를 20건씩 표시하며, 전체 자료를 넘겨 볼 수 있습니다.\u003c/p>\n          \u003cdiv id=\"collection-target-review-list\" style=\"max-height:640px;overflow:auto;margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;\">\u003c/div>\n          \u003cdiv style=\"display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;\">\u003cbutton id=\"review-prev\" type=\"button\" style=\"padding:8px 14px;border:1px solid #DDD2F5;border-radius:8px;background:white;cursor:pointer;\">이전 불편\u003c/button>\u003cspan id=\"review-page\" aria-live=\"polite\">\u003c/span>\u003cbutton id=\"review-next\" type=\"button\" style=\"padding:8px 14px;border:1px solid #DDD2F5;border-radius:8px;background:white;cursor:pointer;\">다음 불편\u003c/button>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003c!-- 동적 카테고리 탭 영역 (선택된 카테고리만 동적 생성) -->\n      \u003cdiv class=\"tab-container\" id=\"category-tab-container\">\n        \u003c!-- JS 동적 생성 -->\n      \u003c/div>\n\n      \u003c!-- 메인 보라색 배경 컨테이너 -->\n      \u003cdiv id=\"purple-bg\" style=\"width: 1186px; left: 127px; top: 470px; position: absolute; background: #6B42FF; border-top-left-radius: 0px; border-top-right-radius: 0px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; padding-bottom: 40px; box-sizing: border-box;\">\n        \n        \u003c!-- 테이블 헤더 텍스트 (하단 숫자 수치열과 1:1 완벽 수직 가운데 정렬) -->\n        \u003cdiv style=\"width: 100%; height: 58px; position: relative;\">\n          \u003c!-- 관련 사례 수 정렬 버튼 (left: 660px, width: 140px) -->\n          \u003cdiv id=\"header-sort-cases\" class=\"sort-header-btn\" onclick=\"handleSort('cases')\" \n            title=\"클릭 시 관련 사례 수 높은순 / 낮은순 정렬\"\n            style=\"left: 660px; top: 12px; width: 140px; position: absolute; justify-content: center; font-size: 15px; font-family: 'IBM Plex Sans KR'; font-weight: 600; letter-spacing: 0.5px;\">\n            \u003cspan>관련 사례 수\u003c/span>\n            \u003cspan id=\"icon-cases\" style=\"font-size: 13px; margin-left: 2px;\">\u003c/span>\n          \u003c/div>\n\n          \u003c!-- 출처 수 정렬 버튼 (left: 814px, width: 140px) -->\n          \u003cdiv id=\"header-sort-sources\" class=\"sort-header-btn\" onclick=\"handleSort('sources')\" \n            title=\"클릭 시 출처 수 높은순 / 낮은순 정렬\"\n            style=\"left: 814px; top: 12px; width: 140px; position: absolute; justify-content: center; font-size: 15px; font-family: 'IBM Plex Sans KR'; font-weight: 600; letter-spacing: 0.5px;\">\n            \u003cspan>출처 수\u003c/span>\n            \u003cspan id=\"icon-sources\" style=\"font-size: 13px; margin-left: 2px;\">\u003c/span>\n          \u003c/div>\n\n        \u003c/div>\n\n        \u003c!-- 문제 리스트 컨테이너 -->\n        \u003cdiv id=\"problem-list-wrapper\" style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 4px;\">\n          \u003c!-- JS 동적 생성 -->\n        \u003c/div>\n\n        \u003c!-- 하단 페이지네이션 영역 -->\n        \u003cdiv class=\"pagination-container\" id=\"pagination-wrapper\">\n          \u003c!-- JS 동적 생성 -->\n        \u003c/div>\n\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    // 페이지 이동 함수\n    function goHome() {\n      parent.__navigate('index.html');\n    }\n    function goConfig() {\n      parent.__navigate('config.html');\n    }\n    function goDetail(id) {\n      parent.__navigate(`detail.html?id=${encodeURIComponent(id)}`);\n    }\n    // 실제 API/명시적 검토 파일의 데이터만 사용한다. 기본 예시 데이터가 없다.\n    const isLive = true;\n    let rawData = [];\n    function refreshProblems() { rawData = (parent.__problems || []).map(p => ({\n      id: p.id, title: p.title, desc: p.one_liner, tag: p.category + ((parent.__dataMode === 'live' || parent.__dataMode === 'review') && (parent.__reviews?.[p.id]?.decision !== 'publish' || !p.gate.passed) ? ' · 게시 보류' : ''),\n      category: p.category, cases: p.case_count, sources: p.source_count, date: p.updated_at,\n    })); }\n    refreshProblems();\n    function escapeHtml(value) {\n      return String(value).replaceAll('&', '&amp;').replaceAll('\u003c', '&lt;').replaceAll('>', '&gt;').replaceAll('\"', '&quot;').replaceAll(\"'\", '&#039;');\n    }\n\n    // 전체 카테고리 원본 맵\n    const allCategoriesList = ['전 체', '금 융', '헬스 케어', 'IT / 생산성', '교육 / 커리어', '라이프 스타일'];\n\n    // 1. 온보딩에서 입력한 타겟 프로필 로드\n    let userTarget = { age: null, gender: null, jobs: [], places: [] };\n\n    try {\n      const savedTarget = localStorage.getItem('eureka_target_profile');\n      if (savedTarget) userTarget = { ...userTarget, ...JSON.parse(savedTarget) };\n    } catch (e) {\n      console.error(e);\n    }\n\n    // 문자열 공백 및 규격 정규화 함수\n    function normalizeTag(tag) {\n      return tag ? tag.replace(/\\s+/g, '') : '';\n    }\n\n    if (parent.__dataMode === 'live' && parent.__collectionTarget) userTarget = parent.__collectionTarget;\n    // 2. 상단 요약 카드 텍스트 업데이트\n    const demographics = [userTarget.age, userTarget.gender].filter(Boolean);\n    const jobs = Array.isArray(userTarget.jobs) ? userTarget.jobs : [];\n    const places = Array.isArray(userTarget.places) ? userTarget.places : [];\n    function summarize(values, label) {\n      if (!values.length) return '';\n      const visible = values.slice(0, 2).join(', ');\n      return `${label} ${visible}${values.length > 2 ? ` 외 ${values.length - 2}개` : ''}`;\n    }\n    document.getElementById('summary-keywords').textContent = demographics.length ? demographics.join(' · ') : '미입력';\n    document.getElementById('summary-sources').textContent = [summarize(jobs, '직업'), summarize(places, '장소')].filter(Boolean).join(' · ') || '미입력';\n\n    // 3. 타겟은 카테고리 필터가 아니다. 전체 카테고리 탭을 그대로 제공한다.\n    const visibleTabs = [...allCategoriesList];\n\n    // 상태 변수\n    let currentCategoryTab = '전 체';\n    let currentPage = 1;\n    const itemsPerPage = 10;\n\n    // 카테고리 탭 동적 생성\n    function renderCategoryTabs() {\n      const tabContainer = document.getElementById('category-tab-container');\n      tabContainer.innerHTML = visibleTabs.map(cat => `\n        \u003cdiv class=\"tab-btn ${cat === currentCategoryTab ? 'active' : ''}\" data-tab=\"${cat}\" onclick=\"changeCategoryTab('${cat}')\">\n          ${cat}\n        \u003c/div>\n      `).join('');\n    }\n\n    // 카테고리 탭 변경\n    function changeCategoryTab(category) {\n      currentCategoryTab = category;\n      currentPage = 1;\n\n      // 탭 이동 시 정렬 상태(관련 사례 수, 출처 수 정렬) 초기화\n      sortField = null;\n      sortOrder = 'desc';\n\n      renderCategoryTabs();\n      render();\n    }\n\n    // 1차 검색 조건 기준 전체 데이터\n    function getBaseSearchData() {\n      return rawData;\n    }\n\n    // 정렬 상태 변수\n    let sortField = null; // 'cases' | 'sources' | null\n    let sortOrder = 'desc'; // 'desc' (높은순) | 'asc' (낮은순)\n\n    // 정렬 토글 클릭 핸들러\n    function handleSort(field) {\n      if (sortField === field) {\n        if (sortOrder === 'desc') {\n          sortOrder = 'asc';\n        } else {\n          sortField = null; // 3회 클릭 시 정렬 해제\n          sortOrder = 'desc';\n        }\n      } else {\n        sortField = field;\n        sortOrder = 'desc'; // 첫 클릭 시 높은순 정렬\n      }\n\n      currentPage = 1; // 정렬 시 1페이지로 리셋\n      render();\n    }\n\n    // 데이터 필터링 및 정렬\n    function getFilteredData() {\n      const baseData = getBaseSearchData();\n      let filtered = [];\n\n      // 2차 필터링: 현재 활성화된 탭\n      if (normalizeTag(currentCategoryTab) === '전체') {\n        filtered = [...baseData];\n      } else {\n        filtered = baseData.filter(item => normalizeTag(item.category || item.tag) === normalizeTag(currentCategoryTab));\n      }\n\n      // 3차 정렬: 관련 사례 수 / 출처 수 (높은순/낮은순)\n      if (sortField) {\n        filtered.sort((a, b) => {\n          const valA = a[sortField] || 0;\n          const valB = b[sortField] || 0;\n          if (sortOrder === 'desc') {\n            return valB - valA;\n          } else {\n            return valA - valB;\n          }\n        });\n      }\n\n      return filtered;\n    }\n\n    // 정렬 헤더 UI 상태 갱신\n    function updateSortHeaderUI() {\n      const casesBtn = document.getElementById('header-sort-cases');\n      const sourcesBtn = document.getElementById('header-sort-sources');\n      const casesIcon = document.getElementById('icon-cases');\n      const sourcesIcon = document.getElementById('icon-sources');\n\n      // 초기화\n      casesBtn.classList.remove('active');\n      sourcesBtn.classList.remove('active');\n      casesIcon.textContent = '';\n      sourcesIcon.textContent = '';\n\n      if (sortField === 'cases') {\n        casesBtn.classList.add('active');\n        casesIcon.textContent = sortOrder === 'desc' ? '▼' : '▲';\n      } else if (sortField === 'sources') {\n        sourcesBtn.classList.add('active');\n        sourcesIcon.textContent = sortOrder === 'desc' ? '▼' : '▲';\n      }\n    }\n\n    // 화면 전체 렌더링\n    function render() {\n      updateSortHeaderUI();\n      const baseSearchData = getBaseSearchData();\n      const filteredData = getFilteredData();\n      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;\n\n      if (currentPage > totalPages) currentPage = totalPages;\n      if (currentPage \u003c 1) currentPage = 1;\n\n      // 요구사항 1: '선택하신 조건에 맞는 N개의 문제정의' 수치는 전체(검색조건 기준) 카운트 수로 고정!\n      document.getElementById('total-count-text').textContent = `${baseSearchData.length}개`;\n\n      // 해당 페이지 10개 추출 및 목록 렌더링\n      const startIndex = (currentPage - 1) * itemsPerPage;\n      const pageData = filteredData.slice(startIndex, startIndex + itemsPerPage);\n\n      const wrapper = document.getElementById('problem-list-wrapper');\n      if (pageData.length === 0) {\n        const run = parent.__collectionRun;\n        const noTargetEvidence = parent.__dataMode === 'live' && (run?.cumulative_counts?.target_confirmed ?? run?.counts?.target_confirmed ?? run?.counts?.target_matched) === 0;\n        const running = ['queued','running'].includes(run?.status);\n        const remaining = running ? ' 탐색이 계속 진행 중이며 이 화면에 결과가 자동으로 추가됩니다.' : run?.has_more === true ? ' 아직 처리하지 않은 검색·판별·문제정의 자료가 있습니다. 필요하면 추가 탐색을 할 수 있습니다.' : ' 현재 검색 범위의 결과이며 타겟 조건을 수정해 다시 탐색할 수 있습니다.';\n        const emptyMessage = baseSearchData.length > 0 ? '이 카테고리에는 이번 탐색의 문제정의가 없습니다. 전체 탭을 확인해 주세요.'\n          : running ? '수집한 자료를 분석하고 있습니다. 아래에 문제정의가 완성되기 전에도 위에서 발견한 불편을 확인할 수 있습니다.'\n          : noTargetEvidence ? '선택한 타겟과 연관된 근거를 확보하지 못해 문제정의를 만들지 않았습니다. 입력 조건과 실제 글의 맥락을 함께 검토했으나 타겟 연관성이 확인되지 않았습니다.'\n          : '이번 조건에서 표시할 문제정의가 없습니다. 타겟과 연관된 충분한 불편 근거를 확보하지 못했거나 판별 표본이 부족할 수 있습니다.';\n        wrapper.innerHTML = `\u003cdiv style=\"color: white; font-size: 18px; padding: 50px 32px; line-height:1.8; text-align:center; max-width:1080px;\">${escapeHtml(emptyMessage + (baseSearchData.length === 0 && parent.__dataMode === 'live' ? remaining : ''))}\u003c/div>`;\n      } else {\n        wrapper.innerHTML = pageData.map(item => `\n            \u003cdiv class=\"problem-card\" data-problem-id=\"${escapeHtml(item.id)}\" role=\"link\" tabindex=\"0\">\n              \u003c!-- 요구사항 2: 제목과 카테고리 태그가 끝 지점에 바로 옆에 붙어있도록 인라인 플렉스 행으로 배치 -->\n              \u003cdiv style=\"left: 32px; top: 22px; position: absolute; display: flex; align-items: center; gap: 12px; max-width: 610px;\">\n                \u003cdiv style=\"color: black; font-size: 20px; font-family: 'IBM Plex Sans KR'; font-weight: 600; line-height: 22.75px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">\n                  ${escapeHtml(item.title)}\n                \u003c/div>\n                \u003c!-- 태그 칩 (제목 오른쪽 바로 옆에 밀착 배치) -->\n                \u003cdiv style=\"padding: 4px 14px; background: #F2EEFF; border-radius: 50px; display: inline-flex; justify-content: center; align-items: center; flex-shrink: 0;\">\n                  \u003cdiv style=\"text-align: center; color: #3F3F3F; font-size: 12px; font-family: 'IBM Plex Sans KR'; font-weight: 500;\">\n                    ${escapeHtml(item.tag)}\n                  \u003c/div>\n                \u003c/div>\n              \u003c/div>\n\n              \u003c!-- 한 줄 설명 -->\n              \u003cdiv style=\"left: 32px; top: 66px; position: absolute; color: #555; font-size: 15px; font-family: 'IBM Plex Sans KR'; font-weight: 400; line-height: 22.75px;\">\n                ${escapeHtml(item.desc)}\n              \u003c/div>\n\n              \u003c!-- 관련 사례 수 / 출처 수 -->\n              \u003cdiv style=\"left: 660px; top: 40px; position: absolute; justify-content: flex-start; align-items: center; gap: 14px; display: inline-flex;\">\n                \u003cdiv style=\"display: flex; align-items: center; gap: 12px; width: 140px; justify-content: center;\">\n                  \u003cspan style=\"text-align: center; color: black; font-size: 38px; font-family: 'IBM Plex Sans KR'; font-weight: 600;\">${item.cases}\u003c/span>\n                  \u003cspan style=\"color: black; font-size: 18px; font-family: 'IBM Plex Sans KR'; font-weight: 500;\">건\u003c/span>\n                \u003c/div>\n                \u003cdiv style=\"display: flex; align-items: center; gap: 12px; width: 140px; justify-content: center;\">\n                  \u003cspan style=\"text-align: center; color: black; font-size: 38px; font-family: 'IBM Plex Sans KR'; font-weight: 600;\">${item.sources}\u003c/span>\n                  \u003cspan style=\"color: black; font-size: 18px; font-family: 'IBM Plex Sans KR'; font-weight: 500;\">곳\u003c/span>\n                \u003c/div>\n              \u003c/div>\n\n            \u003c/div>\n          `).join('');\n      }\n\n      wrapper.querySelectorAll('[data-problem-id]').forEach(card => {\n        card.addEventListener('click', () => goDetail(card.dataset.problemId));\n        card.addEventListener('keydown', event => { if (event.key === 'Enter') goDetail(card.dataset.problemId); });\n      });\n      // 4. 하단 페이지네이션 렌더링\n      const pagWrapper = document.getElementById('pagination-wrapper');\n      let html = '';\n\n      if (currentPage > 1) {\n        html += `\u003cdiv class=\"page-btn\" onclick=\"goToPage(${currentPage - 1})\" title=\"이전 페이지\">&lt;\u003c/div>`;\n      }\n      html += `\u003cdiv class=\"page-number\">${currentPage}\u003c/div>`;\n      if (currentPage \u003c totalPages) {\n        html += `\u003cdiv class=\"page-btn\" onclick=\"goToPage(${currentPage + 1})\" title=\"다음 페이지\">&gt;\u003c/div>`;\n      }\n\n      pagWrapper.innerHTML = filteredData.length > 0 ? html : '';\n\n      // 보라색 배경 박스 및 메인 래퍼 높이 동적 계산\n      const purpleBg = document.getElementById('purple-bg');\n      const mainContainer = document.getElementById('main-container');\n      const calculatedBgHeight = pageData.length ? 60 + (pageData.length * 134) + 90 : 290;\n      const noteHeight = parent.__dataMode === 'live' ? (document.getElementById('collection-result-note').offsetHeight || 80) : 0;\n      const backgroundTop = parent.__dataMode === 'live' ? 400 + noteHeight + 24 + 52 : 470;\n      document.getElementById('category-tab-container').style.top = `${backgroundTop - 52}px`;\n      purpleBg.style.top = `${backgroundTop}px`;\n      purpleBg.style.height = `${calculatedBgHeight}px`;\n      mainContainer.style.minHeight = `${backgroundTop + calculatedBgHeight + 80}px`;\n    }\n\n    function goToPage(page) {\n      currentPage = page;\n      render();\n      window.scrollTo({ top: 380, behavior: 'smooth' });\n    }\n\n    if (parent.__dataMode === 'live') {\n      let reviewPage = 1;\n      function drawCollection(run) {\n      if (run?.target_match_policy !== 'evidence_v2') run = {status:run?.status, message:run?.message, error:run?.error};\n      refreshProblems();\n      const summary = parent.__describeCollection(run);\n      const measuredPain = run?.cumulative_counts?.pain_detected ?? run?.counts?.pain_detected;\n      document.getElementById('discovered-pain-count').textContent = Number.isInteger(measuredPain) && measuredPain >= 0 ? `${measuredPain}건` : '–';\n      document.getElementById('collection-plan-notice').textContent = summary.planNotice;\n      document.getElementById('new-range-search').hidden = !parent.__collections.canStartFresh(run);\n      document.getElementById('retry-status').hidden = run?.status !== 'connection_error';\n      document.getElementById('collection-result-progress').textContent = summary.progress;\n      document.getElementById('collection-result-coverage').textContent = summary.coverage;\n      document.getElementById('collection-result-counts').textContent = summary.cumulative || summary.counts;\n      document.getElementById('collection-result-cumulative').textContent = summary.counts ? '이번 처리 · ' + summary.counts : '';\n      document.getElementById('collection-result-technical').textContent = summary.technical;\n      document.getElementById('collection-result-stop').textContent = summary.stop;\n      document.getElementById('collection-result-caption').textContent = '분석은 검토한 글 수, 발견 불편은 그중 불편이 확인된 글 수입니다. 타겟 확인·미확인은 분석한 전체 자료 기준이며, 타겟 확인 불편은 두 조건을 모두 충족한 자료입니다. 원문의 맥락과 입력 조건을 대조하며 키워드가 그대로 등장해야 하는 조건이나 작성자 신원·모든 속성의 인증은 아닙니다.';\n      const details = document.getElementById('collection-result-details');\n      details.hidden = ![summary.technical,summary.counts,summary.queries,summary.exclusions,summary.warnings].some(Boolean);\n      document.getElementById('collection-query-results').textContent = summary.queries;\n      document.getElementById('collection-exclusion-reasons').textContent = summary.exclusions ? '제외 사유\\n' + summary.exclusions : '';\n      document.getElementById('collection-result-warnings').textContent = summary.warnings;\n      const reviewCandidates = Array.isArray(run?.review_candidates) ? run.review_candidates : [];\n      const reviewDetails = document.getElementById('collection-target-review');\n      reviewDetails.hidden = reviewCandidates.length === 0;\n      document.getElementById('collection-target-review-title').textContent = `발견한 불편 ${reviewCandidates.length}건 · 타겟 확인 필요`;\n      const statusLabels = {confirmed:'타겟 확인',unconfirmed:'연관 미확인',conflict:'타겟 충돌'};\n      const reviewPages = Math.max(1, Math.ceil(reviewCandidates.length / 20));\n      reviewPage = Math.min(reviewPage, reviewPages);\n      document.getElementById('review-page').textContent = reviewCandidates.length ? `${reviewPage} / ${reviewPages}페이지 · 전체 ${reviewCandidates.length}건` : '';\n      document.getElementById('review-prev').disabled = reviewPage === 1;\n      document.getElementById('review-next').disabled = reviewPage === reviewPages;\n      document.getElementById('collection-target-review-list').innerHTML = reviewCandidates.slice((reviewPage - 1) * 20, reviewPage * 20).map(item => {\n        let sourceLink = '';\n        try { const url = new URL(item.source_url); if (['http:','https:'].includes(url.protocol)) sourceLink = `\u003ca href=\"${escapeHtml(url.href)}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#6B42FF;\">${escapeHtml(item.source_name || '출처')} 원문 확인\u003c/a>`; } catch {}\n        return `\u003cdiv style=\"padding:18px;background:white;border:1px solid #E8E3F1;border-radius:10px;line-height:1.8;word-break:break-word;\">\u003cstrong>${escapeHtml(statusLabels[item.target_status] || '판정 확인 필요')}\u003c/strong>\u003cdiv>${escapeHtml(item.pain_summary || '불편 요약 미기록')}\u003c/div>\u003cdiv style=\"color:#666;\">${escapeHtml(item.reason || '사유 미기록')}\u003c/div>${sourceLink}\u003c/div>`;\n      }).join('');\n      const continueButton = document.getElementById('continue-search');\n      continueButton.hidden = !parent.__collections?.canContinue(run);\n      render();\n      }\n      document.getElementById('new-range-search').addEventListener('click', () => {\n        const run = parent.__collectionRun;\n        if (!parent.__collections.canStartFresh(run)) return;\n        parent.__collections.start(run.target);\n        parent.__navigate('loading.html');\n      });\n      document.getElementById('retry-status').addEventListener('click', () => parent.__collections.retry());\n      document.getElementById('review-prev').addEventListener('click', () => { if (reviewPage > 1) { reviewPage--; drawCollection(parent.__collectionRun); document.getElementById('collection-target-review-list').scrollTop = 0; } });\n      document.getElementById('review-next').addEventListener('click', () => { if (reviewPage * 20 \u003c (parent.__collectionRun?.review_candidates?.length || 0)) { reviewPage++; drawCollection(parent.__collectionRun); document.getElementById('collection-target-review-list').scrollTop = 0; } });\n      document.getElementById('collection-result-details').addEventListener('toggle', render);\n      const unsubscribe = parent.__collections.subscribe(drawCollection);\n      window.addEventListener('unload', unsubscribe);\n      parent.__collections.resume();\n      const continueButton = document.getElementById('continue-search');\n      continueButton.addEventListener('click', () => {\n        if (!parent.__collections.canContinue()) return;\n        continueButton.disabled = true;\n        parent.__collections.continueSearch();\n        parent.__navigate('loading.html');\n      });\n    }\n    if (parent.__dataMode !== 'live') document.getElementById('discovered-pain-counter').hidden = true;\n    // 초기 실행\n    renderCategoryTabs();\n    render();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","detail.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>EUREKA - 문제 세부 내용\u003c/title>\n  \u003c!-- Google Fonts: IBM Plex Sans KR, Noto Sans KR, Inter & Iceland -->\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  \u003clink\n    href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Iceland&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap\"\n    rel=\"stylesheet\">\n  \u003cstyle>\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html,\n    body {\n      width: 100%;\n      min-height: 100vh;\n      font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif;\n      background: #EBF4FC;\n      color: #333;\n      overflow-x: hidden;\n    }\n\n    /* 상단 고정 헤더 GNB 바 (기존 페이지와 100% 동일) */\n    .fixed-gnb {\n      width: 100%;\n      height: 75px;\n      position: fixed;\n      top: 0;\n      left: 0;\n      display: flex;\n      justify-content: center;\n      background: rgba(246, 245, 253, 0.60);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter: blur(16px);\n      z-index: 1000001;\n      border: none !important;\n      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);\n    }\n\n    .fixed-gnb-inner {\n      width: 1312px;\n      max-width: 100%;\n      height: 100%;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 0 24px;\n    }\n\n    @media (max-width: 1440px) {\n      .fixed-gnb-inner {\n        width: 100%;\n        padding: 0 64px;\n      }\n    }\n\n    .nav-item {\n      cursor: pointer;\n      transition: opacity 0.2s ease;\n    }\n\n    .nav-item:hover {\n      opacity: 0.7;\n    }\n\n    /* 전체 레이아웃 구도: 상단 75px GNB + 좌측 고정 사이드바(373px) + 우측 메인 영역 */\n    .app-layout {\n      display: flex;\n      width: 100%;\n      min-height: 100vh;\n      padding-top: 75px;\n    }\n\n    /* =========================================================\n       1. 좌측 고정 네비게이션 서브 패널 (Sticky / Fixed Left Bar - 440px)\n       ========================================================= */\n    .sidebar-fixed {\n      width: 440px;\n      height: calc(100vh - 75px);\n      position: fixed;\n      left: 0;\n      top: 75px;\n      background: #FFFFFF;\n      box-shadow: 0px 10px 20px rgba(94.4, 94.4, 94.4, 0.11);\n      z-index: 1000;\n      display: flex;\n      flex-direction: column;\n      padding: 32px 32px 28px 32px;\n      overflow: hidden; /* 이동 스크롤바 완전 제거 */\n    }\n    .sidebar-fixed::-webkit-scrollbar {\n      display: none;\n    }\n\n    /* 뒤로가기 버튼 스타일 */\n    .back-btn {\n      font-size: 16px;\n      font-weight: 500;\n      color: #333333;\n      cursor: pointer;\n      margin-bottom: 24px;\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      transition: all 0.2s ease;\n      user-select: none;\n      width: fit-content;\n    }\n\n    .back-btn:hover {\n      opacity: 0.7;\n      color: #0051FF;\n    }\n\n    /* 파란색 문제 카드 띠 (통일 규격 - 440px 크기 확장) */\n    .purple-header-card {\n      width: calc(100% + 32px);\n      height: 193px;\n      margin-left: -32px;\n      /* 좌측 붙이기 */\n      background: #0051FF;\n      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.25);\n      border-top-right-radius: 20px;\n      border-bottom-right-radius: 20px;\n      padding: 25px 45px;\n      color: #FFFFFF;\n      display: flex;\n      align-items: center;\n      margin-bottom: 24px;\n    }\n\n    .purple-header-title {\n      font-size: 30px;\n      font-weight: 600;\n      line-height: 38px;\n      letter-spacing: 1px;\n      word-break: keep-all;\n    }\n\n    /* 태그 칩 */\n    .category-chip {\n      display: inline-flex;\n      padding: 4px 14px;\n      background: #F2EEFF;\n      border-radius: 50px;\n      color: #3F3F3F;\n      font-size: 12px;\n      font-weight: 500;\n      margin-bottom: 16px;\n      width: fit-content;\n    }\n\n    /* 서브 한 줄 설명 */\n    .sub-quote-desc {\n      font-size: 20px;\n      line-height: 30px;\n      color: #000000;\n      font-weight: 400;\n      letter-spacing: 0.5px;\n      margin-bottom: 24px;\n      word-break: keep-all;\n    }\n\n    /* 사례 수 & 출처 수 지표 박스 */\n    .metric-row {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 14px;\n    }\n\n    .metric-label {\n      font-size: 16px;\n      font-weight: 500;\n      color: #000000;\n      font-family: 'Noto Sans KR', sans-serif;\n    }\n\n    .metric-value-box {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n    }\n\n    .metric-num {\n      font-size: 38px;\n      font-weight: 600;\n      color: #000000;\n      letter-spacing: 1px;\n    }\n\n    .metric-unit {\n      font-size: 18px;\n      font-weight: 500;\n      color: #000000;\n    }\n\n    /* 하단 액션 버튼 그룹 (저장, 아이디어 보기, 개인화 하기) */\n    .sidebar-actions {\n      margin-top: auto;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n    }\n\n    .action-row-top {\n      display: flex;\n      gap: 12px;\n    }\n\n    .btn-capsule-light {\n      flex: 1;\n      height: 46px;\n      background: #FFFFFF;\n      border: 1px solid #E5E7EB;\n      border-radius: 30px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 14px;\n      font-weight: 600;\n      color: #4B5563;\n      cursor: pointer;\n      transition: all 0.2s ease;\n      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);\n    }\n\n    .btn-capsule-light:hover {\n      background: #F9FAFB;\n      border-color: #0051FF;\n      color: #0051FF;\n    }\n\n    .star-icon {\n      margin-left: 3px;\n      font-size: 15px;\n      color: #9CA3AF;\n      transition: color 0.2s ease, transform 0.2s ease;\n    }\n\n    .btn-capsule-light.saved .star-icon {\n      color: #FFC107; /* 별만 노란색 불 들어옴 */\n      transform: scale(1.2);\n    }\n\n    .btn-purple-main {\n      width: 100%;\n      height: 52px;\n      background: #0051FF;\n      border-radius: 12px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 17px;\n      font-weight: 600;\n      color: #FFFFFF;\n      cursor: pointer;\n      transition: all 0.2s ease;\n      box-shadow: 0 4px 14px rgba(0, 81, 255, 0.3);\n    }\n\n    .btn-purple-main:hover {\n      background: #0040CC;\n      transform: translateY(-1px);\n    }\n\n    /* 잠긴 기능: 현재 공유용 프로토타입에서 이동·생성 기능은 제공하지 않는다. */\n    .action-locked,\n    .action-locked:hover {\n      cursor: not-allowed;\n      transform: none;\n      box-shadow: none;\n    }\n\n    .btn-capsule-light.action-locked,\n    .btn-capsule-light.action-locked:hover {\n      border-color: #E5E7EB;\n      background: #F3F4F6;\n      color: #9CA3AF !important;\n    }\n\n    .btn-purple-main.action-locked,\n    .btn-purple-main.action-locked:hover {\n      background: #AEB6C6;\n      color: rgba(255, 255, 255, 0.92);\n    }\n\n    .lock-icon {\n      width: 14px;\n      height: 14px;\n      margin-right: 6px;\n      opacity: 0.9;\n      flex-shrink: 0;\n    }\n\n    /* =========================================================\n       2. 우측 메인 상세 내용 영역 (Scrollable Main Content Area)\n       ========================================================= */\n    .main-content {\n      margin-left: 440px;\n      flex: 1;\n      padding: 50px 60px 100px 80px;\n      position: relative;\n    }\n\n    /* 섹션 타이틀 */\n    .section-main-title {\n      font-size: 32px;\n      font-weight: 500;\n      color: #000000;\n      margin-bottom: 24px;\n    }\n\n    .sub-blue-header {\n      font-size: 20px;\n      font-weight: 500;\n      color: #0051FF;\n      margin-bottom: 18px;\n      font-family: 'Noto Sans KR', sans-serif;\n    }\n\n    /* 3개 통계 수집 카드 그리드 (출처 분포) */\n    .stat-cards-grid {\n      display: flex;\n      gap: 20px;\n      margin-bottom: 40px;\n    }\n\n    .stat-card-box {\n      width: 256px;\n      height: 138px;\n      background: #FFFFFF;\n      border-radius: 10px;\n      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.04);\n      padding: 16px 20px;\n      display: flex;\n      flex-direction: column;\n      position: relative;\n    }\n\n    .stat-card-title {\n      font-size: 14px;\n      color: #000000;\n      font-weight: 500;\n      margin-bottom: 10px;\n    }\n\n    /* 차트 graphic 목업 */\n    .chart-svg-wrap {\n      width: 100%;\n      height: 75px;\n      display: flex;\n      align-items: flex-end;\n    }\n\n    .bar-stat-group {\n      display: flex;\n      flex-direction: column;\n      gap: 8px;\n      margin-top: 4px;\n    }\n\n    .bar-item {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      font-size: 11px;\n      color: #666;\n    }\n\n    .bar-track {\n      width: 130px;\n      height: 7px;\n      background: #E5E7EB;\n      border-radius: 10px;\n      overflow: hidden;\n    }\n\n    .bar-fill {\n      height: 100%;\n      background: #4F46E5;\n      border-radius: 10px;\n    }\n\n    .count-big-num {\n      font-size: 40px;\n      font-weight: 700;\n      color: #000000;\n      margin: auto;\n      text-align: center;\n    }\n\n    /* 유저 리뷰 목록 (808px) */\n    .review-cards-list {\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n      margin-bottom: 60px;\n      max-width: 808px;\n    }\n\n    .review-card-item {\n      width: 808px;\n      min-height: 72px;\n      background: #FFFFFF;\n      box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04);\n      border-radius: 15px;\n      padding: 16px 24px;\n      display: flex;\n      align-items: center;\n      gap: 20px;\n      justify-content: space-between;\n      transition: transform 0.2s ease;\n    }\n\n    .review-card-item:hover {\n      transform: translateY(-2px);\n    }\n\n    .review-sns-icon {\n      width: 39px;\n      height: 39px;\n      border-radius: 10px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      background: #F3F4F6;\n      flex-shrink: 0;\n    }\n\n    .review-text-content {\n      flex: 1;\n      font-size: 14px;\n      color: #000000;\n      line-height: 24px;\n      letter-spacing: 0.5px;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      display: -webkit-box;\n      -webkit-line-clamp: 2;\n      -webkit-box-orient: vertical;\n    }\n\n    .btn-view-source {\n      padding: 8px 18px;\n      border: 0;\n      background: #FFFFFF;\n      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.10);\n      border-radius: 15px;\n      color: #0051FF;\n      font-family: inherit;\n      font-size: 12px;\n      font-weight: 500;\n      cursor: pointer;\n      flex-shrink: 0;\n      transition: all 0.2s ease;\n      white-space: nowrap;\n    }\n\n    .btn-view-source:hover {\n      background: #0051FF;\n      color: #FFFFFF;\n    }\n\n    /* 유레카 생성 설명 박스 */\n    .ai-desc-container {\n      max-width: 808px;\n      background: #FFFFFF;\n      border-radius: 15px;\n      padding: 28px 36px;\n      box-shadow: 0px 0px 50px 10px rgba(125.05, 125.05, 125.05, 0.04);\n      line-height: 32px;\n      font-size: 15px;\n      color: #000000;\n      letter-spacing: 0.5px;\n    }\n\n    /* 근거 상세 확장 — 기존 Figma 톤을 유지하면서 백엔드 계약을 표시한다. */\n    .prototype-note {\n      max-width: 808px;\n      margin: -10px 0 26px;\n      padding: 11px 16px;\n      border: 1px solid rgba(0, 81, 255, 0.14);\n      border-radius: 10px;\n      background: rgba(255, 255, 255, 0.58);\n      color: #5F6571;\n      font-size: 12px;\n      line-height: 20px;\n    }\n\n    .evidence-block {\n      max-width: 808px;\n      margin-bottom: 38px;\n      padding: 24px;\n      border-radius: 15px;\n      background: #FFFFFF;\n      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);\n    }\n\n    .block-heading-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 16px;\n      margin-bottom: 18px;\n    }\n\n    .block-heading {\n      color: #111827;\n      font-family: 'Noto Sans KR', sans-serif;\n      font-size: 18px;\n      font-weight: 600;\n    }\n\n    .ai-badge {\n      display: inline-flex;\n      align-items: center;\n      min-height: 24px;\n      padding: 3px 10px;\n      border-radius: 20px;\n      background: #F2EEFF;\n      color: #6B42FF;\n      font-size: 11px;\n      font-weight: 600;\n      white-space: nowrap;\n    }\n\n    .gate-list {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 10px;\n    }\n\n    .gate-item {\n      min-height: 92px;\n      padding: 15px;\n      border: 1px solid #E8EBF2;\n      border-radius: 12px;\n      background: #FBFCFF;\n    }\n\n    .gate-label {\n      color: #697080;\n      font-size: 12px;\n      line-height: 18px;\n    }\n\n    .gate-value-row {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 8px;\n      margin-top: 7px;\n    }\n\n    .gate-value {\n      color: #111827;\n      font-size: 22px;\n      font-weight: 700;\n    }\n\n    .gate-minimum {\n      color: #7A8291;\n      font-size: 11px;\n    }\n\n    .gate-check {\n      color: #0051FF;\n      font-size: 14px;\n      font-weight: 700;\n    }\n\n    .gate-summary {\n      margin-top: 14px;\n      color: #0051FF;\n      font-size: 13px;\n      font-weight: 600;\n    }\n\n    .signal-grid {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 16px;\n      max-width: 808px;\n      margin-bottom: 38px;\n    }\n\n    .signal-card {\n      min-height: 180px;\n      padding: 22px;\n      border-radius: 15px;\n      background: #FFFFFF;\n      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);\n    }\n\n    .signal-caption {\n      margin-top: 12px;\n      color: #7A8291;\n      font-size: 11px;\n      line-height: 18px;\n    }\n\n    .signal-number {\n      margin: 18px 0 4px;\n      color: #111827;\n      font-size: 34px;\n      font-weight: 700;\n    }\n\n    .signal-denominator {\n      color: #697080;\n      font-size: 12px;\n    }\n\n    .mini-bars {\n      display: flex;\n      flex-direction: column;\n      gap: 9px;\n      margin-top: 16px;\n    }\n\n    .mini-bar-row {\n      display: grid;\n      grid-template-columns: 78px 1fr 34px;\n      align-items: center;\n      gap: 9px;\n      color: #697080;\n      font-size: 11px;\n    }\n\n    .mini-bar-track {\n      height: 7px;\n      overflow: hidden;\n      border-radius: 10px;\n      background: #E9ECF2;\n    }\n\n    .mini-bar-fill {\n      height: 100%;\n      border-radius: 10px;\n      background: linear-gradient(90deg, #4262FF, #7C3AED);\n    }\n\n    .weekly-chart {\n      display: flex;\n      align-items: end;\n      gap: 8px;\n      height: 82px;\n      margin-top: 14px;\n    }\n\n    .week-column {\n      display: flex;\n      flex: 1;\n      flex-direction: column;\n      align-items: center;\n      justify-content: end;\n      height: 100%;\n      gap: 4px;\n      color: #7A8291;\n      font-size: 9px;\n    }\n\n    .week-bar {\n      width: 100%;\n      max-width: 24px;\n      min-height: 4px;\n      border-radius: 5px 5px 2px 2px;\n      background: #0051FF;\n    }\n\n    .week-bar.partial {\n      opacity: 0.38;\n    }\n\n    .tag-list {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 8px;\n      margin-top: 16px;\n    }\n\n    .data-tag {\n      padding: 6px 11px;\n      border-radius: 20px;\n      background: #F2EEFF;\n      color: #4F46E5;\n      font-size: 11px;\n      font-weight: 600;\n    }\n\n    .filter-chips {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 9px;\n      max-width: 808px;\n      margin: 0 0 18px;\n    }\n\n    .filter-chip {\n      padding: 9px 16px;\n      border: 1px solid #DDE2EC;\n      border-radius: 30px;\n      background: #FFFFFF;\n      color: #606878;\n      font-family: inherit;\n      font-size: 12px;\n      font-weight: 600;\n      cursor: pointer;\n      transition: all 0.2s ease;\n    }\n\n    .filter-chip:hover,\n    .filter-chip.active {\n      border-color: #0051FF;\n      background: #0051FF;\n      color: #FFFFFF;\n    }\n\n    .review-badges {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 5px;\n      margin-top: 6px;\n    }\n\n    .review-badge {\n      padding: 2px 7px;\n      border-radius: 12px;\n      background: #F2EEFF;\n      color: #6B42FF;\n      font-size: 9px;\n      font-weight: 600;\n    }\n\n    #reviews-container-live .review-card-item {\n      align-items: flex-start;\n    }\n\n    #reviews-container-live .review-text-content {\n      display: block;\n      overflow: visible;\n      text-overflow: initial;\n      -webkit-line-clamp: initial;\n    }\n\n    .empty-evidence {\n      width: 808px;\n      padding: 30px;\n      border-radius: 15px;\n      background: rgba(255, 255, 255, 0.65);\n      color: #697080;\n      text-align: center;\n      font-size: 13px;\n    }\n\n    .ai-section-label {\n      display: inline-flex;\n      margin-bottom: 12px;\n      padding: 4px 11px;\n      border-radius: 20px;\n      background: #F2EEFF;\n      color: #6B42FF;\n      font-size: 11px;\n      font-weight: 600;\n    }\n\n    .ai-desc-container p + p {\n      margin-top: 16px;\n    }\n\n    .ai-desc-container strong {\n      display: block;\n      margin-bottom: 4px;\n      color: #111827;\n    }\n\n    @media (max-width: 1040px) {\n      .sidebar-fixed {\n        position: relative;\n        top: 0;\n        width: 100%;\n        height: auto;\n        min-height: 560px;\n      }\n\n      .app-layout {\n        flex-direction: column;\n      }\n\n      .main-content {\n        margin-left: 0;\n        padding: 42px 24px 80px;\n      }\n\n      .gate-list,\n      .signal-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .review-card-item,\n      .empty-evidence {\n        width: 100%;\n      }\n    }\n\n    /* 좁은 화면에서는 아직 연결되지 않은 보조 메뉴를 감추고 홈 로고를 유지한다. */\n    @media (max-width: 800px) {\n      .fixed-gnb-inner { width: 100%; padding: 0 20px; }\n      .fixed-gnb-inner > div { min-width: 0; gap: 16px !important; }\n      .fixed-gnb .nav-item { display: none; white-space: nowrap; }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n  \u003c!-- 상단 화면 전체(100%) 고정 네비게이션 바 (기존 페이지들과 100% 동일) -->\n  \u003cdiv class=\"fixed-gnb\">\n    \u003cdiv class=\"fixed-gnb-inner\">\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 50px; display: flex\">\n        \u003cdiv onclick=\"goHome()\" title=\"홈으로 이동\"\n          style=\"justify-content: center; display: flex; flex-direction: column; color: black; font-size: 44px; font-family: 'Iceland', cursive; font-weight: 400; line-height: 1.2; cursor: pointer;\">\n          EUREKA\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">커뮤니티\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">요금제\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"justify-content: flex-start; align-items: center; gap: 48px; display: flex\">\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">로그인\u003c/div>\n        \u003cdiv class=\"nav-item\" style=\"color: black; font-size: 20px;\">마이페이지\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"app-layout\">\n    \u003c!-- =========================================================\n       1. 좌측 고정 네비게이션 패널 (스크롤 시에도 좌측 고정)\n       ========================================================= -->\n    \u003cdiv class=\"sidebar-fixed\">\n      \u003c!-- 뒤로가기 버튼 -->\n      \u003cdiv class=\"back-btn\" onclick=\"goBack()\" title=\"이전 화면으로 돌아가기\">\n        &lt; 뒤로가기\n      \u003c/div>\n\n      \u003c!-- 메인 타이틀 카드 (보라색 띠) -->\n      \u003cdiv class=\"purple-header-card\">\n        \u003cdiv class=\"purple-header-title\" id=\"side-problem-title\">\n          문제를 확인하고 있습니다\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 카테고리 태그 칩 -->\n      \u003cdiv class=\"category-chip\" id=\"side-problem-tag\">\n        \n      \u003c/div>\n\n      \u003c!-- 한 줄 설명 -->\n      \u003cdiv class=\"sub-quote-desc\" id=\"side-problem-desc\">\n        \n      \u003c/div>\n\n      \u003c!-- 수치 지표 (관련 사례 수 / 출처 수) -->\n      \u003cdiv class=\"metric-row\">\n        \u003cdiv class=\"metric-label\">관련 사례 수\u003c/div>\n        \u003cdiv class=\"metric-value-box\">\n          \u003cspan class=\"metric-num\" id=\"side-cases-count\">–\u003c/span>\n          \u003cspan class=\"metric-unit\">건\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"metric-row\">\n        \u003cdiv class=\"metric-label\">출처 수\u003c/div>\n        \u003cdiv class=\"metric-value-box\">\n          \u003cspan class=\"metric-num\" id=\"side-sources-count\">–\u003c/span>\n          \u003cspan class=\"metric-unit\">곳\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 하단 액션 버튼 그룹 -->\n      \u003cdiv class=\"sidebar-actions\">\n        \u003cdiv class=\"action-row-top\">\n          \u003cdiv class=\"btn-capsule-light\" id=\"btn-save-problem\" onclick=\"toggleSaveProblem()\">저 장\u003cspan class=\"star-icon\" id=\"star-icon-detail\">★\u003c/span>\u003c/div>\n          \u003cdiv class=\"btn-capsule-light action-locked\" role=\"button\" aria-disabled=\"true\" title=\"아이디어 기능은 준비 중입니다.\">\n            \u003csvg class=\"lock-icon\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M8 10V7a4 4 0 0 1 8 0v3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>아이디어 보기\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"btn-purple-main action-locked\" role=\"button\" aria-disabled=\"true\" title=\"개인화 기능은 준비 중입니다.\">\n          \u003csvg class=\"lock-icon\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"10\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M8 10V7a4 4 0 0 1 8 0v3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003c/svg>개인화 하기\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- =========================================================\n       2. 우측 메인 상세 내용 영역\n       ========================================================= -->\n    \u003cdiv class=\"main-content\">\n      \u003cdiv class=\"section-main-title\">실제 수집된 근거\u003c/div>\n      \u003cdiv class=\"prototype-note\">\n        실제 수집 결과를 확인합니다. 숫자는 AI가 만든 점수가 아니라\n        저장된 근거와 판정 라벨을 센 값이며, AI 판정 항목은 별도로 표시합니다.\n      \u003c/div>\n\n      \u003cdiv id=\"ai-review-status\" class=\"prototype-note\" role=\"status\" hidden>\u003c/div>\n\n      \u003c!-- ⑧ 게시 신뢰 기준 -->\n      \u003cdiv class=\"sub-blue-header\">이 문제를 믿어도 되는가\u003c/div>\n      \u003csection class=\"evidence-block\" aria-labelledby=\"trust-heading\">\n        \u003cdiv class=\"block-heading-row\">\n          \u003ch2 class=\"block-heading\" id=\"trust-heading\">게시 기준 체크리스트\u003c/h2>\n          \u003cspan class=\"gate-check\" id=\"gate-result\">기준 확인 중\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"gate-list\" id=\"gate-list\">\u003c/div>\n        \u003cp class=\"gate-summary\" id=\"gate-summary\">\u003c/p>\n      \u003c/section>\n\n      \u003c!-- ④⑦ 핵심 분포 -->\n      \u003cdiv class=\"stat-cards-grid\">\n        \u003cdiv class=\"stat-card-box\">\n          \u003cdiv class=\"stat-card-title\">수집된 근거의 주별 분포\u003c/div>\n          \u003cdiv class=\"weekly-chart\" id=\"weekly-chart\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stat-card-box\">\n          \u003cdiv class=\"stat-card-title\">불편 강도 \u003cspan class=\"ai-badge\">AI 판정\u003c/span>\u003c/div>\n          \u003cdiv class=\"mini-bars\" id=\"severity-bars\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stat-card-box\">\n          \u003cdiv class=\"stat-card-title\">해결책을 원한 언급\u003c/div>\n          \u003cdiv class=\"count-big-num\" id=\"need-mention-count-live\">0건\u003c/div>\n          \u003cdiv class=\"signal-denominator\" id=\"need-denominator\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cp class=\"prototype-note\">\n        최신순 검색 결과에서 수집한 표본이므로 위 그래프는 화제성이나 증가 추세가 아니라,\n        수집 창 안에서 발견된 글의 작성일 분포입니다.\n      \u003c/p>\n\n      \u003c!-- ①⑤② 보조 신호 -->\n      \u003cdiv class=\"signal-grid\">\n        \u003csection class=\"signal-card\">\n          \u003cdiv class=\"block-heading\">돈이 걸린 문제인가\u003c/div>\n          \u003cdiv class=\"signal-number\" id=\"payment-count\">0건\u003c/div>\n          \u003cdiv class=\"signal-denominator\" id=\"payment-denominator\">\u003c/div>\n          \u003cdiv class=\"signal-caption\">지불 의사를 추정하지 않고 원문에 돈 관련 표현이 등장한 근거만 셉니다.\u003c/div>\n        \u003c/section>\n        \u003csection class=\"signal-card\">\n          \u003cdiv class=\"block-heading-row\">\n            \u003cdiv class=\"block-heading\">누가 겪고 있나\u003c/div>\n            \u003cspan class=\"ai-badge\">AI 판정\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"tag-list\" id=\"role-tags\">\u003c/div>\n          \u003cdiv class=\"signal-caption\" id=\"role-denominator\">\u003c/div>\n        \u003c/section>\n        \u003csection class=\"signal-card\">\n          \u003cdiv class=\"block-heading\">어디서 말하고 있나\u003c/div>\n          \u003cdiv class=\"mini-bars\" id=\"source-bars\">\u003c/div>\n        \u003c/section>\n        \u003csection class=\"signal-card\">\n          \u003cdiv class=\"block-heading-row\">\n            \u003cdiv class=\"block-heading\">이미 나와 있는 것들\u003c/div>\n            \u003cspan class=\"ai-badge\">AI 판정\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"tag-list\" id=\"service-tags\">\u003c/div>\n          \u003cdiv class=\"signal-caption\">원문에 직접 언급된 서비스 이름만 셉니다. 시장 전체의 경쟁 서비스 목록이 아닙니다.\u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003c!-- ⑨ 근거 목록 -->\n      \u003cdiv class=\"sub-blue-header\">실제 사용자 불편 \u003cspan id=\"evidence-total\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"filter-chips\" id=\"evidence-filters\" aria-label=\"근거 필터\">\n        \u003cbutton type=\"button\" class=\"filter-chip active\" data-filter=\"all\" aria-pressed=\"true\">전체\u003c/button>\n        \u003cbutton type=\"button\" class=\"filter-chip\" data-filter=\"strong\" aria-pressed=\"false\">강한 불만\u003c/button>\n        \u003cbutton type=\"button\" class=\"filter-chip\" data-filter=\"payment\" aria-pressed=\"false\">돈 언급\u003c/button>\n        \u003cbutton type=\"button\" class=\"filter-chip\" data-filter=\"need\" aria-pressed=\"false\">해결책 탐색\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"review-cards-list\" id=\"reviews-container-live\" aria-live=\"polite\">\u003c/div>\n\n      \u003c!-- ⑥③ AI 설명 -->\n      \u003cdiv class=\"sub-blue-header\" style=\"font-size: 22px; margin-bottom: 12px;\">유레카가 생성한 설명\u003c/div>\n      \u003cspan class=\"ai-section-label\">AI 생성 설명\u003c/span>\n      \u003cdiv class=\"ai-desc-container\" id=\"ai-desc-box-live\">\u003c/div>\n\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    function goBack() {\n      if (parent.__hasPrevious) {\n        parent.history.back();\n      } else {\n        parent.__navigate('result.html');\n      }\n    }\n\n    function goHome() {\n      parent.__navigate('index.html');\n    }\n\n\n    let isProblemSaved = false;\n    function toggleSaveProblem() {\n      if (!itemData) return;\n      isProblemSaved = !isProblemSaved;\n      const btn = document.getElementById('btn-save-problem');\n      if (isProblemSaved) {\n        btn.classList.add('saved');\n        alert(\"해당 문제가 저장되었습니다! ★\");\n      } else {\n        btn.classList.remove('saved');\n        alert(\"문제 저장이 취소되었습니다.\");\n      }\n    }\n\n    // 실제 API 또는 명시적 검토 파일의 데이터만 조회한다.\n    // URL 파라미터 또는 localStorage에서 파싱\n    const urlParams = new URLSearchParams(parent.__search);\n    const isLive = true;\n    const targetId = urlParams.get('id') || '';\n    const items = (parent.__problems || []).map(p => ({\n      ...p, cases: p.case_count, sources: p.source_count, tag: p.category, desc: p.one_liner,\n      evidence: p.evidence.map(e => ({...e, source_name: e.source_name || '출처 미기록'})),\n    }));\n    const itemData = items.find(d => String(d.id) === targetId);\n    if (!itemData) {\n      document.querySelector('.main-content').innerHTML = '\u003ch1>문제를 찾을 수 없습니다\u003c/h1>\u003cp>이 파일에 포함되지 않았거나 게시되지 않은 문제입니다.\u003c/p>\u003cbutton onclick=\"goBack()\">문제 목록으로\u003c/button>';\n      document.getElementById('side-problem-title').textContent = '문제 없음';\n      document.getElementById('side-problem-desc').textContent = '';\n      document.getElementById('side-problem-tag').textContent = '';\n      document.getElementById('side-problem-tag').hidden = true;\n      const saveButton = document.getElementById('btn-save-problem');\n      saveButton.onclick = null;\n      saveButton.classList.add('action-locked');\n      saveButton.setAttribute('aria-disabled', 'true');\n      saveButton.setAttribute('title', '표시할 문제가 없어 저장할 수 없습니다.');\n      document.getElementById('side-cases-count').textContent = '–';\n      document.getElementById('side-sources-count').textContent = '–';\n    }\n    if (isLive && itemData) document.querySelector('.prototype-note').textContent = ['review','live'].includes(parent.__dataMode)\n      ? '이번 탐색의 실제 수집 근거로 만든 검토용 문제입니다. 게시 기준과 AI 검수 결과를 함께 확인하세요. AI 서술과 코드 집계를 구분해 확인하세요.'\n      : '실제 수집 근거로 만든 문제입니다. 집계는 코드가 계산하며, AI 서술과 판정은 별도로 표시합니다.';\n\n    if (isLive && itemData && ['review','live'].includes(parent.__dataMode)) {\n      const review = parent.__reviews?.[itemData.id];\n      const reviewStatus = document.getElementById('ai-review-status');\n      reviewStatus.hidden = false;\n      const decisionLabels = {publish: '게시 의견 (최종 게시 여부와 별도)', hold: '보류', merge: '기존 문제와 병합 필요'};\n      reviewStatus.textContent = review\n        ? `AI 검수: ${decisionLabels[review.decision] || '확인 필요'} / 사유: ${review.reason || '사유 미기록'}`\n        : 'AI 검수 결과가 이 파일에 포함되지 않았습니다. 게시 가능한 문제로 확정된 상태가 아닙니다.';\n    }\n\n    function escapeHtml(value) {\n      return String(value)\n        .replaceAll('&', '&amp;')\n        .replaceAll('\u003c', '&lt;')\n        .replaceAll('>', '&gt;')\n        .replaceAll('\"', '&quot;')\n        .replaceAll(\"'\", '&#039;');\n    }\n\n    function renderBars(containerId, entries, denominator) {\n      const container = document.getElementById(containerId);\n      const maximum = Math.max(...entries.map(([, count]) => count), 1);\n      container.innerHTML = entries.map(([label, count]) => `\n        \u003cdiv class=\"mini-bar-row\">\n          \u003cspan>${escapeHtml(label)}\u003c/span>\n          \u003cdiv class=\"mini-bar-track\">\u003cdiv class=\"mini-bar-fill\" style=\"width:${Math.round(count / maximum * 100)}%\">\u003c/div>\u003c/div>\n          \u003cstrong>${count}\u003c/strong>\n        \u003c/div>\n      `).join('') + (denominator ? `\u003cdiv class=\"signal-caption\">판정 가능한 ${denominator}건 기준\u003c/div>` : '');\n    }\n\n    function renderGate() {\n      const gate = itemData.gate;\n      const rows = [\n        { label: '관련 사례', actual: itemData.cases, minimum: gate.min_cases, ok: gate.case_count_ok, unit: '건' },\n        { label: '서로 다른 출처', actual: itemData.sources, minimum: gate.min_sources, ok: gate.source_count_ok, unit: '곳' },\n        { label: '공개 대표 근거', actual: itemData.evidence.length, minimum: gate.min_evidence, ok: gate.evidence_count_ok, unit: '건' }\n      ];\n      document.getElementById('gate-result').textContent = gate.passed ? '✓ 게시 기준 통과' : '게시 보류';\n      document.getElementById('gate-list').innerHTML = rows.map(row => `\n        \u003cdiv class=\"gate-item\">\n          \u003cdiv class=\"gate-label\">${row.label}\u003c/div>\n          \u003cdiv class=\"gate-value-row\">\n            \u003cspan class=\"gate-value\">${row.actual}${row.unit}\u003c/span>\n            \u003cspan class=\"gate-check\">${row.ok ? '✓' : '–'}\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"gate-minimum\">최소 ${row.minimum}${row.unit}\u003c/div>\n        \u003c/div>\n      `).join('');\n      document.getElementById('gate-summary').textContent = gate.passed\n        ? `사례 ${gate.min_cases}건 · 출처 ${gate.min_sources}곳 · 대표 근거 ${gate.min_evidence}건 기준을 모두 충족했습니다.`\n        : (gate.reason || '일부 공개 기준을 충족하지 못했습니다.');\n    }\n\n    function renderSignals() {\n      const signals = itemData.signals;\n      const maxWeek = Math.max(...signals.weekly_counts.map(entry => entry.count), 1);\n      document.getElementById('weekly-chart').innerHTML = signals.weekly_counts.map(entry => `\n        \u003cdiv class=\"week-column\" title=\"${escapeHtml(entry.week)} ${entry.count}건\">\n          \u003cstrong>${entry.count}\u003c/strong>\n          \u003cdiv class=\"week-bar${entry.partial ? ' partial' : ''     try { requireServer(); } catch (error) { setError(error.message, saved); return; }
    if (!saved?.id) {
      setError(saved?.pending ? '실행 번호를 받기 전에 연결이 중단되었습니다.' : '탐색을 시작하려면 먼저 타겟 조건을 입력해 주세요.', saved);
      if (saved?.pending) setError('실행 번호를 받기 전에 연결이 중단되었습니다. 아래 재시도 버튼으로 같은 조건의 실행을 확인해 주세요.', saved);
      return;
    }
    state = {id:saved.id, target:saved.target, status:'restoring', message:'저장된 실행 상태를 확인하고 있습니다.'};
    notify();
    const version = ++requestVersion;
    activeRequest = poll(saved.id, version).finally(() => {activeRequest = null;});
    return activeRequest;
  }
  async function start(target, resumeFrom = null) {
    if (activeRequest) { await activeRequest; const saved = safeRead(); if (targetKey(saved?.target || {}) === targetKey(target) && (saved?.resume_from || null) === resumeFrom) return; }
    try { requireServer(); } catch (error) { setError(error.message, {target}); return; }
    clearTimeout(timer);
    const version = ++requestVersion;
    clearData();
    window.__collectionTarget = target;
    save({target, resume_from:resumeFrom, pending:true});
    state = {status:'submitting', target, message:resumeFrom ? '남은 검색·분석 자료의 추가 탐색을 요청하고 있습니다.' : '입력한 조건으로 탐색을 요청하고 있습니다.'};
    notify();
    activeRequest = (async () => {
      try { accept(await api('/collections', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(resumeFrom ? {target, resume_from:resumeFrom} : {target})}), version); }
      catch (error) { if (version === requestVersion) setError(error.message); }
      finally { activeRequest = null; }
    })();
    return activeRequest;
  }
  async function retry() {
    const saved = safeRead();
    if (saved?.id && !['failed','legacy'].includes(state?.status)) { state = null; return resume(); }
    if (saved?.target) return start(saved.target, saved.pending ? saved.resume_from || null : null);
  }
  function canContinue(run = state) {
    if (run?.can_resume === false || (run?.current_plan_version && run?.plan_version && run.current_plan_version !== run.plan_version)) return false;
    return Boolean(run?.id && run.target_match_policy === 'evidence_v2' && ['completed','failed'].includes(run.status) && run.has_more === true);
  }
  function canStartFresh(run = state) {
    return Boolean(run?.target && run.current_plan_version && run.plan_version && run.current_plan_version !== run.plan_version && ['completed','failed'].includes(run.status));
  }
  function canView(run = state) {
    return Boolean(run?.id && run.target_match_policy === 'evidence_v2' && ['queued','running','completed','failed','connection_error'].includes(run.status));
  }
  async function continueSearch() {
    if (!canContinue()) return;
    return start(state.target, state.id);
  }
  window.__collections = {
    start, resume, retry, continueSearch, canContinue, canView, canStartFresh,
    getState: () => state,
    hasTarget: () => Boolean(safeRead()?.target),
    subscribe(fn) { listeners.add(fn); fn(state); return () => listeners.delete(fn); },
  };
  if (location.protocol === 'file:' && document.querySelector('.data-mode-label')) document.querySelector('.data-mode-label').textContent = '실제 탐색: 백엔드를 실행한 뒤 http://localhost:8000 에서 열어 주세요.';
})();

let depth = 0;
window.__navigate = function (target) {
  const url = new URL(target, 'https://eureka.local/');
  if (!pages[url.pathname.slice(1)] && !['idea.html','personalize.html','personalized-result.html','combination.html'].includes(url.pathname.slice(1))) return;
  depth += 1;
  history.pushState({depth}, '', '#' + url.pathname.slice(1) + url.search);
  setTimeout(render, 0);
};
function render() {
  const route = new URL(location.hash.slice(1) || 'index.html', 'https://eureka.local/');
  const requestedPage = route.pathname.slice(1);
  const waiting = window.__dataMode === 'live' && ['result.html','detail.html'].includes(requestedPage) && !window.__collections?.canView();
  window.__collectionDestination = waiting ? requestedPage + route.search : null;
  const locked = ['idea.html', 'personalize.html', 'personalized-result.html', 'combination.html'].includes(route.pathname.slice(1));
  const source = locked ? '<!doctype html><html lang="ko"><body><h1>준비 중인 기능입니다</h1><p>지금은 문제정의와 근거 확인까지 이용할 수 있습니다.</p></body></html>' : (pages[waiting ? 'loading.html' : route.pathname.slice(1)] || pages['index.html']);
  window.__search = route.search;
  window.__hasPrevious = depth > 0;
  const frame = document.createElement('iframe');
  frame.id = 'app';
  frame.title = 'EUREKA';
  document.getElementById('app').replaceWith(frame);
  const doc = frame.contentDocument;
  doc.open();
  doc.write(source);
  doc.close();
  document.title = doc.title || 'EUREKA';
}
history.replaceState({depth:0}, '', location.href);
window.addEventListener('popstate', function(event) {
  depth = event.state ? event.state.depth || 0 : 0;
  render();
});
render();
</script>
