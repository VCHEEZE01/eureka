 쪽이 최신인지 모르게 됐다는 사례",excerpt:"두 군데 다 있는데 내용이 조금씩 달라서 뭐가 맞는지 모르겠어요",sourceId:"p2-s1",postedAt:"2026-08-19"},{id:"p2-e2",summary:"도구 통합을 시도했다가 팀원 절반이 안 따라와서 되돌린 후기",sourceId:"p2-s1",postedAt:"2026-08-02"},{id:"p2-e3",summary:'"검색을 여러 앱에서 각각 해야 한다"는 불편을 리뷰에서 반복 지적',sourceId:"p2-s2",postedAt:"2026-07-25"}],sources:[{id:"p2-s1",name:"직장인 커뮤니티",kind:"커뮤니티",caseCount:58},{id:"p2-s2",name:"생산성 앱 리뷰",kind:"리뷰",caseCount:41},{id:"p2-s3",name:"생산성 블로그",kind:"블로그",caseCount:15}],caseCount:114,relatedIds:["p1","p3"],updatedAt:"2026-08-25"},{id:"p3",title:"반복 보고서를 매번 손으로 다시 만든다",oneLiner:"주간·월간 보고의 형식은 같은데 매번 자료를 새로 모아 붙여넣는다.",category:"생산성/업무",description:"자동화하고 싶다는 욕구는 뚜렷한데, 데이터가 여러 곳에 흩어져 있고 형식이 조금씩 달라 손을 못 대는 상태가 길게 이어진다.",context:"엑셀·스프레드시트를 쓰는 실무자에게서 특히 자주 나온다. 개발 지식이 없어 자동화 도구 진입에 부담을 느낀다는 언급이 함께 붙는다.",evidence:[{id:"p3-e1",summary:"매주 같은 표를 다시 만드는 데 반나절이 걸린다는 호소",excerpt:"숫자만 바뀌는데 매번 처음부터 만들고 있어요",sourceId:"p3-s1",postedAt:"2026-08-17"},{id:"p3-e2",summary:"자동화 도구를 알아봤지만 어디서 시작할지 몰라 포기했다는 글",sourceId:"p3-s1",postedAt:"2026-08-05"},{id:"p3-e3",summary:"보고서 양식이 부서마다 달라 통합이 어렵다는 지적",sourceId:"p3-s2",postedAt:"2026-07-19"}],sources:[{id:"p3-s1",name:"직장인 커뮤니티",kind:"커뮤니티",caseCount:63},{id:"p3-s2",name:"실무 노하우 블로그",kind:"블로그",caseCount:26}],caseCount:89,relatedIds:["p1","p2"],updatedAt:"2026-08-22"},{id:"p4",title:"공부한 걸 정리해두지만 다시 찾아보지 않는다",oneLiner:"강의·아티클을 열심히 저장하는데 저장함이 무덤이 된다.",category:"커리어/자기계발",description:"저장 자체는 쉬운데 꺼내 쓰는 계기가 없다는 점이 공통으로 지적된다. 나중에 볼 것이라 믿고 쌓아두지만 다시 열어보는 비율은 매우 낮다고 스스로 진단한다.",context:"북마크·읽기 목록·노트 앱을 함께 쓰는 사람에게서 두드러진다. 저장한 사실 자체를 잊는 경우도 많다.",evidence:[{id:"p4-e1",summary:"읽기 목록에 300개 넘게 쌓였는데 실제로 다시 읽은 건 손에 꼽는다는 고백",excerpt:"저장할 땐 꼭 읽을 것 같은데 한 번도 안 열어봤어요",sourceId:"p4-s1",postedAt:"2026-08-23"},{id:"p4-e2",summary:"노트를 정리하는 데 시간을 다 쓰고 정작 복습은 못 한다는 반성 글",sourceId:"p4-s1",postedAt:"2026-08-09"},{id:"p4-e3",summary:'"저장은 되는데 다시 알려주는 기능이 없다"는 앱 리뷰 지적',sourceId:"p4-s2",postedAt:"2026-07-28"},{id:"p4-e4",summary:"강의를 다 듣고도 남는 게 없다는 느낌에 대한 토론 스레드",sourceId:"p4-s3",postedAt:"2026-07-14"}],sources:[{id:"p4-s1",name:"자기계발 커뮤니티",kind:"커뮤니티",caseCount:82},{id:"p4-s2",name:"노트 앱 리뷰",kind:"리뷰",caseCount:37},{id:"p4-s3",name:"학습 소셜",kind:"소셜",caseCount:24}],caseCount:143,relatedIds:["p5","p6"],updatedAt:"2026-08-30"},{id:"p5",title:"내가 한 일을 나중에 설명하지 못한다",oneLiner:"이직·평가 시점에 지난 성과를 기억해내지 못해 처음부터 뒤진다.",category:"커리어/자기계발",description:'기록을 남기지 않아서가 아니라, 남긴 기록이 성과 형태가 아니어서 쓸 수 없다는 진단이 반복된다. 업무 로그는 있는데 "무엇을 개선했는가"로 번역하는 과정이 통째로 빠져 있다.',context:"연말 평가나 이직 준비를 시작하는 시점에 집중적으로 언급된다. 몇 달 전 일은 이미 세부가 사라진 뒤라 복원 비용이 크다.",evidence:[{id:"p5-e1",summary:"이력서를 쓰려는데 작년에 뭘 했는지 기억이 안 난다는 글",excerpt:"분명 바빴는데 막상 적으려니까 쓸 게 없어요",sourceId:"p5-s1",postedAt:"2026-08-26"},{id:"p5-e2",summary:"평가 자료를 만들려고 1년 치 메신저를 거슬러 올라갔다는 경험",sourceId:"p5-s1",postedAt:"2026-08-11"},{id:"p5-e3",summary:"업무 기록은 있지만 성과 문장으로 바꾸는 게 제일 어렵다는 반응",sourceId:"p5-s2",postedAt:"2026-07-22"}],sources:[{id:"p5-s1",name:"커리어 커뮤니티",kind:"커뮤니티",caseCount:69},{id:"p5-s2",name:"이직 정보 블로그",kind:"블로그",caseCount:31}],caseCount:100,relatedIds:["p4","p6"],updatedAt:"2026-08-27"},{id:"p6",title:"사이드 프로젝트를 시작만 하고 끝내지 못한다",oneLiner:"만들 능력은 있는데 매번 초반에 멈추고 다음 아이템으로 넘어간다.",category:"커리어/자기계발",description:'기술 문제보다 "이걸 계속할 이유"가 사라지는 게 원인으로 지목된다. 초기에 반응을 확인할 방법이 없어 혼자 만들다 확신을 잃는 흐름이 반복된다.',context:"유레카의 타깃 사용자와 가장 가까운 문제다. 아이템 선정 단계에서 이미 확신이 약한 채로 시작한 경우 이탈이 더 빠르다.",evidence:[{id:"p6-e1",summary:"시작한 프로젝트가 폴더에만 열 개 넘게 쌓였다는 자조 섞인 글",excerpt:"만들다 만 게 너무 많아서 이제 새로 시작하기가 무서워요",sourceId:"p6-s1",postedAt:"2026-08-29"},{id:"p6-e2",summary:'"이게 진짜 필요한 건지 모르겠어서" 중단했다는 회고',sourceId:"p6-s1",postedAt:"2026-08-13"},{id:"p6-e3",summary:"아이템을 정하는 데만 몇 주를 쓰다 지쳤다는 토로",sourceId:"p6-s2",postedAt:"2026-08-01"},{id:"p6-e4",summary:"완성해도 쓸 사람이 없을 것 같아 동기가 떨어진다는 반응",sourceId:"p6-s3",postedAt:"2026-07-16"}],sources:[{id:"p6-s1",name:"개발자 커뮤니티",kind:"커뮤니티",caseCount:94},{id:"p6-s2",name:"메이커 소셜",kind:"소셜",caseCount:45},{id:"p6-s3",name:"사이드프로젝트 블로그",kind:"블로그",caseCount:19}],caseCount:158,relatedIds:["p4","p5"],updatedAt:"2026-09-01"},{id:"p7",title:"냉장고에 뭐가 있는지 몰라 같은 재료를 또 산다",oneLiner:"장은 봤는데 결국 버리는 재료가 생기고, 필요한 건 빠져 있다.",category:"라이프스타일",description:'기록하는 앱은 많지만 "넣을 때마다 입력"이라는 부담 때문에 유지되지 않는다는 반응이 공통이다. 며칠만 안 적어도 실제와 어긋나 신뢰를 잃는다.',context:"1~2인 가구에서 특히 자주 언급된다. 소분 포장이 적어 남는 재료가 생기는 구조적 요인도 함께 지적된다.",evidence:[{id:"p7-e1",summary:"같은 소스를 세 병째 사고 나서야 알았다는 경험담",excerpt:"냉장고 열어보고 사러 나가도 막상 마트에서는 기억이 안 나요",sourceId:"p7-s1",postedAt:"2026-08-20"},{id:"p7-e2",summary:"재고 관리 앱을 깔았지만 입력이 귀찮아 2주 만에 그만뒀다는 후기",sourceId:"p7-s2",postedAt:"2026-08-06"},{id:"p7-e3",summary:"유통기한을 지나 버리는 양이 아깝다는 반복 언급",sourceId:"p7-s1",postedAt:"2026-07-27"}],sources:[{id:"p7-s1",name:"생활 커뮤니티",kind:"커뮤니티",caseCount:76},{id:"p7-s2",name:"가계부 앱 리뷰",kind:"리뷰",caseCount:33}],caseCount:109,relatedIds:["p8","p9"],updatedAt:"2026-08-24"},{id:"p8",title:"구독 서비스가 몇 개인지, 얼마 나가는지 모른다",oneLiner:"안 쓰는 구독이 자동 결제되고 있는데 해지 시점을 놓친다.",category:"라이프스타일",description:"결제 내역을 모아 보는 수단이 카드사별로 흩어져 있어 전체 합계를 파악하기 어렵다는 점이 핵심으로 지목된다. 해지 경로가 서비스마다 달라 미루게 되는 흐름도 반복된다.",context:"무료 체험 후 자동 전환된 항목에서 특히 자주 발생한다. 금액이 소액이라 발견이 늦어지는 경향이 있다.",evidence:[{id:"p8-e1",summary:"1년 넘게 안 쓴 서비스가 결제되고 있었다는 사례",excerpt:"카드 내역 보다가 이게 뭐지 하고 찾아보니 재작년에 가입한 거였어요",sourceId:"p8-s1",postedAt:"2026-08-18"},{id:"p8-e2",summary:"구독 관리 앱이 일부 카드만 연동돼 반쪽짜리라는 리뷰 지적",sourceId:"p8-s2",postedAt:"2026-08-04"},{id:"p8-e3",summary:"해지 버튼을 찾기 어려워 미뤘다는 반응",sourceId:"p8-s1",postedAt:"2026-07-21"},{id:"p8-e4",summary:"가족 계정과 개인 계정이 섞여 누가 낸 건지 모른다는 글",sourceId:"p8-s3",postedAt:"2026-07-09"}],sources:[{id:"p8-s1",name:"생활 커뮤니티",kind:"커뮤니티",caseCount:88},{id:"p8-s2",name:"금융 앱 리뷰",kind:"리뷰",caseCount:40},{id:"p8-s3",name:"소비 뉴스",kind:"뉴스",caseCount:12}],caseCount:140,relatedIds:["p7","p9"],updatedAt:"2026-08-31"},{id:"p9",title:"주말에 뭘 할지 정하다가 주말이 끝난다",oneLiner:"선택지는 넘치는데 결정을 못 해 결국 아무것도 안 하고 보낸다.",category:"라이프스타일",description:"정보가 부족해서가 아니라 너무 많아서 생기는 문제로 진단된다. 추천 서비스가 많지만 조건(거리·예산·동행)이 반영되지 않아 다시 직접 골라야 한다는 지적이 붙는다.",context:"둘 이상이 함께 정할 때 지연이 더 커진다. 서로 의견을 묻다가 시간이 지나 무산되는 흐름이 반복된다.",evidence:[{id:"p9-e1",summary:"검색만 두 시간 하다 결국 집에 있었다는 글",excerpt:"찾다 보면 지쳐서 그냥 안 나가게 돼요",sourceId:"p9-s1",postedAt:"2026-08-16"},{id:"p9-e2",summary:"추천 목록이 광고 위주라 믿기 어렵다는 반응",sourceId:"p9-s2",postedAt:"2026-08-03"},{id:"p9-e3",summary:"동행자와 조건을 맞추는 과정이 제일 오래 걸린다는 언급",sourceId:"p9-s1",postedAt:"2026-07-24"}],sources:[{id:"p9-s1",name:"생활 커뮤니티",kind:"커뮤니티",caseCount:54},{id:"p9-s2",name:"장소 추천 리뷰",kind:"리뷰",caseCount:29}],caseCount:83,relatedIds:["p7","p8"],updatedAt:"2026-08-19"}],gS=new Map(sl.map(e=>[e.id,e]));function ea(e){return gS.get(e)}var TL=[{id:"i1-1",problemId:"p1",name:"결정 로그",oneLiner:'회의록 전체가 아니라 "결정된 문장"만 따로 쌓아 보여주는 기록장',target:"5~30명 규모 팀",serviceForm:"웹 서비스",whyLinked:'근거에서 반복된 건 "기록이 없다"가 아니라 "결론만 따로 볼 데가 없다"였다. 회의록을 대체하지 않고 결론만 분리해 쌓는 접근이다.',howItWorks:"회의 끝에 결정 문장 3~5줄만 입력한다. 각 결정에 안건·날짜·담당이 붙고, 이후 같은 안건이 다시 올라오면 과거 결정을 먼저 보여준다.",coreFeatures:["결정 문장 단위 기록","안건별 히스토리","재논의 시 과거 결정 알림","주간 결정 요약"],differentiator:"회의록 도구와 경쟁하지 않고 그 위에 얹힌다. 입력량이 적어 유지된다."},{id:"i1-2",problemId:"p1",name:"안건 되돌림 감지",oneLiner:"이미 결정된 안건이 다시 올라오면 그 자리에서 알려주는 메신저 봇",target:"메신저 중심으로 일하는 팀",serviceForm:"챗봇",whyLinked:'근거 중 "결정 사항이 스레드에 묻혀 검색으로도 못 찾는다"는 지적에 직접 대응한다. 찾으러 가지 않고 대화 흐름 안에서 해결한다.',howItWorks:'채널의 대화를 읽고 과거 결정과 겹치는 주제가 나오면 "이건 8/14에 이렇게 정해졌습니다"를 링크와 함께 붙여준다.',coreFeatures:["결정 문장 자동 추출","중복 안건 감지","스레드 내 즉시 회신","결정 번복 이력"],differentiator:"사람이 검색하러 가는 대신 봇이 먼저 끼어든다. 별도 앱을 열 필요가 없다."},{id:"i1-3",problemId:"p1",name:"한 장 회의 마무리",oneLiner:"회의 마지막 3분에 결론을 강제로 채우게 만드는 진행 도구",target:"회의 진행자",serviceForm:"웹 서비스",whyLinked:'"회의록을 쓰지만 아무도 안 읽는다"는 근거는 정리 시점이 늦다는 신호로 읽힌다. 정리를 회의 안으로 끌어들이는 접근이다.',howItWorks:"회의 시작 시 타이머를 켜고, 종료 3분 전 결론 입력 화면이 자동으로 뜬다. 채우지 않으면 회의가 종료되지 않은 상태로 남는다.",coreFeatures:["종료 전 결론 프롬프트","미완료 회의 표시","참석자 확인 체크","한 장 요약 공유"],differentiator:"기록을 사후 작업이 아니라 회의의 마지막 순서로 만든다."},{id:"i2-1",problemId:"p2",name:"통합 검색 한 줄",oneLiner:"쓰던 도구는 그대로 두고 검색만 한곳에서 하는 브라우저 확장",target:"도구 3개 이상 쓰는 실무자",serviceForm:"브라우저 확장",whyLinked:"근거에서 도구 통합 시도는 팀원 미참여로 실패했다. 이전을 요구하지 않고 검색 레이어만 얹는 접근이다.",howItWorks:"단축키를 누르면 어디서든 검색창이 뜨고, 연결해 둔 도구들을 한 번에 훑어 결과를 한 목록으로 보여준다.",coreFeatures:["전역 단축키 검색","도구별 결과 묶음","최근 문서 바로가기","검색 기록"],differentiator:"도구를 바꾸라고 요구하지 않는다. 혼자 설치해도 효과가 난다."},{id:"i2-2",problemId:"p2",name:"최신본 표시기",oneLiner:"같은 내용이 여러 곳에 있을 때 어느 쪽이 최신인지 알려주는 서비스",target:"문서를 중복 관리하는 팀",serviceForm:"웹 서비스",whyLinked:'"두 군데 다 있는데 내용이 조금씩 달라 뭐가 맞는지 모르겠다"는 근거에 직접 대응한다.',howItWorks:"연결된 도구에서 비슷한 문서를 찾아 짝으로 묶고, 수정 시각과 차이 나는 문단을 나란히 보여준다.",coreFeatures:["유사 문서 짝 찾기","변경 시점 비교","차이 문단 강조","대표본 지정"],differentiator:"중복을 없애라고 하지 않고, 중복인 채로 안전하게 쓰게 한다."},{id:"i2-3",problemId:"p2",name:"오늘의 흩어짐 리포트",oneLiner:"하루 동안 어디에 뭘 남겼는지 저녁에 한 번 모아 보내주는 알림",target:"개인 지식 관리자",serviceForm:"자동화 스크립트",whyLinked:'"어디에 적었는지 잊는다"는 문제의 핵심은 기억이다. 하루 단위로 되짚어주면 위치 기억이 유지된다.',howItWorks:"연결된 도구의 그날 생성·수정 항목을 모아 저녁에 한 통으로 보낸다. 각 항목은 바로 열리는 링크로 붙는다.",coreFeatures:["일일 활동 수집","도구별 묶음 요약","바로가기 링크","주간 회고 모음"],differentiator:"검색이 아니라 회상을 돕는다. 구축 부담이 가장 작다."},{id:"i3-1",problemId:"p3",name:"양식 고정 보고서",oneLiner:"한 번 만든 보고서 틀에 숫자만 갈아 끼우는 도구",target:"주간 보고를 쓰는 실무자",serviceForm:"웹 서비스",whyLinked:'"숫자만 바뀌는데 매번 처음부터 만든다"는 근거에 그대로 대응한다. 형식과 데이터를 분리한다.',howItWorks:"기존 보고서를 올리면 고정 문구와 변동 값을 구분해 틀로 만든다. 다음 주에는 값만 채우면 같은 형식이 나온다.",coreFeatures:["보고서 틀 자동 추출","값 입력 폼","지난 회차 비교","내보내기"],differentiator:"자동화 도구를 배우지 않아도 된다. 쓰던 보고서가 그대로 틀이 된다."},{id:"i3-2",problemId:"p3",name:"표 이어붙이기 봇",oneLiner:"흩어진 스프레드시트를 정해둔 규칙대로 합쳐주는 자동화",target:"여러 부서 자료를 취합하는 담당자",serviceForm:"자동화 스크립트",whyLinked:'"부서마다 양식이 달라 통합이 어렵다"는 근거가 취합 단계의 병목을 가리킨다.',howItWorks:"부서별 시트의 열 이름을 한 번 매칭해두면, 이후 같은 규칙으로 합쳐 하나의 표를 만든다.",coreFeatures:["열 이름 매칭 저장","형식 불일치 경고","정기 실행","변경분만 갱신"],differentiator:"양식 통일을 요구하지 않는다. 다른 채로 합친다."},{id:"i3-3",problemId:"p3",name:"보고서 첫 문단 쓰기",oneLiner:"표는 있는데 설명 문구를 못 쓰는 사람을 위한 요약 도우미",target:"보고서 작성 부담을 느끼는 실무자",serviceForm:"웹 서비스",whyLinked:"반복 작업 중 시간이 가장 오래 걸리는 지점이 표가 아니라 해석 문장이라는 점에 착안했다.",howItWorks:"표를 붙여넣으면 전주 대비 변화가 큰 항목을 짚어 초안 문장을 제안한다. 사용자는 고쳐 쓰기만 한다.",coreFeatures:["변화 지점 감지","초안 문장 제안","어투 설정","지난 표현 재사용"],differentiator:"데이터 연결 없이 붙여넣기만으로 쓸 수 있어 진입 부담이 낮다."},{id:"i4-1",problemId:"p4",name:"되돌아오는 저장함",oneLiner:"저장한 글을 잊을 만할 때 다시 꺼내 보여주는 서비스",target:"읽기 목록이 쌓인 사람",serviceForm:"웹 서비스",whyLinked:'"저장은 되는데 다시 알려주는 기능이 없다"는 근거에 직접 대응한다. 저장이 아니라 재등장이 빠진 기능이다.',howItWorks:"저장 시점에 다시 볼 시기를 자동으로 정하고, 그때 한 건씩만 보여준다. 다시 안 볼 것은 그 자리에서 버린다.",coreFeatures:["재등장 일정 자동 배정","하루 한 건 제한","즉시 정리 버튼","실제로 다시 본 비율"],differentiator:"저장함을 늘리지 않고 줄이는 방향으로 설계한다."},{id:"i4-2",problemId:"p4",name:"한 줄만 남기기",oneLiner:"저장할 때 왜 저장하는지 한 줄을 강제로 적게 하는 확장",target:"북마크를 습관적으로 누르는 사람",serviceForm:"브라우저 확장",whyLinked:'"저장할 땐 꼭 읽을 것 같은데 한 번도 안 열어봤다"는 근거는 저장 기준이 없다는 신호다.',howItWorks:'저장 버튼을 누르면 "이걸 언제 쓸 것 같은가"를 한 줄로 묻는다. 이 한 줄이 나중에 검색 키워드가 된다.',coreFeatures:["저장 시 한 줄 입력","용도별 분류","한 줄로 검색","용도 없는 항목 정리 제안"],differentiator:"분류 체계를 만들지 않아도 되고, 입력이 한 줄이라 유지된다."},{id:"i4-3",problemId:"p4",name:"내 말로 바꾸기",oneLiner:"저장한 자료를 스스로 설명해보게 만드는 복습 앱",target:"강의를 듣고 남는 게 없다고 느끼는 사람",serviceForm:"모바일 앱",whyLinked:'"강의를 다 듣고도 남는 게 없다"는 근거는 입력만 있고 출력이 없다는 뜻으로 읽힌다.',howItWorks:"저장한 자료 중 하나를 골라 짧게 설명을 녹음하거나 적게 한다. 설명한 항목만 정리 완료로 넘어간다.",coreFeatures:["설명 남기기","설명 완료 표시","지난 설명 모아보기","주간 정리 현황"],differentiator:"읽었는지가 아니라 설명할 수 있는지로 완료를 판단한다."},{id:"i5-1",problemId:"p5",name:"성과 문장 적립",oneLiner:"주 1회 3분, 이번 주에 바꾼 것을 성과 문장으로 남기는 서비스",target:"평가·이직을 앞둔 직장인",serviceForm:"웹 서비스",whyLinked:"근거는 기록이 없어서가 아니라 성과 형태로 번역되지 않아 못 쓴다고 말한다. 번역을 매주로 쪼갠다.",howItWorks:'매주 한 번 "무엇을 어떻게 개선했고 결과가 어땠는지" 세 칸을 채운다. 쌓이면 이력서 문단으로 묶어준다.',coreFeatures:["주간 3칸 입력","성과 문장 변환","기간별 묶음","이력서 형식 내보내기"],differentiator:"연말에 1년을 복원하지 않고 매주 조금씩 적립한다."},{id:"i5-2",problemId:"p5",name:"업무 로그 번역기",oneLiner:"이미 쌓인 업무 기록을 성과 문장으로 바꿔주는 도구",target:"기록은 있지만 정리가 안 된 사람",serviceForm:"웹 서비스",whyLinked:'"업무 기록은 있지만 성과 문장으로 바꾸는 게 제일 어렵다"는 근거를 그대로 다룬다.',howItWorks:"기존 기록을 붙여넣으면 행동·변화·결과 구조로 재구성한 초안을 만든다. 사용자는 사실 여부만 확인한다.",coreFeatures:["기록 붙여넣기","성과 구조 재구성","수치 자리 표시","표현 톤 선택"],differentiator:"새로 기록하게 하지 않고 있는 것을 활용한다."},{id:"i5-3",problemId:"p5",name:"분기 회고 알림",oneLiner:"3개월마다 지난 일을 되짚게 하는 가벼운 알림 봇",target:"기록 습관이 없는 사람",serviceForm:"챗봇",whyLinked:'"몇 달 전 일은 이미 세부가 사라진다"는 맥락에 맞춰, 복원 가능한 주기로 끊어 묻는다.',howItWorks:"분기마다 몇 가지 질문을 순서대로 던지고 답을 모아 기록으로 저장한다. 답변은 짧아도 된다.",coreFeatures:["분기 질문 세트","대화형 응답 수집","분기별 기록 보관","연간 모아보기"],differentiator:"별도 앱을 열지 않고 대화만으로 끝난다. 만들기도 가장 간단하다."},{id:"i6-1",problemId:"p6",name:"만들기 전 반응 확인",oneLiner:"코드를 짜기 전에 한 장짜리 소개로 반응부터 받아보는 서비스",target:"아이템 확신이 없는 메이커",serviceForm:"웹 서비스",whyLinked:'"이게 진짜 필요한 건지 모르겠어서 중단했다"는 근거는 검증이 개발 뒤에 온다는 순서 문제를 가리킨다.',howItWorks:"아이디어를 한 장 소개 페이지로 만들어 공유하고, 관심 표시와 코멘트를 모아 계속할지 판단한다.",coreFeatures:["한 장 소개 페이지 생성","관심 표시 수집","코멘트 모아보기","중단·계속 판단 기준"],differentiator:"만들기 전에 답을 얻는다. 유레카 흐름과 바로 이어진다."},{id:"i6-2",problemId:"p6",name:"중단 지점 기록",oneLiner:"멈춘 프로젝트가 왜 멈췄는지 남겨 다음 선택을 돕는 도구",target:"시작만 반복하는 사람",serviceForm:"웹 서비스",whyLinked:'"만들다 만 게 너무 많아 새로 시작하기 무섭다"는 근거는 실패 이유가 축적되지 않는다는 뜻이다.',howItWorks:"프로젝트를 접을 때 이유를 한 가지 고른다. 쌓이면 자신이 주로 어디서 멈추는지 패턴이 보인다.",coreFeatures:["중단 이유 기록","중단 패턴 요약","재시작 후보 표시","완주한 것 모아보기"],differentiator:"완주를 강요하지 않는다. 중단을 데이터로 바꾼다."},{id:"i6-3",problemId:"p6",name:"2주 완주 틀",oneLiner:"범위를 2주로 강제로 잘라주는 사이드 프로젝트 계획 앱",target:"범위를 크게 잡는 1인 개발자",serviceForm:"모바일 앱",whyLinked:'"아이템 정하는 데만 몇 주를 쓰다 지쳤다"는 근거는 시작 단계가 너무 길다는 신호다.',howItWorks:"아이디어를 넣으면 2주 안에 끝낼 수 있는 크기로 잘라 제안한다. 넘치는 기능은 다음 회차로 밀어둔다.",coreFeatures:["범위 자동 축소 제안","2주 일정 배치","기능 미루기 목록","완주 기록"],differentiator:"아이디어를 줄이는 방향으로 돕는다. 계획 도구와 반대 방향이다."},{id:"i7-1",problemId:"p7",name:"영수증만 찍기",oneLiner:"장 본 영수증 한 장으로 재고를 채우는 앱",target:"1~2인 가구",serviceForm:"모바일 앱",whyLinked:'"입력이 귀찮아 2주 만에 그만뒀다"는 근거가 핵심 이탈 지점이다. 입력을 한 번으로 줄인다.',howItWorks:"영수증을 촬영하면 품목을 읽어 재고에 넣는다. 소비는 대략적인 기간으로 자동 차감하고 필요할 때만 고친다.",coreFeatures:["영수증 인식 입력","자동 차감 추정","유통기한 알림","중복 구매 경고"],differentiator:"정확한 재고 대신 대략 맞는 재고를 목표로 해 유지 부담을 없앤다."},{id:"i7-2",problemId:"p7",name:"마트 앞 확인",oneLiner:"마트에 도착하면 집에 있는 것만 알려주는 알림",target:"장보기 담당자",serviceForm:"모바일 앱",whyLinked:'"냉장고 열어보고 나가도 마트에서는 기억이 안 난다"는 근거는 필요
